<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fe y Vida Quest</title>
<style>
  :root{
    --gold:#D9A63B;
    --magenta:#D6247A;
    --teal:#0FA3A0;
    --purple:#5A2E86;
    --purple-dark:#3A1C5A;
    --cream:#FFF8EC;
    --ink:#2A1A3A;
    --glow: rgba(255,215,0,.85);
    --danger:#C43B3B;
    --good:#2E9E4F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  /* This is a game, not a document: tapping or holding a button, tile or text must
     never highlight it as if it were being copied, and a long press must not open
     the iOS copy/save-image bubble (2026-10-19, per Dan). */
  #app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  #app img{-webkit-user-drag:none;user-drag:none;}
  button{touch-action:manipulation;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 50% 0%, var(--purple) 0%, var(--purple-dark) 55%, #200f33 100%);
    color:var(--cream);
    height:100%;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    /* Fixed height (not min-height) + its own overflow-y, not 100vh alone —
       on iOS Safari 100vh is measured against the viewport with the address
       bar hidden, which is taller than what's actually visible when the bar
       is showing (the normal state). min-height:100vh then let the WHOLE
       page grow past the real visible area, making the entire screen
       vertically scrollable even though nothing on it actually needed to
       scroll. 100dvh (dynamic viewport height, iOS 15.4+) tracks the real
       visible height instead; html/body get overflow:hidden so any residual
       mismatch scrolls only inside #app, never the whole page. */
    height:100vh;
    height:100dvh;
    overflow-y:auto;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 22px);
    display:flex;
    flex-direction:column;
  }
  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .screen.screen-enter{ animation:fadeIn .25s ease-out; }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  h1{font-size:1.5rem;margin:.2em 0 .1em;color:var(--gold);text-align:center;}
  h2{font-size:1.15rem;margin:.3em 0;color:var(--gold);text-align:center;}
  p{line-height:1.45;font-size:.98rem;}
  .center{text-align:center;}
  .spacer{flex:1;}
  .btn{
    display:block;
    width:100%;
    border:2px solid var(--gold);
    background:linear-gradient(180deg,var(--magenta),#a3155e);
    color:#fff;
    font-weight:700;
    font-size:1rem;
    letter-spacing:.02em;
    padding:14px 12px;
    border-radius:14px;
    margin:8px 0;
    cursor:pointer;
    transition:transform .08s ease;
  }
  .btn:active{transform:scale(.97);box-shadow:0 0 14px 4px var(--glow);border-color:#fff;}
  .btn.secondary{background:linear-gradient(180deg,var(--teal),#087572);}
  .btn.gold{background:linear-gradient(180deg,var(--gold),#b3822a);color:var(--ink);}
  .btn.outline{background:transparent;color:var(--gold);}
  .btn:disabled{opacity:.4;pointer-events:none;}
  .badge-icon{filter:drop-shadow(0 0 6px rgba(0,0,0,.4));}

  .lang-grid{display:flex;flex-direction:column;gap:14px;margin-top:24px;}
  .lang-btn{font-size:1.3rem;padding:22px;border-radius:18px;}

  /* 8-bit look (2026-10-19, per the client's reference images), starting with the
     language screen. Pixelify Sans (SIL Open Font License, tiles/PixelifySans-OFL.txt)
     is bundled with the app so it works offline. It is only crisp at whole
     multiples of 8px (16, 24, 32), so sizes below are 1rem = 16px, 1.5rem = 24px,
     2rem = 32px. */
  /* The pixel font's own "5" looks like an S, so a one-glyph font with a clean pixel 5 sits in front of it. */
  @font-face{font-family:"FeYVida Five";src:url("tiles/FeYVidaFive.ttf") format("truetype");font-weight:400 700;font-style:normal;unicode-range:U+0035;font-display:block;}
  @font-face{font-family:"Pixelify Sans";src:url("tiles/PixelifySans.ttf") format("truetype");font-weight:400 700;font-style:normal;font-display:block;}
  /* Language screen (2026-10-19, per the client's reference image): a pixel-art
     church scene fills the screen, the small logo and QUEST sit in the sky, and a
     white card holds the QR code and the two language buttons. The scene image
     is 125x140 pixels, drawn at the full width of the screen. */
  .pixHome{position:relative;min-height:100dvh;margin:calc(-1 * (env(safe-area-inset-top,0px) + 18px)) -18px calc(-1 * (env(safe-area-inset-bottom,0px) + 22px));padding:calc(env(safe-area-inset-top,0px) + 8px) 0 14px;display:flex;flex-direction:column;align-items:center;
    /* The scene sits 34px below the top (sky colour fills the gap and grass fills below it) so QUEST has clear room above the church cross. */
    background:url("tiles/scene_church.png") center top 34px / 100% auto no-repeat,linear-gradient(#4FB0F2 0,#4FB0F2 150px,#52B043 150px);image-rendering:pixelated;font-family:"FeYVida Five","Pixelify Sans",ui-monospace,monospace;}
  .pixLogoSmall{display:block;width:192px;height:auto;image-rendering:pixelated;}
  .pixQuest{font-family:"FeYVida Five","Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:4rem;line-height:1;letter-spacing:.04em;margin:0;color:#FFC93A;
    text-shadow:3px 0 #1b2a6b,-3px 0 #1b2a6b,0 3px #1b2a6b,0 -3px #1b2a6b,3px 3px #1b2a6b,-3px -3px #1b2a6b,3px -3px #1b2a6b,-3px 3px #1b2a6b,0 7px 0 #1b2a6b,3px 7px 0 #1b2a6b,-3px 7px 0 #1b2a6b;}
  .pixCard{width:calc(100% - 28px);max-width:420px;background:#fff;border-radius:18px;padding:14px 16px 12px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.28);color:#1E2F7A;}
  .pixCardTitle{font-weight:700;font-size:1.5rem;letter-spacing:.03em;line-height:1.1;}
  .pixCardSub{font-weight:500;font-size:1rem;letter-spacing:.03em;color:#5666a8;margin-top:2px;}
  .pixQr{position:relative;width:177px;height:177px;margin:10px auto 12px;padding:16px;}
  .pixQr img{display:block;width:145px;height:145px;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;}
  .pixQr i{position:absolute;width:22px;height:22px;border:0 solid #4CB848;}
  .pixQr .tl{left:0;top:0;border-left-width:5px;border-top-width:5px;border-top-left-radius:6px;}
  .pixQr .tr{right:0;top:0;border-right-width:5px;border-top-width:5px;border-top-right-radius:6px;}
  .pixQr .bl{left:0;bottom:0;border-left-width:5px;border-bottom-width:5px;border-bottom-left-radius:6px;}
  .pixQr .br{right:0;bottom:0;border-right-width:5px;border-bottom-width:5px;border-bottom-right-radius:6px;}
  .btn.pixBtn{width:min(78%,260px);margin:0 auto 10px;padding:8px 12px 6px;font-family:"FeYVida Five","Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:1.5rem;line-height:1.2;letter-spacing:.06em;border-radius:12px;border:3px solid #1E6B2B;border-bottom-width:6px;background:#52C246;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.35);box-shadow:inset 0 3px 0 rgba(255,255,255,.4);transition:none;}
  .btn.pixBtn.secondary{border-color:#1C4E9A;background:#3A93E8;}
  /* Pressed: the button sinks and lights up -- a hard light ring plus a soft glow in its own colour (2026-10-19, per Dan). */
  /* Only transform and box-shadow change while pressed -- never a border width or size, which would resize the button and make the white card above it jump. */
  .btn.pixBtn:active{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 0 0 3px #E2FFD8,0 0 18px 8px rgba(120,255,120,.8);}
  .btn.pixBtn.secondary:active{box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 0 0 3px #DCEEFF,0 0 18px 8px rgba(110,190,255,.85);}
  /* Welcome screen: the church-interior picture (125x270 pixels, drawn at the full screen
     width and anchored to the bottom so the pews stay under the buttons; any extra height
     at the top is ceiling brown). */
  .pixChurch{padding-top:calc(env(safe-area-inset-top,0px) + 16px);
    background:url("tiles/church_interior.png") center bottom / 100% auto no-repeat,#6B4423;}
  .pixWelcomeCard{padding:18px 18px 20px;}
  .pixWelTitle{font-family:"FeYVida Five","Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:1.75rem;line-height:1.15;letter-spacing:.02em;color:#1E2F7A;margin:0 0 10px;}
  .pixWelBody{font-family:"FeYVida Five","Pixelify Sans",ui-monospace,monospace;font-weight:500;font-size:1.25rem;line-height:1.3;letter-spacing:.01em;color:#2A3A78;margin:0;}
  /* Same box as the language screen's white card (width and side padding), so the buttons land in the same place and size. */
  .pixBtnDock{width:calc(100% - 28px);max-width:420px;padding:0 16px 12px;}
  /* The welcome buttons carry longer words in a smaller type, but keep the language buttons' exact box (51.8px tall). */
  .btn.pixBtn.pixBtnMd,.btn.pixBtn.pixBtnSm{height:51.8px;display:flex;align-items:center;justify-content:center;line-height:1;padding:0 12px 3px;}
  .btn.pixBtn.pixBtnMd{font-size:1.25rem;}
  .btn.pixBtn.pixBtnSm{font-size:1rem;letter-spacing:.04em;}
  /* Home screen icons, the Missions folder and the expanding tile (2026-10-19, per Dan) */
  .homeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 8px;margin:22px 0 10px;}
  .appIcon{display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;}
  .appTile{position:relative;width:72px;height:72px;border-radius:16px;border:3px solid #1B1F3B;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 0 rgba(20,30,90,.4),inset 0 3px 0 rgba(255,255,255,.35);}
  .appTile img.spr{width:48px;height:48px;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;pointer-events:none;}
  .appIcon:active .appTile{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 0 0 3px #FFF6C0,0 0 16px 6px rgba(255,236,120,.9);}
  .appName{margin-top:9px;font-family:"FeYVida Five","Pixelify Sans",ui-monospace,monospace;font-weight:600;font-size:.875rem;line-height:1.1;color:#fff;
    text-shadow:2px 0 #1b2a6b,-2px 0 #1b2a6b,0 2px #1b2a6b,0 -2px #1b2a6b,2px 2px #1b2a6b,-2px -2px #1b2a6b,2px -2px #1b2a6b,-2px 2px #1b2a6b;}
  .appTag{margin-top:3px;font-family:"FeYVida Five","Pixelify Sans",ui-monospace,monospace;font-weight:600;font-size:.75rem;letter-spacing:.03em;color:#FFC93A;text-transform:lowercase;}
  .appTag::first-letter{text-transform:uppercase;}
  .miniGrid{display:grid;grid-template-columns:32px 32px;gap:0;}
  .appTile .miniGrid img.spr{width:32px;height:32px;}
  .countBadge{position:absolute;top:-9px;right:-12px;min-width:34px;padding:2px 6px;border-radius:12px;background:#D6343A;border:3px solid #fff;color:#fff;
    font-family:"FeYVida Five","Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:.75rem;line-height:1.1;text-shadow:none;box-shadow:0 2px 0 rgba(0,0,0,.3);}
  .doneBadge{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:#2E9E4F;border:3px solid #fff;color:#fff;font-size:.8rem;font-weight:700;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.3);}
  .appIcon.locked .appTile{filter:grayscale(.5) brightness(.92);}
  .appIcon.soon .appTile{opacity:.55;}
  .appIcon.soon .appName{opacity:.85;}
  .appIcon.done .appTile{filter:saturate(.65);}
  .pixHome.pixSky > .folderOverlay{position:fixed;left:0;top:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;
    background:rgba(10,20,70,.55);animation:folderFade .2s ease-out;}
  @keyframes folderFade{from{opacity:0;}to{opacity:1;}}
  .folderPanel{position:relative;width:100%;max-width:420px;max-height:86%;overflow-y:auto;background:#223A8C;border:4px solid #FFC93A;border-radius:22px;
    padding:14px 12px 18px;box-shadow:0 6px 0 rgba(0,0,0,.35);transform-origin:var(--ox,50%) var(--oy,50%);animation:folderPop .24s ease-out;}
  @keyframes folderPop{from{transform:scale(.2);opacity:0;}to{transform:scale(1);opacity:1;}}
  .folderTitle{font-family:"FeYVida Five","Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:1.5rem;letter-spacing:.08em;text-transform:uppercase;color:#FFC93A;text-align:center;margin:2px 0 16px;}
  .folderGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 4px;}
  .folderGrid .appName{font-size:.8125rem;overflow-wrap:anywhere;}
  @media (max-width:340px){ .folderGrid .appName{font-size:.75rem;} }
  .folderClose{position:absolute;top:8px;right:10px;width:44px;height:44px;padding:0 0 3px;border:3px solid #1B1F3B;border-radius:12px;background:#D6343A;color:#fff;cursor:pointer;
    font-family:"FeYVida Five","Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:1.5rem;line-height:1;text-shadow:2px 2px 0 rgba(0,0,0,.35);
    box-shadow:0 4px 0 rgba(20,30,90,.4),inset 0 3px 0 rgba(255,255,255,.35);}
  .folderClose:active{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 0 0 3px #FFE0DC,0 0 16px 6px rgba(255,120,110,.9);}
  .expandClone{position:fixed;z-index:100;border-radius:16px;border:3px solid #1B1F3B;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none;
    transition:left .28s ease-in,top .28s ease-in,width .28s ease-in,height .28s ease-in,border-radius .28s ease-in,opacity .25s ease-out;}
  .expandClone img.spr{width:48px;height:48px;image-rendering:pixelated;transition:transform .28s ease-in;}
  /* Pilgrim scene on the Home Screen (2026-10-20, per Dan): a hill with a church, a winding path and a little pilgrim who walks
     toward the church as the player earns Quest Points. The scene picture is 125x100 pixels, drawn at the full screen width and
     anchored to the bottom; everything on it is placed in percentages so it scales with the picture. */
  .pixHome.pixSky > .pixScene{position:absolute;left:0;right:0;bottom:0;width:auto;aspect-ratio:125/100;z-index:auto;pointer-events:none;}
  .pixSceneArt{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;}
  .churchGlow{position:absolute;left:43.2%;top:30%;width:12.8%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle,rgba(255,226,120,.9) 0,rgba(255,226,120,0) 68%);opacity:.3;animation:glowPulse 2.6s ease-in-out infinite alternate;}
  .churchGlow.lit{transform:scale(1.35);opacity:.6;animation-name:glowPulseLit;}
  @keyframes glowPulse{from{opacity:.2;}to{opacity:.6;}}
  @keyframes glowPulseLit{from{opacity:.45;}to{opacity:.85;}}
  .pixSpark{position:absolute;left:46.8%;top:.5%;width:5.6%;image-rendering:pixelated;animation:sparkBlink 2.6s steps(1) infinite;}
  @keyframes sparkBlink{0%{opacity:0;}55%{opacity:1;}65%{opacity:.35;}75%{opacity:1;}85%{opacity:0;}100%{opacity:0;}}
  .pixDove{position:absolute;left:-14%;top:12%;width:12.8%;aspect-ratio:16/12;animation:doveFly 28s linear infinite;animation-delay:-3s;}
  @keyframes doveFly{0%{left:-14%;}55%{left:112%;}100%{left:112%;}}
  .pixDoveBob{width:100%;height:100%;animation:doveBob 3.2s ease-in-out infinite alternate;}
  @keyframes doveBob{from{transform:translateY(-35%);}to{transform:translateY(35%);}}
  .pixDoveSprite{width:100%;height:100%;background:url("tiles/dove.png") 0 0 / 200% 100% no-repeat;image-rendering:pixelated;animation:doveFlap .36s steps(1) infinite;}
  @keyframes doveFlap{0%{background-position:0 0;}50%{background-position:100% 0;}100%{background-position:0 0;}}
  .pilgrim{position:absolute;width:8.8%;aspect-ratio:11/15;z-index:2;pointer-events:auto;cursor:pointer;}
  .pilgrim::before{content:"";position:absolute;left:-60%;right:-60%;top:-40%;bottom:-15%;}
  .pilgrim.hop{animation:pilgrimHop .4s ease-out;}
  @keyframes pilgrimHop{0%{transform:translateY(0);}40%{transform:translateY(-45%);}100%{transform:translateY(0);}}
  .pilgrimFlip{width:100%;height:100%;}
  .pilgrimFlip.left{transform:scaleX(-1);}
  .pilgrimSprite{width:100%;height:100%;background:url("tiles/pilgrim.png") 0 0 / 200% 100% no-repeat;image-rendering:pixelated;animation:pilgrimBreath 1.8s steps(1) infinite;}
  .pilgrim.walking .pilgrimSprite{animation:pilgrimStep .5s steps(1) infinite,pilgrimBob .5s steps(1) infinite;}
  @keyframes pilgrimBreath{0%{transform:translateY(0);}50%{transform:translateY(-6.6%);}100%{transform:translateY(0);}}
  @keyframes pilgrimBob{0%{transform:translateY(0);}50%{transform:translateY(-6.6%);}100%{transform:translateY(0);}}
  @keyframes pilgrimStep{0%{background-position:0 0;}50%{background-position:100% 0;}100%{background-position:0 0;}}
  .pilgrimBubble{position:absolute;z-index:3;display:none;box-sizing:border-box;max-width:80%;padding:8px 12px;background:#fff;color:#1E2F7A;border:3px solid #1B1F3B;border-radius:10px;
    font-family:"FeYVida Five","Pixelify Sans",ui-monospace,monospace;font-weight:600;font-size:.875rem;line-height:1.25;text-align:center;box-shadow:0 3px 0 rgba(20,30,90,.35);
    pointer-events:auto;cursor:pointer;transform-origin:var(--tail,50%) 100%;}
  .pilgrimBubble.show{display:block;animation:bubblePop .18s ease-out;}
  .pilgrimBubble::after{content:"";position:absolute;top:100%;left:var(--tail,50%);width:9px;height:9px;margin:-6px 0 0 -7px;background:#fff;border-right:3px solid #1B1F3B;border-bottom:3px solid #1B1F3B;transform:rotate(45deg);}
  @keyframes bubblePop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
  @media (prefers-reduced-motion:reduce){ .pixDove{display:none;} .pixSpark{animation:none;opacity:1;} .churchGlow,.pilgrimSprite,.pilgrim.walking .pilgrimSprite{animation:none;} .pilgrim.hop{animation:none;} }
  /* Main Menu: pixel sky with slowly drifting clouds, tiles as solid cards sitting on it. The sky
     and cloud pictures are 125x270 pixels drawn at the full screen width and anchored to the bottom;
     the cloud layer is two screens wide and slides one screen-width to the left, so it loops with no jump. */
  .pixSky{flex:none;align-items:stretch;overflow:hidden;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 22px);
    background:url("tiles/sky_menu.png") center bottom / 100% auto no-repeat,#2F8FE8;}
  /* Three cloud layers at different depths: small far-away clouds drift slowly, big near clouds drift fast (2026-10-20, per Dan). */
  .pixSkyClouds{position:absolute;left:0;top:0;width:200%;height:100%;z-index:0;pointer-events:none;image-rendering:pixelated;
    background-position:left bottom;background-size:50% auto;background-repeat:repeat-x;animation:pixCloudDrift 60s linear infinite;}
  .pixSkyClouds.cl1{background-image:url("tiles/clouds_1.png");animation-duration:100s;}
  .pixSkyClouds.cl2{background-image:url("tiles/clouds_2.png");animation-duration:60s;}
  .pixSkyClouds.cl3{background-image:url("tiles/clouds_3.png");animation-duration:34s;}
  @keyframes pixCloudDrift{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  @media (prefers-reduced-motion:reduce){ .pixSkyClouds{animation:none;} }
  .pixSky > *:not(.pixSkyClouds){position:relative;z-index:1;}
  .pixMenuTitle{font-family:"FeYVida Five","Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:2rem;line-height:1.1;letter-spacing:.02em;text-align:center;margin:2px 0 8px;color:#FFC93A;
    text-shadow:3px 0 #1b2a6b,-3px 0 #1b2a6b,0 3px #1b2a6b,0 -3px #1b2a6b,3px 3px #1b2a6b,-3px -3px #1b2a6b,3px -3px #1b2a6b,-3px 3px #1b2a6b,0 5px 0 #1b2a6b;}
  .pixMenu .progressWrap{margin:6px 0 16px;}
  .pixMenu .progressBar{height:24px;border:3px solid #1E2F7A;border-radius:12px;background:#fff;}
  .pixMenu .progressFill{background:#FFC93A;}
  .pixMenu .progressLabel{font-family:"FeYVida Five","Pixelify Sans",ui-monospace,monospace;font-weight:600;font-size:1rem;color:#fff;opacity:1;margin-top:6px;text-shadow:2px 0 #1b2a6b,-2px 0 #1b2a6b,0 2px #1b2a6b,0 -2px #1b2a6b;}
  .pixMenu .tempReset{background:rgba(255,255,255,.88);border-color:#1E2F7A;}
  .pixMenu .tempResetLbl{color:#1E2F7A;opacity:1;}
  .pixMenu .tempReset button{color:#1E2F7A;border-color:#1E2F7A;}
  /* Shorter phones: shrink the card (QR 145px -> 116px, whole 4px per module) so the
     church stays visible above it. */
  @media (max-height:740px){
    /* welcome card: a smaller title and tighter lines so it clears the crucifix on short phones */
    .pixWelcomeCard{padding:10px 14px;}
    .pixWelTitle{font-size:1rem;margin-bottom:6px;}
    .pixWelBody{font-size:1rem;line-height:1.25;}
    .pixBtnDock{padding:0 14px 6px;}
    .btn.pixBtn.pixBtnMd,.btn.pixBtn.pixBtnSm{height:43px;padding:0 12px 2px;}
    .pixQuest{font-size:3rem;margin-top:0;}
    .pixCard{padding:10px 14px 6px;}
    .pixQr{width:148px;height:148px;margin:6px auto 8px;padding:12px;}
    .pixQr img{width:116px;height:116px;}
    .pixQr i{width:18px;height:18px;}
    .btn.pixBtn{margin-bottom:8px;font-size:1.25rem;padding:6px 12px 4px;}
  }

  .progressWrap{margin:10px 0 18px;}
  .progressBar{background:rgba(255,255,255,.15);border:1px solid var(--gold);border-radius:20px;height:22px;overflow:hidden;}
  .progressFill{height:100%;background:linear-gradient(90deg,var(--gold),#fff6c9);transition:width .4s ease;}
  .progressLabel{text-align:center;font-size:.82rem;margin-top:4px;color:var(--cream);opacity:.9;}

  .missionGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0;}
  .missionTile{
    background:rgba(255,255,255,.06);
    border:2px solid var(--gold);
    border-radius:16px;
    padding:10px 4px 8px;
    text-align:center;
    cursor:pointer;
  }
  .missionTile:not(.done):active{box-shadow:0 0 14px 4px var(--glow);}
  .missionTile.done{border-color:var(--good);background:rgba(46,158,79,.18);opacity:.85;cursor:default;}
  .missionTile .ic{font-size:2rem;display:block;}
  .missionTile .lbl{font-size:.68rem;margin-top:4px;display:block;font-weight:600;}
  .missionTile .chk{font-size:.9rem;color:var(--good);}
  .passportTile{grid-column:span 3;}
  /* coming-soon tiles on the Main Menu */
  .missionTile.soon{opacity:.6;border-style:dashed;cursor:default;}
  .missionTile.soon:active{box-shadow:none;}
  .missionTile .tag{display:block;font-size:.6rem;letter-spacing:.05em;color:var(--gold);margin-top:3px;}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);background:rgba(20,10,35,.94);color:var(--cream);border:2px solid var(--gold);border-radius:14px;padding:10px 20px;font-size:.95rem;font-weight:700;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
  /* Pinned exit button shown during a mission -- see exitBarHtml(). The bar
     has no height, so it takes no room and nothing below it moves. */
  .exitBar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);height:0;z-index:20;}
  /* Same red pixel X as the Passport's close button (2026-10-19, per Dan). */
  .exitBtn{position:absolute;top:-14px;left:-6px;width:44px;height:44px;padding:0 0 3px;border:3px solid #1B1F3B;border-radius:12px;background:#D6343A;color:#fff;cursor:pointer;
    font-family:"FeYVida Five","Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:1.5rem;line-height:1;text-shadow:2px 2px 0 rgba(0,0,0,.35);
    box-shadow:0 4px 0 rgba(20,30,90,.4),inset 0 3px 0 rgba(255,255,255,.35);}
  .exitBtn:active{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 0 0 3px #FFE0DC,0 0 16px 6px rgba(255,120,110,.9);}
  /* TEMPORARY test aid -- see tempResetHtml() */
  .tempReset{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px;padding:8px;border:1px dashed rgba(255,255,255,.4);border-radius:12px;}
  .tempResetLbl{width:100%;font-size:.68rem;letter-spacing:.06em;opacity:.7;}
  .tempReset button{background:transparent;color:var(--cream);border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:6px 8px;font-size:.72rem;cursor:pointer;}

  .qaBox{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:16px;margin:10px 0;}
  .answerBtn{
    display:block;width:100%;text-align:left;
    background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.35);
    color:#fff;padding:12px 14px;border-radius:12px;margin:8px 0;font-size:.95rem;cursor:pointer;
  }
  .answerBtn:active{box-shadow:0 0 10px 3px var(--glow);}
  .answerBtn.correct{background:rgba(46,158,79,.5);border-color:var(--good);}
  .answerBtn.wrong{background:rgba(196,59,59,.5);border-color:var(--danger);}
  .answerBtn.disabled{pointer-events:none;}

  .matchGrid{display:grid;gap:6px;margin:12px 0;}
  .matchCard{
    aspect-ratio:1/1;border-radius:8px;border:2px solid var(--gold);
    background:linear-gradient(160deg,var(--purple),var(--purple-dark));
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    overflow:hidden;
  }
  .matchCard.flipped,.matchCard.matched{background:linear-gradient(160deg,#fff,#f1e2c4);}
  .matchCard.matched{border-color:var(--good);opacity:.5;filter:brightness(.6);cursor:default;}
  .matchCard img{width:100%;height:100%;object-fit:cover;display:block;}
  .chancesRow{text-align:center;font-size:1.1rem;margin:4px 0;}

  /* Stained-Glass Puzzle (2026-10-19, replaced Service Sprint; jigsaw version
     2026-10-19). The board and the piece tray are one <svg> that scales to the
     screen; pieces are <g> elements moved with CSS transforms, so letting go
     animates them (snap in, or spring back to the tray). touch-action:none
     stops the page scrolling while a piece is being dragged. */
  .pzSvg{width:100%;height:auto;display:block;margin:8px 0;touch-action:none;user-select:none;-webkit-user-select:none;}
  .pzBoardRect{fill:rgba(0,0,0,.3);stroke:var(--gold);stroke-width:2;}
  .pzTrayRect{fill:rgba(255,255,255,.07);}
  .pzPiece{cursor:grab;}
  .pzPiece.locked{cursor:default;pointer-events:none;}
  .pzOutline{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linejoin:round;pointer-events:none;}
  .pzPiece.dragging .pzOutline{stroke:#fff;}
  .pzSvg.solved .pzOutline{display:none;}
  .pzFull{pointer-events:none;animation:pzFade .4s ease-out;}
  @keyframes pzFade{from{opacity:0;}to{opacity:1;}}
  .pzMsg{min-height:1.6em;text-align:center;font-weight:700;margin:2px 0;}
  .pzMsg.good{color:var(--good);font-size:1.2rem;}

  .photoPreview{width:100%;border-radius:16px;border:3px solid var(--gold);margin:10px 0;object-fit:cover;max-height:340px;}
  .cameraIconBox{font-size:4rem;text-align:center;margin:18px 0;}

  /* Passport in 8-bit style (2026-10-19, per Dan): pixel sky behind, a cream page with a gold inner edge, pixel badges at 4x. */
  .pixPassport{height:100dvh;min-height:0;}
  .passHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;}
  .passHeadSpace{width:44px;flex:none;}
  .passTitle{flex:1;margin:0;text-align:center;font-family:"FeYVida Five","Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:1.5rem;line-height:1.1;letter-spacing:.02em;color:#FFC93A;
    text-shadow:3px 0 #1b2a6b,-3px 0 #1b2a6b,0 3px #1b2a6b,0 -3px #1b2a6b,3px 3px #1b2a6b,-3px -3px #1b2a6b,3px -3px #1b2a6b,-3px 3px #1b2a6b,0 5px 0 #1b2a6b;}
  .passClose{flex:none;width:44px;height:44px;padding:0 0 3px;border:3px solid #1B1F3B;border-radius:12px;background:#D6343A;color:#fff;cursor:pointer;
    font-family:"FeYVida Five","Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:1.5rem;line-height:1;text-shadow:2px 2px 0 rgba(0,0,0,.35);
    box-shadow:0 4px 0 rgba(20,30,90,.4),inset 0 3px 0 rgba(255,255,255,.35);}
  .passClose:active{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 0 0 3px #FFE0DC,0 0 16px 6px rgba(255,120,110,.9);}
  .passportBook{background:#FFF3D6;color:#1E2F7A;border:4px solid #1B1F3B;border-radius:14px;box-shadow:inset 0 0 0 4px #FFC93A,0 6px 0 rgba(20,30,90,.4);flex:1;min-height:280px;overflow:hidden;position:relative;}
  /* Width no longer fixed here (was 1100% / 11 pages) -- the track carries
     2 extra "phantom" clone slides for the wrap animation (see screenPassport),
     so both widths are set inline per-render from PASSPORT_TRACK_SLOTS instead. */
  .passportTrack{display:flex;height:100%;}
  .passportPage{flex-shrink:0;box-sizing:border-box;padding:22px 18px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;
    font-family:"FeYVida Five","Pixelify Sans",ui-monospace,monospace;}
  .pxNote{font-weight:600;font-size:.875rem;letter-spacing:.06em;color:#1E2F7A;opacity:.8;margin-bottom:12px;}
  .badge8{width:192px;height:192px;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;filter:drop-shadow(0 5px 0 rgba(27,31,59,.35));}
  .badge8Locked{width:192px;height:192px;border-radius:50%;background:#C9CFDD;border:3px solid #1B1F3B;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 6px #AEB6C8;}
  .badge8Locked img{width:96px;height:96px;image-rendering:pixelated;}
  .pxBadgeName{margin-top:16px;font-weight:700;font-size:1.5rem;line-height:1.1;letter-spacing:.02em;color:#1E2F7A;}
  .pxBadgeMission{margin-top:6px;font-weight:500;font-size:1rem;color:#5666a8;}
  .pxPhoto{width:100%;max-height:240px;border:4px solid #1B1F3B;border-radius:10px;object-fit:cover;image-rendering:auto;}
  .passportNav{display:flex;justify-content:space-between;align-items:center;margin:12px 0 4px;}
  .navArrow{width:56px;height:48px;border:3px solid #1B1F3B;border-radius:12px;background:#FFC93A;color:#1B1F3B;cursor:pointer;
    font-family:"FeYVida Five","Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:1.5rem;line-height:1;padding:0 0 3px;
    box-shadow:0 4px 0 rgba(20,30,90,.4),inset 0 3px 0 rgba(255,255,255,.45);}
  .navArrow:active{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 0 0 3px #FFF6C0,0 0 16px 6px rgba(255,236,120,.9);}
  .dots{display:flex;gap:6px;justify-content:center;margin:12px 0 2px;flex-wrap:wrap;}
  .dot{width:10px;height:10px;border-radius:2px;background:rgba(255,255,255,.55);border:2px solid #1B1F3B;box-sizing:border-box;}

  .ticketBox{background:linear-gradient(160deg,var(--gold),#c99a2e);color:var(--ink);border-radius:18px;padding:26px 18px;text-align:center;border:3px dashed var(--ink);margin:16px 0;}

  .smallNote{font-size:.78rem;opacity:.75;text-align:center;margin-top:6px;}

  /* Follow the Light — 3x3 image-tile memory grid (2026-09-30 redesign) */
  .flGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0;}
  .flPad{aspect-ratio:1/1;border-radius:12px;border:2px solid var(--gold);background:linear-gradient(160deg,var(--purple),var(--purple-dark));display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:transform .1s ease,box-shadow .15s ease;}

  .flPad.lit{box-shadow:0 0 20px 6px var(--glow);border-color:#fff;}

  .wuAnswerRow{display:flex;gap:8px;justify-content:center;margin:18px 0 10px;flex-wrap:wrap;}
  .wuSlot{width:38px;height:46px;border:2px solid var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;background:rgba(255,255,255,.06);}
  .wuSlot.filled{background:rgba(255,255,255,.18);}
  .wuAnswerRow.correct .wuSlot{border-color:var(--good);background:rgba(46,158,79,.4);}
  .wuAnswerRow.wrong .wuSlot{border-color:var(--danger);background:rgba(196,59,59,.4);animation:wuShake .4s;}
  @keyframes wuShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .wuTray{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0;}
  .wuTile{width:42px;height:48px;border:2px solid var(--gold);border-radius:8px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;cursor:pointer;}
  .wuTile:active{box-shadow:0 0 10px 3px var(--glow);}
  .wuTile.used{opacity:.2;pointer-events:none;}

  /* Catch the Light — Kaboom!-style: icons no longer take taps of their own
     (pointer-events:none — the STAGE captures the drag instead), so no
     cursor:pointer here any more. touch-action:none on the stage stops the
     phone's own scroll/pan gesture from fighting the hands drag. */
  .clHud{display:flex;justify-content:space-between;align-items:center;font-size:.95rem;margin:4px 0;}
  .clStage{position:relative;flex:1;min-height:260px;background:rgba(255,255,255,.05);border:2px solid var(--gold);border-radius:16px;overflow:hidden;margin:8px 0;touch-action:none;}
  .clIcon{position:absolute;top:-50px;font-size:2.2rem;user-select:none;line-height:1;pointer-events:none;}
  .clHands{position:absolute;bottom:6px;font-size:2.8rem;line-height:1;transform:translateX(-50%);user-select:none;pointer-events:none;}
  .clCountdownNum{font-size:5rem;font-weight:800;color:var(--gold);margin:18px 0;}

  /* Acts of Kindness Sort */
  .kindBtns{display:flex;gap:10px;}
  .kindBtns .btn{flex:1;}
  .kindBtn.correct{background:linear-gradient(180deg,var(--good),#1c6d35);border-color:#fff;}
  .kindBtn.wrong{background:linear-gradient(180deg,var(--danger),#8a2626);border-color:#fff;}
  .kindBtn.disabled{pointer-events:none;opacity:.7;}

  /* Hidden Blessings */
  .hbScene{position:relative;flex:1;min-height:280px;border-radius:16px;overflow:hidden;border:2px solid var(--gold);margin:10px 0;background:radial-gradient(circle at 30% 20%,var(--purple) 0%,var(--purple-dark) 60%,#1a0c28 100%);}
  .hbSpot{position:absolute;width:15%;aspect-ratio:1/1;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:1.7rem;opacity:.16;filter:grayscale(85%) brightness(.7);cursor:pointer;transition:opacity .2s ease,filter .2s ease;}
  .hbSpot.found{opacity:1;filter:none;animation:hbPop .35s ease;pointer-events:none;}
  @keyframes hbPop{0%{transform:translate(-50%,-50%) scale(.6);}60%{transform:translate(-50%,-50%) scale(1.3);}100%{transform:translate(-50%,-50%) scale(1);}}
</style>

// Reusable badge <img> with a graceful fallback to the mission's emoji icon
// (in the existing .passportBadge circle styling) if its PNG isn't there yet
// — lets the 5 new missions work end-to-end today, before Dan's new badge
// art exists, and upgrades automatically the moment each file is dropped in.
// 10 mission-badge pages + 1 Joyous Photo page. Kept as its own constant
// (rather than re-deriving MISSIONS.length+1 at every call site) so the
// Passport's page-count/wrap math and the "/11" CSS above (percentages
// can't reference a JS constant, so they're hand-kept in sync with this)
// stay easy to grep together if the mission count ever changes again.
var PASSPORT_PAGES = MISSIONS.length + 1;
// The rendered track carries 2 extra "phantom" slides beyond the real
// PASSPORT_PAGES -- a clone of the last page before slot 0 and a clone of
// the first page after the last real slot -- purely so a wrap (11th page ->
// 1st, or 1st -> 11th) can animate as one continuous slide in the swiped
// direction instead of either snapping instantly or visibly scrolling
// backward across every page in between. See screenPassport()/render()'s
// passport hook (2026-09-29, per Dan reporting wraps didn't visually scroll).
var PASSPORT_TRACK_SLOTS = PASSPORT_PAGES + 2;
// Golden Ticket now unlocks at 5 of the 10 missions (2026-09-29, per Dan) —
// deliberately NOT tied to MISSIONS.length any more, since the whole point
// of this change is that the two can differ (half the missions, not all of
// them). 5 x 100 pts/mission = 500.
var GOLDEN_TICKET_MISSIONS_NEEDED = 5;
var GOLDEN_TICKET_POINTS = GOLDEN_TICKET_MISSIONS_NEEDED * 100;

function badgeImgHtml(m, sizePx){
  // margin:0 auto (2026-09-29, per Dan — the Award screen's badge sat at the
  // left edge, not centered): .screen has no align-items:center of its own
  // (buttons/paragraphs rely on the flex default of stretch to go full-width),
  // so this span — a direct flex-item child there — stretches to fill the
  // full screen width; .center's text-align:center only ever centers INLINE
  // content, never a display:block element with its own explicit width like
  // this img, so margin:auto is what actually centers it within that
  // stretched span. Harmless where it was already centered another way
  // (e.g. the Passport page, whose own flex column DOES set align-items:
  // center, sizing the span down to the image's own width with nothing left
  // for margin:auto to distribute).
  return '<span style="display:inline-block;">' +
    '<img class="badge-icon" src="' + m.badgeImg + '" style="width:' + sizePx + 'px;height:' + sizePx + 'px;display:block;margin:0 auto;" ' +
      'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';">' +
    '<div class="passportBadge" style="display:none;margin:0;">' + m.icon + '</div>' +
  '</span>';
}

var matchTilesPreloaded = false;
var matchTilesReady = false; // true once every tile below has actually finished loading+decoding
// decoding="sync" on the game-grid <img> tags (see screenFaithMatch) wasn't
// enough on its own -- on a slow connection the real network fetch simply
// hasn't finished by the time a tile is first flipped, and no decode hint
// can paint bytes that haven't arrived yet. So this now tracks REAL
// completion (onload, not just .src being set) and screenFaithMatch holds on
// a tiny "Loading tiles..." beat until every one has resolved, instead of
// racing the player to the first flip (2026-09-30, per Dan -- the blank-tile
// flash was still happening intermittently after the decode-hint-only fix).
function preloadMatchTiles(){
  if(matchTilesPreloaded) return;
  matchTilesPreloaded = true;
  var remaining = MATCH_SYMBOLS.length;
  function tileDone(){
    remaining--;
    if(remaining <= 0){
      matchTilesReady = true;
      if(state.screen === "faithMatch" || state.screen === "stainedGlass") render();
    }
  }
  MATCH_SYMBOLS.forEach(function(src){
    var img = new Image();
    img.onload = function(){
      // .decode() actually decodes the bitmap into the browser's image cache
      // (not just fetching the bytes), which is what keeps a later fresh
      // <img> pointing at this same src from needing to redecode on paint.
      // The 1.5s fallback (2026-10-19) keeps a decode() promise that never
      // settles -- seen in a background/unpainted tab -- from leaving Faith
      // Match and the Stained-Glass Puzzle stuck on "Loading tiles..." forever;
      // the bytes have already arrived by this point.
      var finished = false;
      function once(){ if(!finished){ finished = true; tileDone(); } }
      if(img.decode) img.decode().then(once).catch(once);
      else once();
      setTimeout(once, 1500);
    };
    img.onerror = tileDone; // don't let one bad tile block the game forever
    img.src = src;
  });
}

// Switched from localStorage to sessionStorage (2026-09-29, per Dan) — a
// booth device reopening the same URL across separate deploys/visits kept
// resuming the previous participant's saved progress, since localStorage
// persists indefinitely for the origin regardless of which tab or visit
// wrote it. sessionStorage is scoped to the one browser tab: a genuinely
// new visit (a fresh QR scan opening its own tab) always starts clean, but
// the ORIGINAL persistence requirement — surviving the player backgrounding
// the app or taking a phone call mid-mission — still holds, since mobile
// browsers keep a backgrounded tab's sessionStorage intact and restore it
// even after the OS evicts the tab's process under memory pressure. Only
// an actual tab close (or the in-app CLEAR TICKET, unchanged) starts over.
function loadState(){
  try{
    var raw = sessionStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    var parsed = JSON.parse(raw);
    var d = defaultState();
    // shallow-merge to survive future field additions
    var merged = Object.assign(d, parsed, {
      missions: Object.assign(d.missions, parsed.missions||{}),
      session: Object.assign(d.session, parsed.session||{})
    });
    // A tab saved by an earlier build may still be on the retired Service
    // Sprint screen (replaced by Stained-Glass Puzzle, 2026-10-19).
    if(merged.screen === "serviceSprint") merged.screen = "mainMenu";
    return merged;
  }catch(e){ return defaultState(); }
}

function saveState(){
  try{ sessionStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

var state = loadState();

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

// 8-bit button-press sound (2026-10-19, per Dan): a short two-step square-wave
// blip made with Web Audio, so there is no sound file to load. It plays on the
// press itself (pointerdown), not on release, and is currently wired to the two
// language buttons -- add onpointerdown="pixPressSfx()" to any other button to
// give it the same sound. The AudioContext is created on the first press
// (browsers block audio until a tap) and reused after that.
//
// Fix (2026-10-19, after Dan heard nothing on his phone): on a touch screen a
// finger-DOWN does not count as a tap that is allowed to start audio -- only the
// release does -- so a sound started on pointerdown stayed silent on the first
// tap. pixPressSfx (pointerdown) now plays only if audio is already running
// (mouse, or any later tap); pixClickSfx (release/click) starts the audio and
// plays the blip if the press could not.
var pixAudioCtx = null, pixBlipPlayed = false;
function pixCtx(){
  try {
    // iOS: let Web Audio play even when the ring/silent switch is on (Safari 17+)
    if(navigator.audioSession) navigator.audioSession.type = "playback";
    if(!pixAudioCtx) pixAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return pixAudioCtx;
  } catch(e){ return null; }
}
function pixBlip(ctx){
  try {
    var t0 = ctx.currentTime;
    var osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(523, t0);        // C5
    osc.frequency.setValueAtTime(784, t0 + 0.06); // then G5
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.2, t0 + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + 0.17);
  } catch(e){}
}
function pixPressSfx(){
  var ctx = pixCtx(); if(!ctx) return;
  pixBlipPlayed = false;
  if(ctx.state === "running"){ pixBlip(ctx); pixBlipPlayed = true; }
  else if(ctx.resume) { try { var p = ctx.resume(); if(p && p.catch) p.catch(function(){}); } catch(e){} }
}
function pixClickSfx(){
  var ctx = pixCtx(); if(!ctx) return;
  if(pixBlipPlayed){ pixBlipPlayed = false; return; }
  if(ctx.state === "running"){ pixBlip(ctx); return; }
  try { var p = ctx.resume(); if(p && p.then) p.then(function(){ pixBlip(ctx); }).catch(function(){}); } catch(e){}
}

function openMission(id){
  if(state.missions[id].done) return;
  if(id === "faithFlash"){ initFaithFlash(); go("faithFlash"); }
  else if(id === "faithMatch"){ preloadMatchTiles(); initFaithMatchLevel(state.missions.faithMatch.level||0); go("faithMatch"); }
  else if(id === "beTheLight"){ go("beTheLight"); }
  else if(id === "stainedGlass"){ preloadMatchTiles(); initStainedGlass(); go("stainedGlass"); }
  else if(id === "chooseJoy"){ initChooseJoy(); go("chooseJoy"); }
  else if(id === "followLight"){ initFollowLightRun(); go("followLight"); flStartLevel(); }
  else if(id === "wordUnscramble"){ initWordUnscramble(); go("wordUnscramble"); }
  // No explicit clRunReadyCountdown() call here -- go()'s own render() call
  // already triggers it via the render()-hook (same as clStart() never
  // needed an explicit call either), and calling it AGAIN right after would
  // start a second, overlapping countdown chain that halves the visible
  // time per number (found live: 5,4,3,2,1,0 came out as 5,3,1,go).
  else if(id === "catchLight"){ initCatchLight(); go("catchLight"); }
  else if(id === "kindnessSort"){ initKindnessSort(); go("kindnessSort"); }
  else if(id === "hiddenBlessings"){ initHiddenBlessings(); go("hiddenBlessings"); }
}

function openFromIcon(icon, screenId){

  var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!tile || calm){ go(screenId); return; }

}

/* ---------- Pilgrim scene on the Home Screen (2026-10-20, per Dan) ---------- */

// The picture is tiles/scene_home.png (125x100 pixels). PILGRIM_PATH is the winding path drawn in it, as
// 65 points spaced evenly along its length, from the bottom of the hill (0) to the church door (1).
var SCENE_W = 125, SCENE_H = 100, PILGRIM_W = 11, PILGRIM_H = 15;
var PILGRIM_PATH = [[18.0,99.0],[22.1,98.6],[26.1,98.2],[30.2,97.8],[34.2,97.4],[38.3,96.9],[42.3,96.5],[46.4,96.1],[50.4,95.6],[54.4,95.1],[58.5,94.5],[62.5,94.0],[66.6,93.5],[70.6,93.0],[74.6,92.4],[78.7,91.9],[82.7,91.2],[86.7,90.6],[90.7,89.8],[94.7,88.8],[98.5,87.4],[101.9,85.3],[101.1,82.0],[97.2,80.6],[93.3,79.7],[89.3,78.9],[85.3,78.2],[81.3,77.5],[77.2,76.9],[73.2,76.2],[69.2,75.6],[65.2,75.0],[61.1,74.5],[57.1,74.0],[53.0,73.5],[49.0,73.0],[45.0,72.5],[40.9,71.9],[36.9,71.2],[32.9,70.3],[29.1,69.0],[26.6,66.4],[30.2,64.6],[34.1,63.6],[38.1,62.7],[42.1,62.0],[46.1,61.3],[50.2,60.7],[54.2,60.2],[58.3,59.8],[62.3,59.4],[66.4,59.1],[70.4,58.7],[74.5,58.3],[78.5,57.9],[82.6,57.3],[86.5,56.2],[87.8,53.3],[84.4,51.3],[80.4,50.2],[76.5,49.3],[72.5,48.5],[68.5,47.5],[64.8,45.9],[62.0,43.0]];
var PILGRIM_LEN = (function(){ var n = 0; for(var i=1;i<PILGRIM_PATH.length;i++) n += Math.hypot(PILGRIM_PATH[i][0]-PILGRIM_PATH[i-1][0], PILGRIM_PATH[i][1]-PILGRIM_PATH[i-1][1]); return n; })();
var PILGRIM_SPEED = 24 / PILGRIM_LEN;   // 24 picture pixels a second, as a fraction of the whole path

var pilgrimPos = null;          // how far along the path the pilgrim stands right now (0 to 1)
var pilgrimFaceLeft = null;
var pilgrimRaf = 0, pilgrimBubbleTimer = 0, pilgrimStartTimer = 0, pilgrimGreetTimer = 0;
var pilgrimGreetPending = false, pilgrimMsgI = 0;

function pilgrimPoint(f){
  var n = PILGRIM_PATH.length - 1, x = Math.max(0, Math.min(1, f)) * n, i = Math.min(n - 1, Math.floor(x)), u = x - i;
  var a = PILGRIM_PATH[i], b = PILGRIM_PATH[i+1];
  return {x:a[0] + (b[0]-a[0])*u, y:a[1] + (b[1]-a[1])*u, dx:b[0]-a[0]};
}

function pilgrimSceneHtml(){
  var lit = goldenTicketUnlocked();
  return '<div class="pixScene" id="pixScene">' +
    '<img class="pixSceneArt" src="tiles/scene_home.png" alt="">' +
    '<div class="churchGlow' + (lit ? ' lit' : '') + '"></div>' +
    '<img class="pixSpark" src="tiles/spark.png" alt="">' +
    '<div class="pixDove"><div class="pixDoveBob"><div class="pixDoveSprite"></div></div></div>' +
    '<div class="pilgrim" id="pilgrim" role="button" aria-label="Pilgrim" onclick="pilgrimTap()"><div class="pilgrimFlip"><div class="pilgrimSprite"></div></div></div>' +
    '<div class="pilgrimBubble" id="pilgrimBubble" onclick="pilgrimHide()"></div>' +
  '</div>';
}

function pilgrimPlace(el, f, sign){
  var p = pilgrimPoint(f);
  el.style.left = ((p.x - PILGRIM_W/2) / SCENE_W * 100) + "%";
  el.style.top = ((p.y - PILGRIM_H + 1) / SCENE_H * 100) + "%";
  if(Math.abs(p.dx) > 0.05){
    if(sign) pilgrimFaceLeft = (p.dx * sign < 0);
    else if(pilgrimFaceLeft === null) pilgrimFaceLeft = (p.dx < 0);
  }
  var flip = el.firstChild;
  if(flip) flip.classList.toggle("left", !!pilgrimFaceLeft);
}

function pilgrimSay(text){

// Tapping the pilgrim: a little hop and the next thing he has to say.

function pilgrimArrived(el, walkedForward){

// Called after the Home Screen is drawn. The pilgrim stands where he was last time, then walks to the spot that matches
// the player's points. If the screen is redrawn mid-walk (e.g. the folder opens) he carries on from where he is.
function pilgrimInit(isNew){
  cancelAnimationFrame(pilgrimRaf); clearTimeout(pilgrimStartTimer); clearTimeout(pilgrimGreetTimer); clearTimeout(pilgrimBubbleTimer);
  var el = document.getElementById("pilgrim"); if(!el) return;
  if(isNew) pilgrimGreetPending = true;
  var target = Math.min(1, state.points / GOLDEN_TICKET_POINTS);
  if(pilgrimPos === null) pilgrimPos = (typeof state.pilgrimP === "number") ? Math.max(0, Math.min(1, state.pilgrimP)) : target;
  pilgrimPlace(el, pilgrimPos, 0);
  var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var dist = target - pilgrimPos;
  if(Math.abs(dist) < 0.0005 || calm){
    pilgrimPos = target; pilgrimPlace(el, pilgrimPos, 0);
    pilgrimArrived(el, false);
    return;
  }
  var sign = dist > 0 ? 1 : -1;
  pilgrimStartTimer = setTimeout(function(){
    if(!el.isConnected) return;
    el.classList.add("walking");
    var last = performance.now();
    function step(now){
      if(!el.isConnected) return;      // redrawn: the new drawing picks the walk up from pilgrimPos
      var move = PILGRIM_SPEED * Math.min(0.1, (now - last) / 1000); last = now;
      if(Math.abs(target - pilgrimPos) <= move){
        pilgrimPos = target; pilgrimPlace(el, pilgrimPos, sign);
        el.classList.remove("walking");
        pilgrimArrived(el, sign > 0);
        return;
      }
      pilgrimPos += sign * move; pilgrimPlace(el, pilgrimPos, sign);
      pilgrimRaf = requestAnimationFrame(step);
    }
    pilgrimRaf = requestAnimationFrame(step);
  }, 350);
}

// Each round asks 10 questions drawn at random from the pool (2026-10-19, per

var FAITH_FLASH_ROUND_SIZE = 10;

function initFaithFlash(){
  var order = shuffle(FAITH_FLASH_QUESTIONS.map(function(_,i){return i;})).slice(0, FAITH_FLASH_ROUND_SIZE);
  state.session.faithFlash = {order:order, index:0, correct:0, answered:null, answerOrder:shuffle([0,1,2]), status:"playing"};
  saveState();
}

function ffAnswer(choiceIdx){
  var s = state.session.faithFlash;
  if(!s || s.answered !== null) return;
  var q = FAITH_FLASH_QUESTIONS[s.order[s.index]];
  var actualIdx = s.answerOrder[choiceIdx];
  s.answered = choiceIdx;
  var isCorrect = actualIdx === q.correct;
  if(isCorrect) s.correct++;
  saveState(); render();
  if(!isCorrect){
    setTimeout(function(){
      var s2 = state.session.faithFlash;
      if(!s2 || s2.status !== "playing") return;
      s2.status = "results";
      saveState(); render();
    }, 1300);
  }
}

function ffNext(){
  var s = state.session.faithFlash;
  if(!s) return;
  if(s.index >= s.order.length - 1){
    s.status = "results";
    saveState(); render();
  } else {
    s.index++; s.answered = null; s.answerOrder = shuffle([0,1,2]); saveState(); render();
  }
}

      // not the full 10-question deck -- a fail on question 5 should read

      '<p class="center"><strong>' + t("scoreOf")(s.correct, s.index+1) + '</strong></p>' +

/* ---------- Faith Match ---------- */

function buildMatchDeck(dim){
  var pairs = (dim*dim)/2;
  // Pick a random subset of the tile pool each time instead of always the
  // first N in order — since all 3 levels now use the same 4x4 size (8
  // pairs), without this every level would show the exact same 8 tiles.
  var pool = pairs <= MATCH_SYMBOLS.length ? shuffle(MATCH_SYMBOLS).slice(0,pairs) : MATCH_SYMBOLS;
  var deck = [];
  for(var i=0;i<pairs;i++){
    var sym = pool[i % pool.length];
    deck.push(sym, sym);
  }
  deck = shuffle(deck);
  return deck.map(function(sym,id){ return {id:id, symbol:sym, matched:false}; });
}

function initFaithMatchLevel(levelIdx){
  var dim = MATCH_LEVELS[levelIdx];
  state.missions.faithMatch.level = levelIdx;
  state.session.faithMatch = {
    level: levelIdx, dim: dim, chances: MATCH_CHANCES[levelIdx], maxChances: MATCH_CHANCES[levelIdx],
    cards: buildMatchDeck(dim), flipped: [], status: "playing"
  };
  saveState();
}

function fmFlip(cardId){
  var s = state.session.faithMatch;
  if(!s || s.status !== "playing" || s.chances <= 0) return;
  if(s.flipped.length >= 2) return;
  var card = s.cards[cardId];
  if(card.matched || s.flipped.indexOf(cardId) !== -1) return;
  s.flipped.push(cardId);
  if(s.flipped.length === 2){
    var a = s.cards[s.flipped[0]], b = s.cards[s.flipped[1]];
    if(a.symbol === b.symbol){
      // A correct match resolves immediately -- unlike a mismatch, there's
      // no reason to pause on it to let the player study both cards before
      // they flip back down -- so the tiles dim without delay (2026-09-30,
      // per Dan; previously both cases shared the same 650ms pause).
      fmEvaluate();
      return;
    }
  }
  saveState(); render();
  if(s.flipped.length === 2){
    setTimeout(fmEvaluate, 650);
  }
}

function fmEvaluate(){
  var s = state.session.faithMatch;
  if(!s || s.flipped.length !== 2) return;
  var a = s.cards[s.flipped[0]], b = s.cards[s.flipped[1]];
  if(a.symbol === b.symbol){
    a.matched = true; b.matched = true;
    s.flipped = [];
    var allMatched = s.cards.every(function(c){ return c.matched; });
    if(allMatched){
      if(s.level === MATCH_LEVELS.length - 1){
        s.status = "complete";
      } else {
        var nextLevel = s.level + 1;
        saveState(); render();
        setTimeout(function(){
          var s2 = state.session.faithMatch;
          if(!s2 || s2.status !== "playing") return;
          initFaithMatchLevel(nextLevel);
          render();
        }, FM_LEVEL_PAUSE_MS);
        return;
      }
    }
  } else {
    s.flipped = [];
    s.chances--;
    if(s.chances <= 0){
      saveState(); render();
      setTimeout(function(){
        var s2 = state.session.faithMatch;
        if(!s2 || s2.status !== "playing") return;
        s2.status = "failed";
        saveState(); render();
      }, 1300);
      return;
    }
  }
  saveState(); render();
}

function fmCollectAward(){
  var level = state.session.faithMatch.level;
  state.session.faithMatch = null;
  state.missions.faithMatch.level = 0;
  grantMission("faithMatch");
}

function fmTryAgain(){
  var level = state.missions.faithMatch.level;
  initFaithMatchLevel(level);
  go("faithMatch");
}

function fmQuit(){ state.session.faithMatch = null; go("mainMenu"); }

// Renders `max` heart slots (hiding the ones beyond `current` with
// visibility:hidden rather than omitting them) so the "Chances left:" label
// beside it never shifts as chances tick down -- the row's total text width
// stays constant at its starting (max) width instead of shrinking around a
// centered midpoint (2026-09-29, per Dan).
function chancesHeartsHtml(current, max){
  var html = "";
  for(var i=0;i<max;i++){
    html += '<span style="visibility:' + (i < current ? "visible" : "hidden") + '">❤️</span>';
  }
  return html;
}

function screenFaithMatch(){
  if(!matchTilesReady){
    // Guaranteed brief in practice (preload starts at app boot), but this is
    // what actually prevents the blank-white-tile flash: no card can be
    // flipped until every tile image has genuinely finished loading.
    return '<div class="screen center"><p class="smallNote">' + t("fm_loading") + '</p></div>';
  }
  var s = state.session.faithMatch;
  if(!s){ initFaithMatchLevel(state.missions.faithMatch.level||0); s = state.session.faithMatch; }

  if(s.status === "failed"){
    return '<div class="screen center">' +
      '<h1>' + t("fm_failTitle") + '</h1>' +
      '<p>' + t("fm_failBody") + '</p>' +

  }

  if(s.status === "complete"){
    return '<div class="screen center">' +
      '<h1>' + t("fm_passTitle") + '</h1>' +
      '<p>' + t("fm_passBody") + '</p>' +
      '<div class="spacer"></div>' +

      '<button class="btn outline" onclick="fmQuit()">' + t("mainMenu") + '</button>' +

  }

  var dim = s.dim;
  var cellsHtml = s.cards.map(function(c){
    var shown = c.matched || s.flipped.indexOf(c.id) !== -1;
    var cls = "matchCard" + (c.matched ? " matched" : (shown ? " flipped" : ""));
    // decoding="sync": render() replaces the WHOLE grid's innerHTML on every
    // flip/match, so every matchCard <img> (even an already-matched one) is a
    // brand-new DOM node each time -- if the browser's decoded-bitmap cache
    // has been evicted (common on mobile) that forces a redecode, which paints
    // one/two blank-white frames first under the default async decoding.
    // Forcing a synchronous decode removes that flash (2026-09-30, per Dan).
    var inner = shown ? '<img src="' + c.symbol + '" alt="" decoding="sync">' : "";
    return '<div class="' + cls + '" onclick="fmFlip(' + c.id + ')">' + inner + '</div>';
  }).join("");

  return '<div class="screen">' +
    '<h2>' + t("faithMatchName") + '</h2>' +
    '<p class="smallNote">' + t("fm_level")(s.level+1, MATCH_LEVELS.length) + '</p>' +
    '<div class="chancesRow">' + t("chancesLeft") + ' ' + chancesHeartsHtml(Math.max(0,s.chances), s.maxChances || MATCH_CHANCES[s.level]) + '</div>' +
    '<div class="matchGrid" style="grid-template-columns:repeat(' + dim + ',1fr)">' + cellsHtml + '</div>' +
    '<div class="spacer"></div>' +
    '<button class="btn outline" onclick="fmQuit()">' + t("mainMenu") + '</button>' +
  '</div>';
}

function handlePhotoCapture(ev){
  var file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if(!file) return;
  var img = new Image();
  var reader = new FileReader();
  reader.onload = function(e){
    img.onload = function(){
      var maxDim = 800;
      var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      var dataUrl = canvas.toDataURL("image/jpeg", 0.7);
      if(!state.session.chooseJoy) state.session.chooseJoy = {};
      state.session.chooseJoy.pendingPhoto = dataUrl;
      saveState(); render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- Follow the Light ---------- */
// Simon-style pattern memory on a 3x3 grid of image tiles (redesigned
// 2026-09-30, per Dan, to mirror Faith Match's header: "Level X of X" +
// a shared "Chances left" pool of 3 across all 8 levels, instead of the
// original 4-pad/no-chances version). Tiles reuse Faith Match's own tile
// art (MATCH_SYMBOLS) rather than needing bespoke assets: each level picks
// 9 distinct images at random for the grid, then a random tap pattern of
// that level's target length. A wrong tap costs a chance and replays the
// SAME pattern from the start (not a new one) so the player can still
// memorize it; running out of chances restarts the whole run from Level 1,
// same philosophy as Catch the Light.
var FL_LEVELS = [3,4,5,6,7,8,9,10]; // pattern length per level (Level 1..8)
var FL_GRID_TILES = 9; // 3x3
var FL_MAX_MISSES = 3; // chances shared across all 8 levels
var FL_SHOW_ON_MS = 550, FL_SHOW_GAP_MS = 250; // per-tile flash / gap while playing back a pattern
var FL_PRE_SHOW_MS = 800; // "after a moment" pause before playback starts on a fresh level
var FL_TAP_FLASH_MS = 400; // how long a tile's image shows after a correct tap
var FL_WRONG_MSG_MS = 900; // how long "INCORRECT TILE!" shows before "TRY AGAIN"
var FL_RETRY_MSG_MS = 900; // how long "TRY AGAIN" shows before the pattern replays
var FL_LEVEL_PAUSE_MS = 900; // pause after a level's pattern is completed, before the next level begins

function initFollowLightRun(){
  state.session.followLight = {level:0, chances:FL_MAX_MISSES, maxChances:FL_MAX_MISSES, status:"playing"};
  flSetupLevel(0);
}

function flSetupLevel(levelIdx){
  var s = state.session.followLight;
  var patternLen = FL_LEVELS[levelIdx];
  var pattern = [];
  for(var i=0;i<patternLen;i++) pattern.push(Math.floor(Math.random()*FL_GRID_TILES));
  s.level = levelIdx;
  s.tiles = shuffle(MATCH_SYMBOLS).slice(0, FL_GRID_TILES);
  s.pattern = pattern;
  s.playerIndex = 0;
  s.showingIndex = -1;
  s.phase = "ready";
  saveState();
}

// Pauses on a blank grid for FL_PRE_SHOW_MS ("after a moment"), then hands
// off to flPlayPattern(). Called once right after entering a fresh level
// (openMission, flTryAgain, and flLevelComplete's own advance-to-next-level).
function flStartLevel(){
  setTimeout(function(){
    var s = state.session.followLight;
    if(!s || s.status !== "playing" || s.phase !== "ready") return;
    s.phase = "showing";
    saveState(); render();
    flPlayPattern();
  }, FL_PRE_SHOW_MS);
}

// Plays back the current level's pattern one tile at a time via its own
// setTimeout chain. Guards on s.phase==="showing" at every step so a
// quit/retry/wrong-tap mid-playback can't leave a stray timer still
// flashing tiles after the player has moved on.
function flPlayPattern(){
  var s = state.session.followLight;
  if(!s || s.phase !== "showing") return;
  var step = 0;
  function showNext(){
    var s2 = state.session.followLight;
    if(!s2 || s2.phase !== "showing") return;
    if(step >= s2.pattern.length){
      s2.showingIndex = -1;
      s2.phase = "input";
      saveState(); render();
      return;
    }
    s2.showingIndex = s2.pattern[step];
    saveState(); render();
    setTimeout(function(){
      var s3 = state.session.followLight;
      if(!s3 || s3.phase !== "showing") return;
      s3.showingIndex = -1;
      saveState(); render();
      step++;
      setTimeout(showNext, FL_SHOW_GAP_MS);
    }, FL_SHOW_ON_MS);
  }
  showNext();
}

function flTileTap(tileIdx){
  var s = state.session.followLight;
  if(!s || s.phase !== "input") return;
  if(tileIdx !== s.pattern[s.playerIndex]){ flWrongTap(); return; }
  s.showingIndex = tileIdx;
  saveState(); render();
  setTimeout(function(){
    var s2 = state.session.followLight;
    if(!s2 || s2.phase !== "input") return;
    s2.showingIndex = -1;
    s2.playerIndex++;
    if(s2.playerIndex >= s2.pattern.length){ flLevelComplete(); return; }
    saveState(); render();
  }, FL_TAP_FLASH_MS);
}

function flWrongTap(){
  var s = state.session.followLight;
  s.chances--;
  s.showingIndex = -1;
  flPlayFailSound();
  if(s.chances <= 0){
    s.status = "failed";
    saveState(); render();
    return;
  }
  s.phase = "wrong";
  saveState(); render();
  setTimeout(function(){
    var s2 = state.session.followLight;
    if(!s2 || s2.status !== "playing") return;
    s2.phase = "retry";
    s2.playerIndex = 0;
    saveState(); render();
    setTimeout(function(){
      var s3 = state.session.followLight;
      if(!s3 || s3.status !== "playing" || s3.phase !== "retry") return;
      s3.phase = "showing";
      saveState(); render();
      flPlayPattern();
    }, FL_RETRY_MSG_MS);
  }, FL_WRONG_MSG_MS);
}

function flLevelComplete(){
  var s = state.session.followLight;
  s.showingIndex = -1;
  if(s.level >= FL_LEVELS.length - 1){
    s.status = "complete";
    saveState(); render();
    return;
  }
  s.phase = "levelComplete";
  saveState(); render();
  var nextLevel = s.level + 1;
  setTimeout(function(){
    var s2 = state.session.followLight;
    if(!s2 || s2.status !== "playing") return;
    flSetupLevel(nextLevel);
    render();
    flStartLevel();
  }, FL_LEVEL_PAUSE_MS);
}

// Simple Web Audio beep for a wrong tap — this app has no sound-asset
// pipeline elsewhere, so a synthesized tone avoids needing a bespoke audio
// file. The AudioContext is created lazily (browsers block it until a user
// gesture) and reused rather than rebuilt on every wrong tap.
var flAudioCtx = null;
function flPlayFailSound(){
  try {
    if(!flAudioCtx) flAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var ctx = flAudioCtx;
    var osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(220, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.3);
  } catch(e){}
}

function flCollectAward(){ state.session.followLight = null; grantMission("followLight"); }
// Running out of chances restarts the whole 8-level run from Level 1 (same
// convention as Catch the Light's clTryAgain), not just the failed level.
function flTryAgain(){ initFollowLightRun(); go("followLight"); flStartLevel(); }
function flQuit(){ state.session.followLight = null; go("mainMenu"); }

function screenFollowLight(){
  var s = state.session.followLight;

  }

  var msg = "", msgCls = "flMsg center";
  if(s.phase === "input") msg = t("fl_repeat");
  else if(s.phase === "wrong"){ msg = t("fl_incorrect"); msgCls = "flMsg center wrong"; }
  else if(s.phase === "retry") msg = t("fl_tryAgainMsg");

  var tilesHtml = s.tiles.map(function(src, i){
    var lit = s.showingIndex === i;
    var cls = "flPad" + (lit ? " lit" : "") + (s.phase !== "input" ? " disabled" : "");
    var inner = lit ? '<img src="' + src + '" alt="" decoding="sync">' : "";
    return '<div class="' + cls + '" onclick="flTileTap(' + i + ')">' + inner + '</div>';
  }).join("");

  return '<div class="screen">' +
    '<h2>' + t("followLightName") + '</h2>' +
    '<p class="smallNote">' + t("fm_level")(s.level+1, FL_LEVELS.length) + '</p>' +
    '<div class="chancesRow">' + t("chancesLeft") + ' ' + chancesHeartsHtml(Math.max(0,s.chances), s.maxChances) + '</div>' +
    '<div class="flGrid">' + tilesHtml + '</div>' +
    '<p class="' + msgCls + '">' + msg + '</p>' +
    '<div class="spacer"></div>' +
    '<button class="btn outline" onclick="flQuit()">' + t("mainMenu") + '</button>' +
