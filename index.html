/* ---------- Sacred Sudoku ---------- */

// Sacred Sudoku (2026-10-21, per Dan -- replaces Light the Windows). Sudoku with stained-glass pictures instead of numbers: fill the grid so every
// picture appears once in each row, each column and each box. Three puzzles of different sizes: 4 x 4, 5 x 5 (no boxes) and 6 x 6 (boxes
// 2 rows by 3 columns). It cannot be failed. Squares that break the rule glow red. Three hints per puzzle fill in one correct square. Every
// puzzle is made fresh and has exactly one solution. The pictures are six of the Faith Match pictures that look most different from each other.
var SD_PICS = [9, 14, 8, 5, 10, 7, 4, 2, 12];   // faith_tile8_NN: dove, Sacred Heart, crucifix, Lamb of God, chalice, Chi-Rho, bread and fish, Mary, angel (the 9 x 9 level uses all nine)
var SD_LEVELS = [
  {n:4, br:2, bc:2, givens:8},                  // 4 x 4, four 2 x 2 boxes
  {n:5, br:1, bc:1, box:false, givens:12},      // 5 x 5: 5 cannot be cut into boxes, so only rows and columns count (br = bc = 1 switches the box rule off)
  {n:6, br:2, bc:3, givens:15},                 // 6 x 6, six boxes of 2 rows by 3 columns
  {n:9, br:3, bc:3, givens:34}                  // 9 x 9, nine boxes of 3 x 3 (2026-10-22, per Dan)
];
var SD_HINTS = 3;

function sdCanPlace(grid, n, br, bc, pos, v){
  var r = Math.floor(pos / n), c = pos % n, i;
  for(i = 0; i < n; i++){ if(grid[r * n + i] === v || grid[i * n + c] === v) return false; }
  var r0 = r - r % br, c0 = c - c % bc;
  for(var rr = 0; rr < br; rr++) for(var cc = 0; cc < bc; cc++) if(grid[(r0 + rr) * n + c0 + cc] === v) return false;
  return true;
}
// counts the solutions (stops at limit), always trying the square with the fewest choices first
function sdCountSolutions(grid, n, br, bc, limit){
  var count = 0;
  function rec(){
    var best = -1, bestOpts = null, pos, v;
    for(pos = 0; pos < n * n; pos++){
      if(grid[pos] !== 0) continue;
      var opts = [];
      for(v = 1; v <= n; v++) if(sdCanPlace(grid, n, br, bc, pos, v)) opts.push(v);
      if(opts.length === 0) return;
      if(best < 0 || opts.length < bestOpts.length){ best = pos; bestOpts = opts; }
      if(opts.length === 1) break;
    }
    if(best < 0){ count++; return; }
    for(var k = 0; k < bestOpts.length; k++){
      grid[best] = bestOpts[k]; rec(); grid[best] = 0;
      if(count >= limit) return;
    }
  }
  rec();
  return count;
}
function sdRandomSolution(n, br, bc){
  var grid = [], i;
  for(i = 0; i < n * n; i++) grid.push(0);
  var vals = [];
  for(i = 1; i <= n; i++) vals.push(i);
  function fill(pos){
    if(pos === n * n) return true;
    var order = shuffle(vals);
    for(var k = 0; k < order.length; k++){
      if(sdCanPlace(grid, n, br, bc, pos, order[k])){
        grid[pos] = order[k];
        if(fill(pos + 1)) return true;
        grid[pos] = 0;
      }
    }
    return false;
  }
  fill(0);
  return grid;
}
// takes pictures away one at a time, keeping the puzzle at exactly one solution, until about `givens` are left
function sdMakePuzzle(cfg){
  var n = cfg.n, sol = sdRandomSolution(n, cfg.br, cfg.bc), puz = sol.slice(), left = n * n, order = [], i;
  for(i = 0; i < n * n; i++) order.push(i);
  order = shuffle(order);
  for(i = 0; i < order.length && left > cfg.givens; i++){
    var saved = puz[order[i]];
    puz[order[i]] = 0;
    if(sdCountSolutions(puz.slice(), n, cfg.br, cfg.bc, 2) !== 1) puz[order[i]] = saved; else left--;
  }
  return {n:n, br:cfg.br, bc:cfg.bc, box:cfg.box !== false, sol:sol, puz:puz, syms:shuffle(SD_PICS).slice(0, n)};
}

function sdFirstEmpty(cells){ for(var i = 0; i < cells.length; i++) if(cells[i] === 0) return i; return null; }
function initSacredSudoku(){
  var levels = SD_LEVELS.map(sdMakePuzzle);
  state.session.sacredSudoku = {levels:levels, level:0, cells:levels[0].puz.slice(), hinted:[], sel:sdFirstEmpty(levels[0].puz), hints:SD_HINTS, busy:false, status:"playing"};
  saveState();
}
// which squares break the rule: the same picture twice in a row, column or box
function sdClashes(cells, lv){
  var n = lv.n, bad = {};
  for(var a = 0; a < n * n; a++){
    if(!cells[a]) continue;
    for(var b2 = a + 1; b2 < n * n; b2++){
      if(cells[b2] !== cells[a]) continue;
      var ra = Math.floor(a / n), ca = a % n, rb = Math.floor(b2 / n), cb = b2 % n;
      if(ra === rb || ca === cb || (Math.floor(ra / lv.br) === Math.floor(rb / lv.br) && Math.floor(ca / lv.bc) === Math.floor(cb / lv.bc))){ bad[a] = true; bad[b2] = true; }
    }
  }
  return bad;
}
function sdSelect(i){
  var s = state.session.sacredSudoku;
  if(!s || s.status !== "playing" || s.busy) return;
  var lv = s.levels[s.level];
  if(lv.puz[i] !== 0 || s.hinted.indexOf(i) !== -1) return;          // the starting pictures and hinted squares are fixed
  s.sel = i; saveState(); render();
}
function sdPlace(v){
  var s = state.session.sacredSudoku;
  if(!s || s.status !== "playing" || s.busy || s.sel === null) return;
  var lv = s.levels[s.level];
  s.cells[s.sel] = v;
  var clash = v !== 0 && sdClashes(s.cells, lv)[s.sel];
  var done = s.cells.every(function(x, i){ return x === lv.sol[i]; });
  if(done){ sdFinishPuzzle(s); return; }
  pixSfxPlay(clash ? "fmMiss" : "fmFirst", true);
  saveState(); render();
  // A picture that breaks the rule glows red, and after 2 seconds that picture -- the one just placed, which caused the red -- clears itself, so
  // there is no need to tap the X (2026-10-22, per Dan). Other red squares are left alone, and the starting and hinted pictures never clear.
  if(clash){
    var level = s.level, pos = s.sel;
    setTimeout(function(){
      var s2 = state.session.sacredSudoku;
      if(!s2 || s2 !== s || s2.level !== level || s2.done || s2.status !== "playing") return;
      var lv2 = s2.levels[s2.level];
      if(s2.cells[pos] !== v || lv2.puz[pos] !== 0 || s2.hinted.indexOf(pos) !== -1) return;   // it has been changed or cleared already
      if(!sdClashes(s2.cells, lv2)[pos]) return;                                                // it is no longer breaking the rule
      s2.cells[pos] = 0;
      saveState(); render();
    }, 2000);
  }
}
// CLEAR takes every picture the player has put on the board off again; the starting pictures and hinted ones stay
function sdClearAll(){
  var s = state.session.sacredSudoku;
  if(!s || s.status !== "playing" || s.busy) return;
  var lv = s.levels[s.level];
  for(var i = 0; i < s.cells.length; i++){
    if(lv.puz[i] === 0 && s.hinted.indexOf(i) === -1) s.cells[i] = 0;
  }
  s.sel = sdFirstEmptyPlayable(s);
  saveState(); render();
}
function sdFirstEmptyPlayable(s){
  for(var i = 0; i < s.cells.length; i++) if(s.cells[i] === 0) return i;
  return null;
}
function sdHint(){
  var s = state.session.sacredSudoku;
  if(!s || s.status !== "playing" || s.busy || s.hints <= 0) return;
  var lv = s.levels[s.level];
  var wrong = [];
  for(var i = 0; i < s.cells.length; i++) if(s.cells[i] !== lv.sol[i]) wrong.push(i);
  if(!wrong.length) return;
  var target = (s.sel !== null && wrong.indexOf(s.sel) !== -1) ? s.sel : wrong[Math.floor(Math.random() * wrong.length)];
  s.cells[target] = lv.sol[target]; s.hinted.push(target); s.hints--;
  s.sel = null;
  var done = s.cells.every(function(x, k){ return x === lv.sol[k]; });
  if(done){ sdFinishPuzzle(s); return; }
  var nextEmpty = null;
  for(var k = 0; k < s.cells.length; k++) if(s.cells[k] !== lv.sol[k] && lv.puz[k] === 0){ nextEmpty = k; break; }
  s.sel = nextEmpty;
  pixSfxPlay("fmMatch", true);
  saveState(); render();
}
// Finishing a puzzle celebrates exactly like finishing a Faith Match level (2026-10-21, per Dan): the picture that completes the grid makes the
// match sound, the grid stays at normal brightness for a beat, then the Faith Match fanfare plays while ONE random square frame at a time
// glows (never the same square twice in a row, a tenth of a second each, for 3 seconds), and then the next puzzle (or the result) comes.
// render() calls sdCelebrate(), so a reload in the middle of it picks the sequence back up.
var sdCelebrating = false;
function sdFinishPuzzle(s){
  s.busy = true; s.sel = null; s.done = true;
  pixSfxPlay("fmMatch", true);                 // the last picture, like the last pair of tiles
  saveState(); render();
}
function sdCelebrate(){
  if(sdCelebrating) return;
  var s = state.session.sacredSudoku;
  if(!s || !s.done) return;
  sdCelebrating = true;
  function alive(){ return state.session.sacredSudoku === s && s.done && state.screen === "sacredSudoku"; }   // the player has not left
  function begin(){
    if(!alive()){ sdCelebrating = false; return; }
    s.celebrate = true; saveState();
    pixSfxPlay("fmFanfare", false);
    var step = 0, last = -1, t0 = performance.now();
    function tick(){
      if(!alive()){ sdCelebrating = false; return; }
      var cells = document.querySelectorAll(".sdBoard .sdCell");
      for(var i = 0; i < cells.length; i++) cells[i].classList.remove("glow");
      if(step >= FM_FLASH_STEPS){ sdCelebrating = false; sdNextPuzzle(s); return; }
      var idx;
      do { idx = Math.floor(Math.random() * cells.length); } while(idx === last && cells.length > 1);
      last = idx;
      if(cells[idx]) cells[idx].classList.add("glow");
      step++;
      setTimeout(tick, Math.max(0, t0 + step * FM_FLASH_MS - performance.now()));
    }
    tick();
  }
  setTimeout(begin, s.celebrate ? 0 : FM_FANFARE_DELAY_MS);   // after a reload mid-celebration there is no second pause
}
function sdNextPuzzle(s){
  if(state.session.sacredSudoku !== s || s.status !== "playing") return;
  s.done = false; s.celebrate = false;
  if(s.level >= s.levels.length - 1){ s.status = "passed"; }
  else {
    s.level++; var nl = s.levels[s.level];
    s.cells = nl.puz.slice(); s.hinted = []; s.hints = SD_HINTS; s.sel = sdFirstEmpty(nl.puz); s.busy = false;
  }
  saveState(); render();
}
function sdCollectAward(){ state.session.sacredSudoku = null; grantMission("sacredSudoku"); }
function sdQuit(){ state.session.sacredSudoku = null; go("mainMenu"); }

function sdPicUrl(lv, v){ return 'tiles/faith_tile8_' + ("0" + lv.syms[v - 1]).slice(-2) + '.png'; }

function screenSacredSudoku(){
  var s = state.session.sacredSudoku;
  if(!s){ initSacredSudoku(); s = state.session.sacredSudoku; }

  if(s.status === "passed"){
    return pixResultHtml("sudokuName", {cls:"pixLower", title:t("sd_passTitle"), body:t("sd_passBody"), badge:"sacredSudoku",
      buttons:pixBtnHtml(t("collectAward"), "sdCollectAward()") + pixBtnHtml(t("mainMenu"), "sdQuit()", true)});
  }

  var lv = s.levels[s.level], n = lv.n;
  var bad = sdClashes(s.cells, lv);
  // The board is a grid of boxes and each box is a grid of squares: 2px lines between squares, 4px lines between boxes and around the edge
  // (a level with no boxes is one big box).
  var boxed = lv.box !== false, lr = boxed ? lv.br : n, lc = boxed ? lv.bc : n, boxesHtml = "";
  for(var r0 = 0; r0 < n; r0 += lr) for(var c0 = 0; c0 < n; c0 += lc){
    var inner = "";
    for(var rr = 0; rr < lr; rr++) for(var cc = 0; cc < lc; cc++){
      var i = (r0 + rr) * n + c0 + cc, v = s.cells[i], cls = "sdCell";
      if(lv.puz[i] === 0 && s.hinted.indexOf(i) !== -1) cls += " hint"; else if(lv.puz[i] === 0 && v) cls += " mine";
      if(bad[i]) cls += " clash";
      if(s.sel === i) cls += " sel";
      var fixed = lv.puz[i] !== 0 || s.hinted.indexOf(i) !== -1;
      inner += '<button class="' + cls + '" data-sfx="own"' + (v ? ' style="background-image:url(' + sdPicUrl(lv, v) + ')"' : '') + (fixed ? '' : ' onclick="sdSelect(' + i + ')"') + '></button>';
    }
    boxesHtml += '<div class="sdBox" style="grid-template-columns:repeat(' + lc + ',1fr)">' + inner + '</div>';
  }
  var palHtml = "";
  for(var k = 1; k <= n; k++) palHtml += '<button class="sdPick" data-sfx="own" style="background-image:url(' + sdPicUrl(lv, k) + ')" onclick="sdPlace(' + k + ')"></button>';
  palHtml += '<button class="sdPick sdErase" data-sfx="own" onclick="sdPlace(0)" aria-label="' + t("sd_erase") + '">&#10005;</button>';
  var won = s.busy;

  return '<div class="screen pixHome pixSky pixMission pixLower' + (n >= 9 ? ' sdBig' : '') + '">' + cloudsHtml() +
    '<h2 class="pixMTitle">' + t("sudokuName") + '</h2>' +
    '<div class="pixNote sdIntro">' + t(boxed ? "sd_intro" : "sd_intro2") + '</div>' +
    '<div class="wuBar">' +
      '<button class="sdHint skip"' + (won ? ' disabled' : '') + ' onclick="sdClearAll()">' + t("clearWord") + '</button>' +
      '<span class="pixNote">' + t("fm_level")(s.level + 1, s.levels.length) + '</span>' +
      '<button class="sdHint" data-sfx="own"' + (s.hints > 0 && !won ? '' : ' disabled') + ' onclick="sdHint()">' + t("sd_hint")(s.hints) + '</button></div>' +
    '<div class="sdBoard" style="grid-template-columns:repeat(' + (n / lc) + ',1fr)">' + boxesHtml + '</div>' +
    '<div class="sdPal' + (n >= 9 ? ' two' : '') + '">' + palHtml + '</div>' +
    '<div class="spacer"></div>' +
    '<button class="btn pixBtn secondary pixBtnSm" onpointerdown="pixPressSfx()" onclick="pixClickSfx();sdQuit()">' + t("mainMenu") + '</button>' +
  '</div>';
}

/* ---------- Stained-Glass Puzzle ---------- */

// Replaced Service Sprint (2026-10-19, per Dan), then turned from a sliding
// puzzle into a jigsaw (per Dan -- slide puzzles were too hard), then given 4
// levels of 12 / 16 / 20 / 24 pieces (per Dan). Each level is cut from a random
// Faith Match picture (the same 16 tile images, already preloaded). The player
// drags loose, jigsaw-shaped pieces from a tray into an empty frame; a piece
// within reach of its own spot snaps in and locks, anything else springs back
// to the tray. No chances, no timer -- it cannot be failed. When a level is
// finished the whole picture is shown for 3 seconds with no piece lines.
// The whole board is ONE <svg> in a fixed 340-unit-wide coordinate space that
// scales to the screen. The board is always square, so a level's grid decides
// the piece shape (4x3 gives slightly tall pieces, 6x4 narrower ones). Dragging
// moves pieces by direct DOM writes (not render(), which would replace the
// piece being held); render() only runs when a level is solved. Piece edges
// (the knobs) come from a seeded random generator, so a page reload rebuilds
// exactly the same pieces.
var PZ_LEVELS = [
  {cols:4, rows:3},   // level 1: 12 pieces
  {cols:4, rows:4},   // level 2: 16 pieces
  {cols:5, rows:4},   // level 3: 20 pieces
  {cols:6, rows:4}    // level 4: 24 pieces
];
var PZ_W = 340;                 // board is PZ_W x PZ_W units
var PZ_TRAY_BUDGET = 230;       // most height the tray may use, in units (on a short screen pzFit lowers pzTrayBudget so the frame and tray fit)
var PZ_TRAY_MIN = 80;           // least height the tray is made to use
var pzTrayBudget = PZ_TRAY_BUDGET;
var pzFitTries = 0;
var PZ_TRAY_PAD = 10;           // room around a tray piece for its knobs
var PZ_SNAP_MIN = 24;           // snap distance is half the short side, but at least this
var PZ_LIFT = 36;               // a held piece rides this far above the finger
var PZ_SOLVED_MS = 3000;        // how long the finished picture is shown
var pzAdvancing = false;        // true while the "solved" hold is pending
var pzCtx = null;               // geometry of the board currently on screen
var pzDrag = null;              // the piece being dragged, if any

function pzRng(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// One side of a piece, from (x0,y0) to (x1,y1). tab: +1 knob out, -1 knob in,
// 0 flat. The knob is sized from m (the piece's shorter side) and centered on
// the edge, so it looks the same on a long edge and a short one.
function pzEdge(x0, y0, x1, y1, tab, m){
  if(!tab) return ' L' + x1 + ' ' + y1;
  var dx = x1 - x0, dy = y1 - y0, len = Math.sqrt(dx*dx + dy*dy), ux = dx/len, uy = dy/len;
  var mx = (x0 + x1)/2, my = (y0 + y1)/2, half = 0.12 * m, r = 0.14 * m;
  return ' L' + (mx - ux*half) + ' ' + (my - uy*half) +
         ' A' + r + ' ' + r + ' 0 1 ' + (tab > 0 ? 1 : 0) + ' ' + (mx + ux*half) + ' ' + (my + uy*half) +
         ' L' + x1 + ' ' + y1;
}

// Geometry for level s.round: piece outlines, slots, and tray positions
// (pieces already placed get none).
function pzBuild(s){
  var lvl = PZ_LEVELS[s.round], cols = lvl.cols, rows = lvl.rows, n = cols * rows;
  var pw = PZ_W / cols, ph = PZ_W / rows, m = Math.min(pw, ph), rng = pzRng(s.seeds[s.round]);
  var r, c, i, hT = [], vT = [];
  for(r=0;r<rows;r++){ hT[r] = []; vT[r] = []; for(c=0;c<cols;c++){ hT[r][c] = rng() < 0.5 ? 1 : -1; vT[r][c] = rng() < 0.5 ? 1 : -1; } }
  var order = [];
  for(i=0;i<n;i++) order.push(i);
  for(i=n-1;i>0;i--){ var j = Math.floor(rng()*(i+1)), tmp = order[i]; order[i] = order[j]; order[j] = tmp; }
  var pieces = [];
  for(i=0;i<n;i++){
    r = Math.floor(i/cols); c = i % cols;
    var top = r > 0 ? -vT[r-1][c] : 0, right = c < cols-1 ? hT[r][c] : 0;
    var bottom = r < rows-1 ? vT[r][c] : 0, left = c > 0 ? -hT[r][c-1] : 0;
    var d = 'M0 0' + pzEdge(0,0,pw,0,top,m) + pzEdge(pw,0,pw,ph,right,m) +
            pzEdge(pw,ph,0,ph,bottom,m) + pzEdge(0,ph,0,0,left,m) + ' Z';
    pieces.push({id:i, row:r, col:c, d:d, sx:c*pw, sy:r*ph});
  }
  // Largest tray scale that still fits every piece within the tray budget.
  var k = 0.7, cw, ch, tc = 1, tr = n;
  for(; k >= 0.2; k -= 0.02){
    cw = pw*k + PZ_TRAY_PAD; ch = ph*k + PZ_TRAY_PAD;
    tc = Math.max(1, Math.floor(PZ_W / cw)); tr = Math.ceil(n / tc);
    if(tr * ch <= pzTrayBudget) break;
  }
  var trayTop = PZ_W + 22, slot = 0;
  order.forEach(function(id){
    if(s.placed.indexOf(id) !== -1) return;
    var p = pieces[id];
    p.tx = (PZ_W - tc*cw)/2 + (slot % tc)*cw + PZ_TRAY_PAD/2;
    p.ty = trayTop + Math.floor(slot / tc)*ch + PZ_TRAY_PAD/2;
    p.k = k; slot++;
  });
  return {cols:cols, rows:rows, n:n, pw:pw, ph:ph, m:m, pieces:pieces, k:k, H: trayTop + tr*ch + 12};
}

function initStainedGlass(){
  pzAdvancing = false; pzDrag = null;
  var seeds = [];
  for(var i=0;i<PZ_LEVELS.length;i++) seeds.push(1 + Math.floor(Math.random()*2000000000));
  state.session.stainedGlass = {
    round: 0, imgs: shuffle(MATCH_SYMBOLS).slice(0, PZ_LEVELS.length),
    seeds: seeds, placed: [], status: "playing"
  };
  saveState();
}

function pzToSvg(ev){
  var svg = document.getElementById("pzSvg");
  var pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  var m = svg.getScreenCTM();
  return m ? pt.matrixTransform(m.inverse()) : {x:0, y:0};
}

function pzSetPos(el, x, y, k){
  el.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + k + ')';
}

function pzDown(ev, id){
  var s = state.session.stainedGlass;
  if(!s || s.status !== "playing" || !pzCtx || pzDrag || s.placed.indexOf(id) !== -1) return;
  ev.preventDefault();
  var el = document.getElementById("pzP" + id);
  if(!el) return;
  pzDrag = {id:id, pointerId:ev.pointerId, el:el, x:0, y:0};
  el.style.transition = "none";
  el.classList.add("dragging");
  document.getElementById("pzSvg").appendChild(el); // bring to the front
  pzMove(ev);
  window.addEventListener("pointermove", pzMove);
  window.addEventListener("pointerup", pzUp);
  window.addEventListener("pointercancel", pzUp);
}

function pzMove(ev){
  if(!pzDrag || (ev.pointerId !== undefined && ev.pointerId !== pzDrag.pointerId)) return;
  var pw = pzCtx.pw, ph = pzCtx.ph, p = pzToSvg(ev);
  var x = Math.min(PZ_W - pw*0.8, Math.max(-pw*0.2, p.x - pw/2));
  var y = Math.min(pzCtx.H - ph*0.8, Math.max(-ph*0.2, p.y - ph/2 - PZ_LIFT));
  pzDrag.x = x; pzDrag.y = y;
  pzSetPos(pzDrag.el, x, y, 1);
}

function pzUp(ev){
  if(!pzDrag || (ev && ev.pointerId !== undefined && ev.pointerId !== pzDrag.pointerId)) return;
  window.removeEventListener("pointermove", pzMove);
  window.removeEventListener("pointerup", pzUp);
  window.removeEventListener("pointercancel", pzUp);
  var d = pzDrag; pzDrag = null;
  var s = state.session.stainedGlass, piece = pzCtx.pieces[d.id];
  d.el.classList.remove("dragging");
  if(!s || s.status !== "playing") return;
  var dist = Math.sqrt(Math.pow(d.x - piece.sx, 2) + Math.pow(d.y - piece.sy, 2));
  if(dist < Math.max(PZ_SNAP_MIN, pzCtx.m * 0.5)){
    d.el.style.transition = "transform .12s ease";
    pzSetPos(d.el, piece.sx, piece.sy, 1);
    d.el.classList.add("locked");
    // keep locked pieces underneath the loose ones
    var svg = document.getElementById("pzSvg"), firstLoose = svg.querySelector(".pzPiece:not(.locked)");
    if(firstLoose && firstLoose !== d.el) svg.insertBefore(d.el, firstLoose);
    s.placed.push(d.id);
    var prog = document.getElementById("pzProgress");
    if(prog) prog.textContent = t("pz_pieces")(s.placed.length, pzCtx.n);
    if(s.placed.length >= pzCtx.n){
      s.status = "solved"; saveState();
      setTimeout(function(){ if(state.screen === "stainedGlass") render(); }, 250);
    } else {
      saveState();
    }
  } else {
    d.el.style.transition = "transform .2s ease";
    pzSetPos(d.el, piece.tx, piece.ty, piece.k);
  }
}

// Makes the picture frame and the tray of pieces fit on the screen (2026-10-22, per Dan: the tray used to hang off the bottom). Called after every
// draw: the room left under the heading is measured, and if the tray (the frame keeps its width) is too tall or has room to spare, its height
// budget is changed and the screen is drawn once more with smaller (or larger) pieces. If even the smallest tray does not fit, the whole picture is
// shrunk a little by capping the svg's height.
function pzFit(){
  var svg = document.getElementById("pzSvg"), screen = svg && svg.closest(".screen");
  if(!svg || !screen || pzDrag || !pzCtx) return;
  var spacer = screen.querySelector(".spacer");
  svg.style.height = "";
  var overhead = screen.offsetHeight - svg.getBoundingClientRect().height - (spacer ? spacer.offsetHeight : 0);
  var availPx = window.innerHeight - overhead, w = svg.getBoundingClientRect().width;
  if(!(w > 0) || !(availPx > 0)) return;
  var availUnits = availPx * PZ_W / w;                         // the svg's height in units that the screen has room for
  var budget = Math.max(PZ_TRAY_MIN, Math.min(PZ_TRAY_BUDGET, Math.floor(availUnits - PZ_W - 34)));   // 34 = the gaps above and below the tray (see pzBuild)
  if(Math.abs(budget - pzTrayBudget) >= 2 && pzFitTries < 3){
    pzFitTries++; pzTrayBudget = budget; render(); return;
  }
  pzFitTries = 0;
  if(pzCtx.H > availUnits) svg.style.height = Math.floor(availPx) + "px";
}

function pzAdvance(){
  pzAdvancing = false;
  var s = state.session.stainedGlass;
  if(!s || s.status !== "solved") return;
  // ROUND X COMPLETED! (the message alone: this game has no chances) shows after the finished picture, before the next round and before the
  // results after the last one (2026-10-22, per Dan)
  s.interlude = {n: s.round + 1, phase: "msg", award: false, final: s.round >= PZ_LEVELS.length - 1};
  saveState();
  if(state.screen === "stainedGlass") render();
}
function pzInterlude(){
  pixRoundRun("stainedGlass", function(){ return state.session.stainedGlass; }, null,
    function(s){
      var last = s.interlude.final;
      s.interlude = null;
      if(last) s.status = "passed"; else { s.round++; s.placed = []; s.status = "playing"; }
      saveState(); render();
    });
}

function pzCollectAward(){ state.session.stainedGlass = null; grantMission("stainedGlass"); }
function pzQuit(){ state.session.stainedGlass = null; pzCtx = null; pzDrag = null; go("mainMenu"); }

function screenStainedGlass(){
  if(!matchTilesReady){
    // same guard as Faith Match: the pictures are the Faith Match tiles, and
    // they are preloaded at app boot, so this is a brief beat at most
    return pixShell('<div class="spacer"></div><div class="pixPaper"><div class="pixQ">' + t("fm_loading") + '</div></div><div class="spacer"></div>');
  }
  var s = state.session.stainedGlass;
  if(!s){ initStainedGlass(); s = state.session.stainedGlass; }

  if(s.status === "passed"){
    return pixResultHtml("stainedGlassName", {title:t("pz_passTitle"), body:t("pz_passBody"), badge:"stainedGlass",
      buttons:pixBtnHtml(t("collectAward"), "pzCollectAward()")});
  }

  if(s.interlude){
    return pixShell('<h2 class="pixMTitle">' + t("stainedGlassName") + '</h2>' +
      pixRoundDoneHtml(s.interlude) +
      '<div class="spacer"></div>' +
      pixBtnHtml(t("mainMenu"), "pzQuit()", true));
  }

  var solved = s.status === "solved", lastLevel = s.round >= PZ_LEVELS.length - 1;
  // Also covers a page reload during the "solved" hold: the pending timer is
  // gone, so schedule the advance again whenever this view is drawn.
  if(solved && !pzAdvancing){ pzAdvancing = true; setTimeout(pzAdvance, PZ_SOLVED_MS); }

  var g = pzBuild(s), img = s.imgs[s.round];
  pzCtx = {n:g.n, pw:g.pw, ph:g.ph, m:g.m, pieces:g.pieces, H:g.H};
  var defs = "", placedHtml = "", looseHtml = "";
  g.pieces.forEach(function(p){
    if(solved) return; // a finished level shows only the whole picture (below), so no piece seams can show
    var isPlaced = s.placed.indexOf(p.id) !== -1;
    defs += '<clipPath id="pzC' + p.id + '"><path d="' + p.d + '"/></clipPath>';
    var x = isPlaced ? p.sx : p.tx, y = isPlaced ? p.sy : p.ty, k = isPlaced ? 1 : p.k;
    var html = '<g class="pzPiece' + (isPlaced ? ' locked' : '') + '" id="pzP' + p.id + '" ' +
      'style="transform:translate(' + x + 'px,' + y + 'px) scale(' + k + ');" ' +
      'onpointerdown="pzDown(event,' + p.id + ')">' +
      // invisible box so a narrow piece is easy to grab anywhere on it
      '<rect x="0" y="0" width="' + g.pw + '" height="' + g.ph + '" fill="transparent"/>' +
      '<image href="' + img + '" x="' + (-p.col*g.pw) + '" y="' + (-p.row*g.ph) + '" width="' + PZ_W + '" height="' + PZ_W + '" preserveAspectRatio="none" clip-path="url(#pzC' + p.id + ')"/>' +
      '<path d="' + p.d + '" class="pzOutline"/>' +
    '</g>';
    if(isPlaced) placedHtml += html; else looseHtml += html;
  });
  // Finished level: the whole picture drawn over the pieces, so no seams or
  // piece lines show for the 3-second hold.
  var full = solved ? '<image class="pzFull" href="' + img + '" x="0" y="0" width="' + PZ_W + '" height="' + PZ_W + '" preserveAspectRatio="none"/>' : '';
  var svg = '<svg id="pzSvg" class="pzSvg' + (solved ? ' solved' : '') + '" viewBox="0 0 ' + PZ_W + ' ' + g.H + '" role="img" aria-label="' + t("stainedGlassName") + '">' +
    '<defs>' + defs + '</defs>' +
    '<rect x="0" y="0" width="' + PZ_W + '" height="' + PZ_W + '" class="pzBoardRect"/>' +
    '<rect x="0" y="' + (PZ_W + 12) + '" width="' + PZ_W + '" height="' + (g.H - PZ_W - 12) + '" rx="10" class="pzTrayRect"/>' +
    placedHtml + looseHtml + full +
  '</svg>';

  return pixShell('<h2 class="pixMTitle">' + t("stainedGlassName") + '</h2>' +
    pixPipsHtml(PZ_LEVELS.length, s.round, solved ? "done" : "now", t("pz_round")(s.round+1, PZ_LEVELS.length)) +
    '<div class="pixNote">' + t("pz_round")(s.round+1, PZ_LEVELS.length) + ' &nbsp;|&nbsp; <span id="pzProgress">' + t("pz_pieces")(solved ? g.n : s.placed.length, g.n) + '</span></div>' +
    (solved ? '<div class="pixNote good">' + t("pz_solved") + '</div>' : '<div class="pixNote">' + t("pz_intro") + '</div>') +
    svg +
    (solved && !lastLevel ? '<div class="pixNote">' + t("pz_next") + '</div>' : '') +
    '<div class="spacer"></div>' +
    pixBtnHtml(t("mainMenu"), "pzQuit()", true));
}

/* ---------- Passport ---------- */

// Holds the track's current position in RAW SLOT units (0..PASSPORT_TRACK_SLOTS-1),
// not a page index — slot 0 and the last slot are the phantom clones (see
// PASSPORT_TRACK_SLOTS above), so a real page's own slot is always page+1.
var lastTrackSlot = 1;

function passportNav(delta){
  var raw = state.passportPage + delta;
  var wrapped = raw < 0 || raw > PASSPORT_PAGES-1;
  state.passportPage = (raw + PASSPORT_PAGES) % PASSPORT_PAGES;
  // Which phantom slide (if any) render()'s animation hook should slide
  // THROUGH on its way to the real page — +1 wrapping forward (last page ->
  // first), -1 wrapping backward (first page -> last), 0 for an ordinary step.
  state.passportWrapDelta = wrapped ? delta : 0;
  saveState(); render();
}

var passportTouchStartX = null;
function passportTouchStart(ev){ passportTouchStartX = ev.changedTouches[0].clientX; }
function passportTouchEnd(ev){
  if(passportTouchStartX === null) return;
  var dx = ev.changedTouches[0].clientX - passportTouchStartX;
  passportTouchStartX = null;
  if(dx > 40) passportNav(-1);
  else if(dx < -40) passportNav(1);
}

// TEMPORARY test aid (2026-10-19, per Dan): while true, every Passport badge page shows its badge as
// earned, so all ten 8-bit badges can be checked. Set to false for the real thing (then only badges
// a player has won appear, the rest show a padlock).
var PASSPORT_SHOW_ALL = true;

// The pixel-art version of a mission's badge: tiles/badges96/b96_<name>.png (96x96 pixels and 48 colours, made from the artwork in the
// Badges folder; finer than the first 48x48 set, 2026-10-22, per Dan, so the pictures are easier to make out), shown at 2x.
function badge8Src(m){ return m.badgeImg.replace("tiles/badge_", "tiles/badges96/b96_"); }

function passportPageInner(page){
  if(page < MISSIONS.length){
    var m = MISSIONS[page];
    var earned = PASSPORT_SHOW_ALL || state.missions[m.id].badge;
    return '<div class="pxNote">' + t("missionBadge")(page+1) + '</div>' +
      (earned ? '<img class="badge8" src="' + badge8Src(m) + '" alt="">'
              : '<div class="badge8Locked"><img src="tiles/icons48/ic_lock.png" alt=""></div>') +
      '<div class="pxBadgeName">' + (earned ? t(m.themeKey) : t("badgeLocked")) + '</div>' +
      '<div class="pxBadgeMission">' + t(m.nameKey) + '</div>';
  }
  return '<div class="pxNote">' + t("joyousPhotoPage") + '</div>' +
    (state.photo ? '<img class="photoPreview pxPhoto" src="' + state.photo + '" alt="">'
                 : '<div class="badge8Locked"><img src="tiles/icons48/ic_lock.png" alt=""></div><div class="pxBadgeName">' + t("badgeLocked") + '</div>');
}

// The X: the screen shrinks back into its icon on the Home Screen (n = which icon: 2 = Passport, 4 = Options).
function closeToHome(n){
  go("mainMenu");
  var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var tile = document.querySelector(".homeGrid .appIcon:nth-child(" + n + ") .appTile");
  if(calm || !tile) return;
  var r = tile.getBoundingClientRect(), c = tile.cloneNode(true);
  c.className = "expandClone";
  c.style.cssText = "left:0px;top:0px;width:" + window.innerWidth + "px;height:" + window.innerHeight + "px;border-radius:0px;background:" + tile.style.background + ";";
  var spr = c.querySelector("img"); if(spr) spr.style.transform = "scale(8)";
  document.body.appendChild(c);
  void c.offsetWidth;
  c.style.left = r.left + "px"; c.style.top = r.top + "px"; c.style.width = r.width + "px"; c.style.height = r.height + "px"; c.style.borderRadius = "16px";
  if(spr) spr.style.transform = "scale(1)";
  setTimeout(function(){ c.style.opacity = "0"; }, 260);
  setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); }, 560);
}

// ---- Options (2026-10-20, per Dan): two volume sliders, for the sound effects and for the music ----
function optionRow(kind, label, value){
  var id = kind === "music" ? "Music" : "Sfx";
  return '<div class="optRow">' +
    '<div class="optHead"><img class="optIcon" src="tiles/icons48/ic_' + (kind === "music" ? "music" : "sound") + '.png" alt="">' +
      '<span class="optLabel">' + label + '</span><span class="optValue" id="optVal' + id + '">' + value + '%</span></div>' +
    '<input type="range" class="pixRange" id="opt' + id + '" min="0" max="100" step="5" value="' + value + '" style="--p:' + (value / 100) + '" aria-label="' + label + '" ' +
      'oninput="setVolume(\'' + kind + '\', this.value)" onchange="optionPreview(\'' + kind + '\')">' +
  '</div>';
}
// Moving a slider changes the volume at once. It never redraws the screen (that would let go of the slider).
function setVolume(kind, v){
  v = Math.max(0, Math.min(100, Math.round(+v)));
  if(kind === "music") state.volMusic = v; else state.volSfx = v;
  saveState(); pixApplyVolumes();
  var id = kind === "music" ? "Music" : "Sfx";
  var val = document.getElementById("optVal" + id), inp = document.getElementById("opt" + id);
  if(val) val.textContent = v + "%";
  if(inp) inp.style.setProperty("--p", v / 100);
}
// letting go of the sound-effects slider plays a sound so the level can be heard
function optionPreview(kind){ if(kind !== "music") pixSfxPlay("tap"); }

function screenOptions(){
  return '<div class="screen pixHome pixSky pixPassport">' +
    cloudsHtml() +
    '<div class="passHeader">' +
      '<span class="passHeadSpace"></span>' +
      '<h2 class="passTitle">' + t("optionsTitle") + '</h2>' +
      '<button class="passClose" onpointerdown="pixPressSfx()" onclick="pixClickSfx();closeToHome(4)" aria-label="' + t("mainMenu") + '">X</button>' +
    '</div>' +
    '<div class="pixPaper optCard">' +
      optionRow("sfx", t("sfxVolume"), typeof state.volSfx === "number" ? state.volSfx : 45) +
      optionRow("music", t("musicVolume"), typeof state.volMusic === "number" ? state.volMusic : 60) +
    '</div>' +
    '<div class="spacer"></div>' +
  '</div>';
}

function screenPassport(){
  var page = state.passportPage;
  var dotsHtml = "";
  for(var i=0;i<PASSPORT_PAGES;i++) dotsHtml += '<div class="dot' + (i===page?' active':'') + '"></div>';

  var pageStyle = 'style="width:' + (100/PASSPORT_TRACK_SLOTS) + '%"';
  // Phantom clone of the LAST real page first, then the PASSPORT_PAGES real
  // pages, then a phantom clone of the FIRST real page — see
  // PASSPORT_TRACK_SLOTS above for why. A real page's own slot is always
  // its index + 1.
  var pagesHtml = '<div class="passportPage" ' + pageStyle + '>' + passportPageInner(PASSPORT_PAGES-1) + '</div>';
  for(var i=0;i<PASSPORT_PAGES;i++) pagesHtml += '<div class="passportPage" ' + pageStyle + '>' + passportPageInner(i) + '</div>';
  pagesHtml += '<div class="passportPage" ' + pageStyle + '>' + passportPageInner(0) + '</div>';

  // 8-bit look (2026-10-19, per Dan): the pixel sky, a cream passport page, an X in the corner.
  return '<div class="screen pixHome pixSky pixPassport">' +
    cloudsHtml() +
    '<div class="passHeader">' +
      '<span class="passHeadSpace"></span>' +
      '<h2 class="passTitle">' + t("passportTitle") + '</h2>' +
      '<button class="passClose" onpointerdown="pixPressSfx()" onclick="pixClickSfx();closeToHome(2)" aria-label="' + t("mainMenu") + '">X</button>' +
    '</div>' +
    '<div class="passportBook" ontouchstart="passportTouchStart(event)" ontouchend="passportTouchEnd(event)">' +
      '<div class="passportTrack" id="passportTrack" style="width:' + (PASSPORT_TRACK_SLOTS*100) + '%;transform:translateX(-' + ((page+1)*100/PASSPORT_TRACK_SLOTS) + '%)">' + pagesHtml + '</div>' +
    '</div>' +
    '<div class="dots">' + dotsHtml + '</div>' +
    '<div class="passportNav">' +
      '<button class="navArrow" onpointerdown="pixPressSfx()" onclick="passportNav(-1)" aria-label="Previous">&lt;</button>' +
      '<button class="navArrow" onpointerdown="pixPressSfx()" onclick="passportNav(1)" aria-label="Next">&gt;</button>' +
    '</div>' +
  '</div>';
}

/* ---------- Golden Ticket ---------- */

function clearTicket(){
  state.points = 0;
  MISSIONS.forEach(function(m){ state.missions[m.id].done = false; });
  state.missions.faithMatch.level = 0;
  go("mainMenu");
}

function screenGoldenTicket(){
  return '<div class="screen center">' +
    '<div class="spacer"></div>' +
    '<h1>' + t("ticketTitle") + '</h1>' +
    '<div class="ticketBox"><div class="tk">🎟️</div><strong>FE Y VIDA QUEST</strong></div>' +
    '<p>' + t("ticketBody") + '</p>' +
    '<div class="spacer"></div>' +
    '<button class="btn gold" onclick="clearTicket()">' + t("clearTicket") + '</button>' +
    // Added 2026-09-29, per Dan — previously CLEAR TICKET was the only way
    // off this screen, which meant actually using it (even just to look) was
    // destructive. This one is a plain, non-destructive go('mainMenu') —
    // nothing about points/missions/badges changes — so a player who reaches
    // the Golden Ticket early (5 of 10 missions) can back out and keep
    // playing the remaining ones.
    '<button class="btn outline" onclick="go(\'mainMenu\')">' + t("mainMenu") + '</button>' +
  '</div>';
}

/* ---------- Render ---------- */

var lastRenderedScreen = null;

// Always-visible exit (2026-10-19, per Dan): every mission already had a MAIN
// MENU button, but it sits at the very bottom of the screen and is off-screen
// whenever a game is taller than the phone. This small button stays pinned to
// the top-left while a mission is being played. It is hidden on the finished
// screens (won / lost / solved), which have their own buttons -- and where
// quitting would throw away a win that hasn't been collected yet.
var EXIT_SCREENS = ["missionIntro","faithFlash","faithMatch","beTheLight","chooseJoy","followLight",
  "wordUnscramble","catchLight","kindnessSort","hiddenBlessings","stainedGlass","lightCandle","emojiStories","jesusTimeline","sacredSudoku"];
var EXIT_HIDDEN_STATUS = ["results","passed","complete","failed","solved"];

function exitBarHtml(){
  if(EXIT_SCREENS.indexOf(state.screen) === -1) return "";
  var sess = state.session[state.screen];
  if(sess && EXIT_HIDDEN_STATUS.indexOf(sess.status) !== -1) return "";
  return '<div class="exitBar"><button class="exitBtn" onpointerdown="pixPressSfx()" onclick="pixClickSfx();exitMission()" aria-label="' + t("mainMenu") + '">X</button></div>';
}

// Leaves the current mission the same way its own MAIN MENU button does
// (clears its saved game and stops any timers), then shows the Main Menu.
function exitMission(){
  switch(state.screen){
    case "faithFlash": ffQuit(); break;
    case "faithMatch": fmQuit(); break;
    case "chooseJoy": cjQuit(); break;
    case "followLight": flQuit(); break;
    case "wordUnscramble": wuQuit(); break;
    case "catchLight": clQuit(); break;
    case "kindnessSort": ksQuit(); break;
    case "hiddenBlessings": hbQuit(); break;
    case "lightCandle": lcQuit(); break;
    case "emojiStories": ebQuit(); break;
    case "jesusTimeline": tlQuit(); break;
    case "sacredSudoku": sdQuit(); break;
    case "stainedGlass": pzQuit(); break;
    default: go("mainMenu");
  }
}

function render(){
  var app = document.getElementById("app");
  var html;
  switch(state.screen){
    case "language": html = screenLanguage(); break;
    case "welcome": html = screenWelcome(); break;
    case "mainMenu": html = screenMainMenu(); break;
    case "award": html = screenAward(); break;
    case "missionIntro": html = screenMissionIntro(); break;
    case "faithFlash": html = screenFaithFlash(); break;
    case "faithMatch": html = screenFaithMatch(); break;
    case "beTheLight": html = screenBeTheLight(); break;
    case "stainedGlass": html = screenStainedGlass(); break;
    case "chooseJoy": html = screenChooseJoy(); break;
    case "joyousPhoto": html = screenJoyousPhoto(); break;
    case "followLight": html = screenFollowLight(); break;
    case "wordUnscramble": html = screenWordUnscramble(); break;
    case "catchLight": html = screenCatchLight(); break;
    case "kindnessSort": html = screenKindnessSort(); break;
    case "hiddenBlessings": html = screenHiddenBlessings(); break;
    case "lightCandle": html = screenLightCandle(); break;
    case "emojiStories": html = screenEmojiStories(); break;
    case "jesusTimeline": html = screenJesusTimeline(); break;
    case "sacredSudoku": html = screenSacredSudoku(); break;
    case "passport": html = screenPassport(); break;
    case "options": html = screenOptions(); break;
    case "goldenTicket": html = screenGoldenTicket(); break;
    default: html = screenLanguage();
  }
  var isNewScreen = state.screen !== lastRenderedScreen;
  var enteringPassportFresh = state.screen === "passport" && isNewScreen;
  lastRenderedScreen = state.screen;
  var wasSky = !!app.querySelector(".screen.pixSky");     // the screen being replaced was a sky screen
  app.innerHTML = exitBarHtml() + html;
  if(isNewScreen){
    var el = app.querySelector(".screen");
    // No fade between two sky screens (2026-10-22, per Dan): the fade starts from see-through, which showed the dark purple page behind it as a
    // black flash between START MISSION and the game. Screens with other backgrounds still fade in.
    if(el && !(wasSky && el.classList.contains("pixSky"))) el.classList.add("screen-enter");
  }
  if(state.screen === "mainMenu"){ pilgrimInit(isNewScreen); pixMusicStart(); }   // the music starts the first time the Main Menu is shown
  if(state.screen === "passport"){
    var track = document.getElementById("passportTrack");
    if(track){
      var realSlot = state.passportPage + 1; // slot 0 is the phantom clone of the last page
      if(enteringPassportFresh){
        // First time opening the Passport this visit — snap straight to the
        // target page, no slide-in from whatever page was open last time.
        lastTrackSlot = realSlot;
        track.style.transition = "none";
        track.style.transform = "translateX(-" + (lastTrackSlot*100/PASSPORT_TRACK_SLOTS) + "%)";
      } else if(state.passportWrapDelta){
        // Wrapping (last page -> first, or first -> last): slide through the
        // phantom clone sitting just past the real end in the swiped
        // direction — visually identical to the real target page — then,
        // once the transition finishes, silently (no transition) snap the
        // track to the REAL page's own slot. Undetectable to the eye since
        // the phantom and the real page render identical content; avoids
        // both an instant snap (what Dan reported — no visible scroll at
        // all) and a long backward scroll across every page in between.
        var phantomSlot = state.passportWrapDelta > 0 ? PASSPORT_TRACK_SLOTS-1 : 0;
        track.style.transition = "none";
        track.style.transform = "translateX(-" + (lastTrackSlot*100/PASSPORT_TRACK_SLOTS) + "%)";
        void track.offsetWidth; // force reflow so the transition below actually starts from here
        requestAnimationFrame(function(){
          track.style.transition = "transform .32s ease";
          track.style.transform = "translateX(-" + (phantomSlot*100/PASSPORT_TRACK_SLOTS) + "%)";
        });
        lastTrackSlot = realSlot;
        setTimeout(function(){
          if(!track.isConnected) return; // the user already navigated away/re-rendered — nothing to fix up
          track.style.transition = "none";
          track.style.transform = "translateX(-" + (realSlot*100/PASSPORT_TRACK_SLOTS) + "%)";
        }, 340);
      } else {
        // Start the freshly-inserted track at the PREVIOUS page (no
        // transition yet, so this is invisible), then animate to the new
        // page on the next frame — full DOM replacement on every render
        // means a transform set once at insertion never animates on its own.
        track.style.transition = "none";
        track.style.transform = "translateX(-" + (lastTrackSlot*100/PASSPORT_TRACK_SLOTS) + "%)";
        void track.offsetWidth; // force reflow so the transition below actually starts from here
        requestAnimationFrame(function(){
          track.style.transition = "transform .32s ease";
          track.style.transform = "translateX(-" + (realSlot*100/PASSPORT_TRACK_SLOTS) + "%)";
        });
        lastTrackSlot = realSlot;
      }
    }
  }
  // Catch the Light runs its falling-icon animation via direct DOM writes
  // (see clStart()), not through this render() pipeline, so a mid-round
  // re-render never wipes out in-flight icons. The one case that DOES need
  // to (re)start the loop from here is a genuine page reload landing back on
  // this screen mid-round (e.g. the tab was discarded under memory pressure)
  // — clRunning is a fresh `false` in that case since it's a brand-new script
  // instance, so this picks the round back up (with whatever score/misses/
  // time was last saved) instead of leaving the stage empty and frozen.
  if(state.screen === "faithMatch" && state.session.faithMatch && (state.session.faithMatch.levelDone || state.session.faithMatch.celebrate) && !fmCelebrating) fmCelebrate();
  if(state.screen === "faithFlash" && state.session.faithFlash && state.session.faithFlash.interlude && !ffInterludeRunning) ffInterlude();
  if(state.screen === "faithMatch" && state.session.faithMatch && state.session.faithMatch.interlude && !pixRoundRunning.faithMatch) fmInterlude();
  if(state.screen === "followLight" && state.session.followLight && state.session.followLight.interlude && !pixRoundRunning.followLight) flInterlude();
  if(state.screen === "stainedGlass" && state.session.stainedGlass && state.session.stainedGlass.interlude && !pixRoundRunning.stainedGlass) pzInterlude();
  if(state.screen === "wordUnscramble" && state.session.wordUnscramble && state.session.wordUnscramble.interlude && !pixRoundRunning.wordUnscramble) wuInterlude();
  if(state.screen === "catchLight" && state.session.catchLight && state.session.catchLight.interlude && !pixRoundRunning.catchLight) clInterlude();
  if(state.screen === "stainedGlass" && state.session.stainedGlass) pzFit();
  if(state.screen === "lightCandle") lcPaint();
  if(state.screen === "sacredSudoku" && state.session.sacredSudoku && state.session.sacredSudoku.done && !sdCelebrating) sdCelebrate();
  var clSession = state.session.catchLight;
  if(state.screen === "catchLight" && clSession && clSession.status === "playing"){
    if(clSession.phase === "ready") clSession.phase = "playing";     // a game saved while the old GET READY screen was up just starts
    if(clSession.phase === "playing" && !clRunning && !clSession.interlude) clStart();
  }
}

document.getElementById("cameraInput").addEventListener("change", handlePhotoCapture);
window.addEventListener("pagehide", saveState);
window.addEventListener("visibilitychange", saveState);

render();
// Kicked off at boot, not when Faith Match is opened (2026-09-29, per Dan —
// the first tile tapped showed blank white until its image finished
// loading). Starting the fetch this early gives it the whole language
// select -> welcome -> main menu detour most players take before ever
// reaching Faith Match to finish in the background; openMission('faithMatch')
// still calls this too, but preloadMatchTiles() is idempotent
// (matchTilesPreloaded guards it) so that call is now just a harmless no-op
// safety net for the rare case someone reaches it before this finishes.
preloadMatchTiles();
// The badge pictures are fetched at boot too (2026-10-22, per Dan): the badge on a results screen showed a beat late, with a blank space where it goes.
var badgePreload = MISSIONS.map(function(m){ var img = new Image(); img.src = badge8Src(m); return img; });
</script>
