      inner += '<button class="' + cls + '" data-sfx="own"' + (v ? ' style="background-image:url(' + sdPicUrl(lv, v) + ')"' : '') + (fixed ? '' : ' onclick="sdSelect(' + i + ')"') + '></button>';
    }
    boxesHtml += '<div class="sdBox" style="grid-template-columns:repeat(' + lc + ',1fr)">' + inner + '</div>';
  }
  var palHtml = "";
  for(var k = 1; k <= n; k++) palHtml += '<button class="sdPick" data-sfx="own" style="background-image:url(' + sdPicUrl(lv, k) + ')" onclick="sdPlace(' + k + ')"></button>';
  palHtml += '<button class="sdPick sdErase" data-sfx="own" onclick="sdPlace(0)" aria-label="' + t("sd_erase") + '">&#10005;</button>';
  var won = s.busy;

  return '<div class="screen pixHome pixSky pixMission pixLower' + (n >= 9 ? ' sdBig' : '') + '">' + cloudsHtml() +
    '<h2 class="pixMTitle">' + t("sudokuName") + '</h2>' +
    '<div class="pixNote sdIntro">' + t(boxed ? "sd_intro" : "sd_intro2") + '</div>' +
    '<div class="wuBar">' +
      '<button class="sdHint skip"' + (won ? ' disabled' : '') + ' onclick="sdClearAll()">' + t("clearWord") + '</button>' +
      '<span class="pixNote">' + t("fm_level")(s.level + 1, s.levels.length) + '</span>' +
      '<button class="sdHint" data-sfx="own"' + (s.hints > 0 && !won ? '' : ' disabled') + ' onclick="sdHint()">' + t("sd_hint")(s.hints) + '</button></div>' +
    '<div class="sdBoard" style="grid-template-columns:repeat(' + (n / lc) + ',1fr)">' + boxesHtml + '</div>' +
    '<div class="sdPal' + (n >= 9 ? ' two' : '') + '">' + palHtml + '</div>' +
    '<div class="spacer"></div>' +
  '</div>';
}

/* ---------- Word Trail ---------- */

// Word Trail (2026-10-23, per Dan): a grid of letters (8 x 8 to start) with hidden words in it. Every letter of a word touches the next one above,
// below or beside it (no diagonals). The player touches a letter and drags to the next, and so on; on lifting the finger, a trail that spells a word
// from the list at the bottom finds it: the word leaves the list and the letters it used are replaced with new ones. Find every word to finish the
// round. It cannot be failed (no chances). Three rounds (2026-10-23, per Dan): 6 x 6 with 4-letter words, 7 x 7 with 5-letter words, 8 x 8 with
// 6-letter words, the words coming from the Word Scramble pool of that level. Between rounds the same ROUND COMPLETED! message as the other games.
var WT_ROUNDS = [{size: 6, level: 0}, {size: 7, level: 1}, {size: 8, level: 2}];
var WT_WORDS = 5;                 // words hidden in a round
var WT_SIZE = 8;                  // the size of the round on screen (set by wtUse, which every function that needs it is given after)
function wtUse(s){ if(s && s.size) WT_SIZE = s.size; }
var WT_FILLER = {
  en: "EEEEEEEEAAAAAAAIIIIIIOOOOOUUNNNNNRRRRRTTTTTLLLLSSSSDDDGGBBCCMMPPFFHHVWYK",
  es: "AAAAAAAAEEEEEEEOOOOOOIIIIIUUSSSSRRRRNNNNDDDLLLCCCTTTMMPPBBGVHQFZJ"
};
function wtLetter(not){
  var pool = WT_FILLER[state.lang || "en"], ch;
  do { ch = pool.charAt(Math.floor(Math.random() * pool.length)); } while(ch === not);
  return ch;
}
// Only the squares directly above, below, left and right (no diagonals: 2026-10-23, per Dan).
function wtNeighbors(i){
  var r = Math.floor(i / WT_SIZE), c = i % WT_SIZE, out = [];
  if(r > 0) out.push(i - WT_SIZE);
  if(r < WT_SIZE - 1) out.push(i + WT_SIZE);
  if(c > 0) out.push(i - 1);
  if(c < WT_SIZE - 1) out.push(i + 1);
  return out;
}
// a random trail of `len` squares that never visits a square twice and keeps off the squares in `used`; null if none was found
function wtRandomPath(len, used){
  var n = WT_SIZE * WT_SIZE;
  for(var attempt = 0; attempt < 60; attempt++){
    var start = Math.floor(Math.random() * n);
    if(used[start]) continue;
    var path = [start], seen = {}; seen[start] = 1;
    while(path.length < len){
      var opts = wtNeighbors(path[path.length - 1]).filter(function(c){ return !used[c] && !seen[c]; });
      if(!opts.length) break;
      var c = opts[Math.floor(Math.random() * opts.length)]; path.push(c); seen[c] = 1;
    }
    if(path.length === len) return path;
  }
  return null;
}
// the words' trails, none touching another's squares: [{w, cells}], or null if they did not fit
function wtPlace(words){
  var used = {}, out = [];
  for(var i = 0; i < words.length; i++){
    var path = wtRandomPath(words[i].length, used);
    if(!path) return null;
    path.forEach(function(c){ used[c] = 1; });
    out.push({w: words[i], cells: path});
  }
  return out;
}
// is the word spelled anywhere on the grid (any trail, not only the one it was hidden along)?
function wtFindPath(grid, word){
  function walk(cell, k, seen){
    if(grid[cell] !== word.charAt(k)) return false;
    if(k === word.length - 1) return true;
    seen[cell] = 1;
    var nb = wtNeighbors(cell);
    for(var j = 0; j < nb.length; j++) if(!seen[nb[j]] && walk(nb[j], k + 1, seen)){ seen[cell] = 0; return true; }
    seen[cell] = 0;
    return false;
  }
  for(var i = 0; i < grid.length; i++) if(walk(i, 0, {})) return true;
  return false;
}
// one round: a fresh grid of that round's size, with WT_WORDS words from the Word Scramble pool of that level hidden in it
function wtNewRound(round){
  var cfg = WT_ROUNDS[round];
  WT_SIZE = cfg.size;
  var pool = WORD_UNSCRAMBLE_WORDS[state.lang || "en"][cfg.level], hidden = null;
  for(var tries = 0; tries < 60 && !hidden; tries++) hidden = wtPlace(shuffle(pool).slice(0, WT_WORDS));
  var grid = [];
  for(var i = 0; i < WT_SIZE * WT_SIZE; i++) grid.push(wtLetter());
  hidden.forEach(function(h){ h.cells.forEach(function(c, k){ grid[c] = h.w.charAt(k); }); });
  return {v: 3, round: round, size: cfg.size, grid: grid, hidden: hidden, remaining: hidden.map(function(h){ return h.w; }), busy: false, status: "playing", interlude: null};     // v 3 = three rounds
}
function initWordTrail(){
  state.session.wordTrail = wtNewRound(0);
  saveState();
}
// ROUND X COMPLETED! between the rounds, and after the last one before the Mission Completed screen (the same as the other games)
function wtInterlude(){
  pixRoundRun("wordTrail", function(){ return state.session.wordTrail; }, null, function(s2){
    if(s2.interlude.final){ s2.interlude = null; wtCollectAward(); return; }
    state.session.wordTrail = wtNewRound(s2.round + 1);
    saveState(); render();
  });
}
// A word was found: its squares get new letters. Replacing them could also have taken apart another hidden word (the trail the player traced may
// have crossed it), so every word still in the list is checked, and one that is gone is hidden again somewhere else.
function wtRefill(s, cells, word){
  cells.forEach(function(c){ s.grid[c] = wtLetter(s.grid[c]); });
  s.hidden = s.hidden.filter(function(h){ return h.w !== word; });
  for(var pass = 0; pass < 6; pass++){
    var again = false;
    s.hidden.forEach(function(h){
      if(wtFindPath(s.grid, h.w)) return;
      var used = {};
      s.hidden.forEach(function(o){ if(o !== h) o.cells.forEach(function(c){ used[c] = 1; }); });
      var path = wtRandomPath(h.w.length, used);
      if(!path) return;
      h.cells = path; path.forEach(function(c, k){ s.grid[c] = h.w.charAt(k); });
      again = true;                                          // writing these letters may have broken another word, so look once more
    });
    if(!again) break;
  }
  // (a crowded small grid might still have lost one: then all the words left are hidden afresh)
  if(!s.hidden.every(function(h){ return wtFindPath(s.grid, h.w); })){
    for(var tries = 0; tries < 40; tries++){
      var again2 = wtPlace(s.hidden.map(function(h){ return h.w; }));
      if(!again2) continue;
      s.hidden = again2; again2.forEach(function(h){ h.cells.forEach(function(c, k){ s.grid[c] = h.w.charAt(k); }); });
      break;
    }
  }
}

var wtDrag = null;      // the trail being drawn: {path:[squares], x, y}
// where every square really is on the screen, measured from the page itself (not worked out by dividing the grid), so the touch and the line
// always agree with the letters that are drawn
function wtRects(){
  var out = [];
  for(var i = 0; i < WT_SIZE * WT_SIZE; i++){
    var el = document.getElementById("wtC" + i); if(!el){ out.push(null); continue; }
    var r = (el.firstChild || el).getBoundingClientRect(); out.push({l: r.left, t: r.top, w: r.width, h: r.height});     // the drawn tile itself, so the line meets its middle exactly
  }
  return out;
}
function wtCellAt(x, y, anywhere){
  var rects = (wtDrag && wtDrag.rects) || wtRects();
  for(var i = 0; i < rects.length; i++){
    var q = rects[i]; if(!q) continue;
    if(x < q.l || x >= q.l + q.w || y < q.t || y >= q.t + q.h) continue;
    // a square is joined only when the finger is near its middle
    if(!anywhere && (Math.abs(x - q.l - q.w / 2) > q.w * .36 || Math.abs(y - q.t - q.h / 2) > q.h * .36)) return -1;
    return i;
  }
  return -1;
}
function wtPaint(mark){      // mark = "ok" or "bad" colours the trail for a moment
  var s = state.session.wordTrail; if(!s || !wtDrag) return;
  for(var i = 0; i < WT_SIZE * WT_SIZE; i++){
    var el = document.getElementById("wtC" + i); if(!el) continue;
    var on = wtDrag.path.indexOf(i) !== -1;
    el.classList.toggle("sel", on && !mark); el.classList.toggle("ok", on && mark === "ok"); el.classList.toggle("bad", on && mark === "bad");
  }
  // the line goes through the middle of every letter's tile: its points are the tiles' own centres, in the grid's own pixels
  var g = document.getElementById("wtGrid"), svg = document.getElementById("wtSvg"), poly = document.getElementById("wtPoly");
  if(g && svg && poly && wtDrag.rects){
    var gr = g.getBoundingClientRect();
    svg.setAttribute("viewBox", "0 0 " + gr.width + " " + gr.height);
    poly.setAttribute("stroke-width", Math.max(3, gr.width / WT_SIZE * .2));
    poly.setAttribute("points", wtDrag.path.map(function(i){ var q = wtDrag.rects[i]; return (q.l + q.w / 2 - gr.left) + "," + (q.t + q.h / 2 - gr.top); }).join(" "));
  }
  var tr = document.getElementById("wtTrace");
  if(tr) tr.textContent = wtDrag.path.map(function(i){ return s.grid[i]; }).join("") || " ";
}
function wtAdd(c){
  wtDrag.path.push(c);
  pixSfxPlay("fmFirst", true);
  wtPaint();
}
function wtDown(ev){
  var s = state.session.wordTrail;
  if(!s || s.status !== "playing" || s.busy || wtDrag) return;
  ev.preventDefault();
  if(pixAudioStale) pixReviveOnTap();
  var c = wtCellAt(ev.clientX, ev.clientY, true); if(c < 0) return;
  try { document.getElementById("wtGrid").setPointerCapture(ev.pointerId); } catch(e){}
  wtDrag = {path: [], x: ev.clientX, y: ev.clientY, rects: wtRects()};
  wtAdd(c);
}
function wtProbe(x, y){
  var c = wtCellAt(x, y); if(c < 0) return;
  var p = wtDrag.path, last = p[p.length - 1];
  if(c === last) return;
  if(p.length >= 2 && c === p[p.length - 2]){ p.pop(); wtPaint(); return; }           // back over the last square: take it off again
  if(p.indexOf(c) !== -1 || wtNeighbors(last).indexOf(c) === -1) return;
  wtAdd(c);
}
function wtMove(ev){
  if(!wtDrag) return;
  var g = document.getElementById("wtGrid"); if(!g) return;
  var pitch = wtDrag.rects[0] ? wtDrag.rects[0].w : g.getBoundingClientRect().width / WT_SIZE;
  var dx = ev.clientX - wtDrag.x, dy = ev.clientY - wtDrag.y, steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / (pitch * .2)));
  for(var k = 1; k <= steps && wtDrag; k++) wtProbe(wtDrag.x + dx * k / steps, wtDrag.y + dy * k / steps);   // a fast finger does not skip squares
  if(wtDrag){ wtDrag.x = ev.clientX; wtDrag.y = ev.clientY; }
}
function wtCancel(){
  if(!wtDrag) return;
  wtDrag.path = []; wtPaint(); wtDrag = null;
}
function wtUp(){
  var s = state.session.wordTrail;
  if(!wtDrag || !s) { wtDrag = null; return; }
  var path = wtDrag.path.slice(), word = path.map(function(i){ return s.grid[i]; }).join("");
  if(s.remaining.indexOf(word) !== -1){
    s.busy = true;
    pixSfxPlay("fmMatch", true);
    wtPaint("ok");
    path.forEach(function(i){                                              // every letter of the word sparkles (2026-10-26, per Dan: the burst of Fruits of the Spirit)
      var q = wtDrag.rects && wtDrag.rects[i];
      if(q) pixBurst(Math.round(q.l + q.w / 2), Math.round(q.t + q.h / 2), .55, 14);
    });
    setTimeout(function(){
      wtDrag = null;
      var s2 = state.session.wordTrail;
      if(!s2 || s2 !== s || state.screen !== "wordTrail") return;
      s2.remaining.splice(s2.remaining.indexOf(word), 1);
      wtRefill(s2, path, word);
      s2.busy = false;
      if(!s2.remaining.length){
        // every word found: ROUND X COMPLETED! (after the last round it leads to the Mission Completed screen)
        s2.interlude = {n: s2.round + 1, phase: "msg", award: false, final: s2.round >= WT_ROUNDS.length - 1};
        saveState(); render();
      } else { saveState(); render(); }
    }, 450);
  } else if(path.length >= 3){
    pixSfxPlay("fmMiss", true);
    wtPaint("bad");
    setTimeout(function(){ if(wtDrag && wtDrag.path.join() === path.join()) wtCancel(); }, 260);
    wtDrag.path = path; wtDrag.done = true;
    return;
  } else wtCancel();
}
function wtCollectAward(){ state.session.wordTrail = null; wtDrag = null; grantMission("wordTrail"); }
function wtQuit(){ state.session.wordTrail = null; wtDrag = null; go("mainMenu"); }

function screenWordTrail(){
  var s = state.session.wordTrail;
  if(!s || s.v !== 3){ initWordTrail(); s = state.session.wordTrail; }          // a game saved by an earlier build (one grid, no rounds) starts over
  wtUse(s);
  if(s.interlude) return pixShell('<h2 class="pixMTitle">' + t("wordTrailName") + '</h2>' + pixRoundDoneHtml(s.interlude), "pixLower");
  var cells = s.grid.map(function(ch, i){ return '<div class="wtCell" id="wtC' + i + '"><i>' + ch + '</i></div>'; }).join("");
  var words = s.remaining.map(function(w){ return '<span class="wtWord">' + w + '</span>'; }).join("");
  return pixShell('<h2 class="pixMTitle">' + t("wordTrailName") + '</h2>' +
    '<div class="pixNote">' + t("wt_intro") + '</div>' +
    '<div class="pixNote">' + t("fm_level")(s.round + 1, WT_ROUNDS.length) + '</div>' +
    '<div class="wtTrace" id="wtTrace">&nbsp;</div>' +
    '<div class="wtGrid" id="wtGrid" style="--n:' + s.size + ';grid-template-columns:repeat(' + s.size + ',minmax(0,1fr))" onpointerdown="wtDown(event)" onpointermove="wtMove(event)" onpointerup="wtUp(event)" onpointercancel="wtCancel(event)" oncontextmenu="return false">' + cells +
      '<svg class="wtLine" id="wtSvg"><polyline id="wtPoly" points=""/></svg></div>' +
    '<div class="pixNote">' + t("wt_left")(s.remaining.length) + '</div>' +
    '<div class="wtWords">' + words + '</div>' +
    '<div class="spacer"></div>', "pixLower");
}

/* ---------- Word Groups ---------- */

// Word Groups (2026-10-23, per Dan): a board of words in rounded frames, n rows of n words, where each row's words belong to one group (Apostles,
// Prophets, ...). The player drags a word onto another to swap their places. When all the words in a row are from the same group, the row changes
// colour and locks: its words can no longer be picked up or swapped. Sort every row to finish the round. Three rounds (no chances): 4 x 4 = 16 words,
// 5 x 5 = 25 words, 6 x 6 = 36 words. maxLen is the longest word allowed in a round, so the words fit across the screen.
var WG_ROUNDS = [{n: 4, maxLen: 8}, {n: 5, maxLen: 7}, {n: 6, maxLen: 6}];
var WG_COLORS = ["#52C246", "#3A93E8", "#F2B632", "#E85A9B", "#9A5CC8", "#F58B2A"];     // the colour a locked row turns, by the order the groups were dealt
// The groups and their words, English and Spanish (drafts for the client to approve, like the Spanish elsewhere). No word is in two groups, and no
// word could reasonably belong to another group on the list. Every group has at least 6 words of 6 letters or fewer, so it can be used in any round.
var WG_GROUPS = [
  {en:{n:"Apostles", w:["PETER","ANDREW","JAMES","JOHN","PHILIP","THOMAS","SIMON","JUDE"]},
   es:{n:"Apóstoles", w:["PEDRO","ANDRÉS","JUAN","FELIPE","TOMÁS","SIMÓN","TADEO","MATEO"]}},
  {en:{n:"Prophets", w:["ISAIAH","ELIJAH","ELISHA","SAMUEL","DANIEL","AMOS","JONAH","MICAH","JOEL","HOSEA"]},
   es:{n:"Profetas", w:["ISAÍAS","ELÍAS","ELISEO","SAMUEL","DANIEL","AMÓS","JONÁS","JOEL","OSEAS"]}},
  {en:{n:"Men of Genesis", w:["NOAH","ADAM","ABEL","CAIN","ISAAC","JACOB","ESAU","LOT","ABRAHAM"]},
   es:{n:"Hombres del Génesis", w:["NOÉ","ADÁN","ABEL","CAÍN","ISAAC","JACOB","ESAÚ","LOT"]}},
  {en:{n:"Women of the Bible", w:["RUTH","ESTHER","MARY","MARTHA","EVE","SARAH","RACHEL","HANNAH","NAOMI","JUDITH","LEAH"]},
   es:{n:"Mujeres de la Biblia", w:["RUT","ESTER","MARÍA","MARTA","EVA","SARA","RAQUEL","ANA","NOEMÍ","JUDIT","LEA"]}},
  {en:{n:"Bible Places", w:["EGYPT","SINAI","JORDAN","EDEN","CANA","EMMAUS","BABEL","TABOR","ZION","GALILEE"]},
   es:{n:"Lugares de la Biblia", w:["EGIPTO","SINAÍ","JORDÁN","EDÉN","CANÁ","EMAÚS","BABEL","TABOR","SIÓN","BELÉN"]}},
  {en:{n:"In a Church", w:["ALTAR","PEW","FONT","BELL","ORGAN","CHOIR","CANDLE","CROSS"]},
   es:{n:"En la Iglesia", w:["ALTAR","BANCA","PILA","ÓRGANO","CORO","VELA","CRUZ","CAMPANA"]}},
  {en:{n:"Virtues", w:["HOPE","FAITH","MERCY","WISDOM","PEACE","JOY","TRUST","LOVE"]},
   es:{n:"Virtudes", w:["FE","AMOR","PAZ","GOZO","BONDAD","GRACIA","PIEDAD"]}},
  {en:{n:"Animals", w:["LION","LAMB","DOVE","SHEEP","DONKEY","RAVEN","CAMEL","WHALE","SNAKE"]},
   es:{n:"Animales", w:["LEÓN","PALOMA","OVEJA","BURRO","CUERVO","VÍBORA","PEZ","CAMELLO"]}},
  {en:{n:"Food and Drink", w:["BREAD","WINE","HONEY","OLIVE","GRAPES","FIGS","WHEAT","MANNA","MILK","OIL"]},
   es:{n:"Comida y Bebida", w:["PAN","VINO","MIEL","OLIVA","UVAS","HIGOS","TRIGO","MANÁ","LECHE","ACEITE"]}},
  {en:{n:"Saints", w:["CLARE","TERESA","AGNES","LUCY","MONICA","RITA","BRUNO","GEMMA"]},
   es:{n:"Santos", w:["CLARA","TERESA","INÉS","LUCÍA","MÓNICA","RITA","BRUNO","GEMA"]}}
];
// does any row hold only words of one group?
function wgRowDone(cells, n, r){
  var c = cells[r * n].c;
  for(var k = 1; k < n; k++) if(cells[r * n + k].c !== c) return false;
  return true;
}
function wgNewRound(round){
  var cfg = WG_ROUNDS[round], lang = state.lang || "en", n = cfg.n;
  function fits(g){ return g[lang].w.filter(function(w){ return w.length <= cfg.maxLen; }); }
  var groups = shuffle(WG_GROUPS.filter(function(g){ return fits(g).length >= n; })).slice(0, n), items = [], longest = 0;
  groups.forEach(function(g, gi){
    shuffle(fits(g)).slice(0, n).forEach(function(w){ items.push({w: w, c: gi}); longest = Math.max(longest, w.length); });
  });
  var cells, tries = 0, clash;
  do {
    cells = shuffle(items); clash = false;
    for(var r = 0; r < n; r++) if(wgRowDone(cells, n, r)) clash = true;          // never deal a row that is already right
  } while(clash && ++tries < 200);
  var locked = [], named = []; for(var i = 0; i < n; i++){ locked.push(null); named.push(false); }
  // named[r] = the group's name is showing above row r (the names appear one after another: see wgReveal)
  return {v: 1, round: round, n: n, names: groups.map(function(g){ return g[lang].n; }), longest: longest, cells: cells, locked: locked, named: named, interlude: null, introDone: false};
}
function initWordGroups(){
  state.session.wordGroups = wgNewRound(0);
  wgDrag = null;
  saveState();
}
function wgInterlude(){
  pixRoundRun("wordGroups", function(){ return state.session.wordGroups; }, null, function(s2){
    if(s2.interlude.final){ s2.interlude = null; wgCollectAward(); return; }
    state.session.wordGroups = wgNewRound(s2.round + 1);
    saveState(); render();
  });
}
function wgCollectAward(){ state.session.wordGroups = null; wgDrag = null; grantMission("wordGroups"); }
function wgQuit(){ state.session.wordGroups = null; wgDrag = null; go("mainMenu"); }

var wgDrag = null;      // the word being dragged: {from, rects, x, y, target}
function wgRects(s){
  var out = [];
  for(var i = 0; i < s.cells.length; i++){
    var el = document.getElementById("wgC" + i);
    if(!el){ out.push(null); continue; }
    var r = el.getBoundingClientRect(); out.push({l: r.left, t: r.top, w: r.width, h: r.height});
  }
  return out;
}
function wgCellAt(rects, x, y){
  for(var i = 0; i < rects.length; i++){
    var q = rects[i];
    if(q && x >= q.l && x < q.l + q.w && y >= q.t && y < q.t + q.h) return i;
  }
  return -1;
}
function wgMark(target){          // the frame the dragged word would swap with is lit
  var s = state.session.wordGroups; if(!s || !wgDrag) return;
  if(target === wgDrag.target) return;
  var old = document.getElementById("wgC" + wgDrag.target), el = document.getElementById("wgC" + target);
  if(old) old.classList.remove("target");
  if(el) el.classList.add("target");
  wgDrag.target = target;
}
// When a round starts, the words fill in one at a time in a random order, all within WG_INTRO_MS (2026-10-23, per Dan), with the Faith Match fanfare. The words
// cannot be touched until they are all in. wgIntro.done[i] says which frames have been filled (so a redraw during the fill keeps what has shown so far).
var WG_INTRO_MS = 2500, WG_INTRO_FIRST_MS = 120;
var wgIntro = null;
function wgIntroStart(){
  var s = state.session.wordGroups;
  if(!s || s.introDone !== false || s.interlude || state.screen !== "wordGroups") return;
  if(wgIntro && wgIntro.s === s) return;                              // already running for this round
  var total = s.cells.length, order = shuffle(s.cells.map(function(_, i){ return i; }));
  wgIntro = {s: s, done: {}, timers: []};
  var span = WG_INTRO_MS - WG_INTRO_FIRST_MS - 100;                    // the last word shows 100 ms before the 2.5 seconds are up
  order.forEach(function(cellIdx, k){
    var at = WG_INTRO_FIRST_MS + (total > 1 ? span * k / (total - 1) : 0);
    wgIntro.timers.push(setTimeout(function(){
      var live = wgIntro;
      if(!live || live.s !== s || state.session.wordGroups !== s || state.screen !== "wordGroups") return;
      live.done[cellIdx] = true;
      var el = document.getElementById("wgC" + cellIdx);
      if(el){ el.classList.remove("pending"); el.classList.add("popin"); }
      if(k === 0) pixSfxPlay("fmFanfare", false);                     // no sound per word any more: once, as the first word shows, the fanfare Faith Match plays when its tiles are all matched (2026-10-23, per Dan)
      if(k === total - 1){ s.introDone = true; saveState(); wgIntro = null; }
    }, at));
  });
}
function wgDown(ev){
  var s = state.session.wordGroups;
  if(!s || s.interlude || wgDrag || s.introDone === false) return;       // nothing to pick up until every word has filled in
  var rects = wgRects(s), i = wgCellAt(rects, ev.clientX, ev.clientY);
  if(i < 0 || s.locked[Math.floor(i / s.n)] !== null) return;                  // a locked row's words cannot be picked up
  ev.preventDefault();
  if(pixAudioStale) pixReviveOnTap();
  try { document.getElementById("wgBoard").setPointerCapture(ev.pointerId); } catch(e){}
  wgDrag = {from: i, rects: rects, x: ev.clientX, y: ev.clientY, target: -1};
  document.getElementById("wgC" + i).classList.add("drag");
  pixPressSfx("wgPick");    // sound_effect_4 when a word is picked up (2026-10-23, per Dan; it was the button sound for a while)
}
function wgMove(ev){
  var s = state.session.wordGroups;
  if(!wgDrag || !s) return;
  var el = document.getElementById("wgC" + wgDrag.from); if(!el) return;
  el.style.transform = "translate(" + (ev.clientX - wgDrag.x) + "px," + (ev.clientY - wgDrag.y) + "px) scale(1.08)";
  var t = wgCellAt(wgDrag.rects, ev.clientX, ev.clientY);
  if(t === wgDrag.from || t < 0 || s.locked[Math.floor(t / s.n)] !== null) t = -1;      // only an unlocked word can be swapped with
  wgMark(t);
}
function wgEnd(ev, cancel){
  var s = state.session.wordGroups;
  if(!wgDrag || !s){ wgDrag = null; return; }
  var d = wgDrag, el = document.getElementById("wgC" + d.from), target = cancel ? -1 : d.target;
  wgDrag = null;
  var tEl = document.getElementById("wgC" + d.target); if(tEl) tEl.classList.remove("target");
  if(target < 0){
    if(el){ el.classList.add("back"); el.style.transform = ""; setTimeout(function(){ el.classList.remove("back", "drag"); }, 180); }      // slides home
    return;
  }
  var a = s.cells[d.from]; s.cells[d.from] = s.cells[target]; s.cells[target] = a;       // the swap
  var found = [];
  for(var r = 0; r < s.n; r++) if(s.locked[r] === null && wgRowDone(s.cells, s.n, r)){ s.locked[r] = s.cells[r * s.n].c; found.push(s.locked[r]); }
  if(!found.length) pixSfxPlay("fmFirst", true);        // (a completed group's sound plays as its window appears: see wgReveal, so a second group in the same move has its own)
  saveState(); render();
  wgReveal();               // the names of the groups just completed
}
// The name of a completed group shows above its row (2026-10-23, per Dan). If one move completes two groups, the first name shows at once and the
// second a moment later. After the last name, a pause, and then ROUND X COMPLETED!. render() calls this too, so a reload in the middle carries on.
var WG_NAME_GAP_MS = 900, WG_AFTER_LAST_MS = 1400;
var wgRevealing = false, wgFinishing = false;
function wgReveal(){
  var s = state.session.wordGroups;
  if(!s || s.interlude || state.screen !== "wordGroups" || wgRevealing || wgFinishing) return;
  if(!s.named) s.named = s.locked.map(function(x){ return x !== null; });
  var r = -1;
  for(var i = 0; i < s.n; i++) if(s.locked[i] !== null && !s.named[i]){ r = i; break; }
  if(r < 0) return;
  if(wgDrag){ setTimeout(wgReveal, 250); return; }                  // a word is being dragged: the redraw waits until it is dropped
  s.named[r] = true; saveState();
  wgRevealing = true;                                                // (the redraw below calls wgReveal again: this makes it stand aside)
  render();
  var win = document.getElementById("wgG" + r); if(win) win.classList.add("pop");
  pixSfxPlay("fmMatch", true);                                       // the Category Completed sound, once for every group as its window appears (2026-10-23, per Dan)
  var more = false, all = true;
  for(var j = 0; j < s.n; j++){ if(s.locked[j] === null) all = false; else if(!s.named[j]) more = true; }
  if(more){ setTimeout(function(){ wgRevealing = false; wgReveal(); }, WG_NAME_GAP_MS); return; }
  wgRevealing = false;
  if(all){
    wgFinishing = true;
    setTimeout(function(){
      wgFinishing = false;
      var s2 = state.session.wordGroups;
      if(!s2 || s2 !== s || s2.interlude || state.screen !== "wordGroups") return;
      s2.interlude = {n: s2.round + 1, phase: "msg", award: false, final: s2.round >= WG_ROUNDS.length - 1};     // ROUND X COMPLETED!, as in the other games
      saveState(); render();
    }, WG_AFTER_LAST_MS);
  }
}
function wgUp(ev){ wgEnd(ev, false); }
function wgCancel(ev){ wgEnd(ev, true); }

function screenWordGroups(){
  var s = state.session.wordGroups;
  if(!s || s.v !== 1){ initWordGroups(); s = state.session.wordGroups; }
  if(s.interlude) return pixShell('<h2 class="pixMTitle">' + t("wordGroupsName") + '</h2>' + pixRoundDoneHtml(s.interlude), "pixLower");
  var n = s.n, rows = "";
  if(!s.named) s.named = s.locked.map(function(x){ return x !== null; });
  for(var r = 0; r < n; r++){
    var lk = s.locked[r], named = lk !== null && s.named[r], cells = "";
    for(var k = 0; k < n; k++){
      var i = r * n + k;
      // a row that is complete but whose name has not shown yet (two groups in one move) has its words in the group's colour until its window appears
      var pending = s.introDone === false && !(wgIntro && wgIntro.s === s && wgIntro.done[i]);        // a word that has not filled in yet shows as an empty frame
      cells += '<div class="wgCell' + (lk !== null && !named ? ' locked' : '') + (pending ? ' pending' : '') + '" id="wgC' + i + '"' + (lk !== null && !named ? ' style="background:' + WG_COLORS[lk] + '"' : '') + '><span>' + s.cells[i].w + '</span></div>';
    }
    // each row is a window: see-through until the group is complete and named, then in the group's own colour with its name above the words
    rows += '<div class="wgGroup' + (named ? ' done' : '') + '" id="wgG' + r + '"' + (named ? ' style="--gc:' + WG_COLORS[lk] + '"' : '') + '>' +
      '<div class="wgLabel">' + (named ? s.names[lk] : '&nbsp;') + '</div>' +
      '<div class="wgRow" style="grid-template-columns:repeat(' + n + ',minmax(0,1fr))">' + cells + '</div></div>';
  }
  var left = s.locked.filter(function(x){ return x === null; }).length;
  return pixShell('<h2 class="pixMTitle">' + t("wordGroupsName") + '</h2>' +
    '<div class="pixNote">' + t("wg_intro") + '</div>' +
    '<div class="pixNote">' + t("fm_level")(s.round + 1, WG_ROUNDS.length) + '</div>' +
    '<div class="wgBoard" id="wgBoard" style="--n:' + n + ';--m:' + Math.max(4, s.longest) + '" onpointerdown="wgDown(event)" onpointermove="wgMove(event)" onpointerup="wgUp(event)" onpointercancel="wgCancel(event)" oncontextmenu="return false">' + rows + '</div>' +
    '<div class="pixNote">' + t("wg_left")(left) + '</div>' +
    '<div class="spacer"></div>', "pixLower");
}

/* ---------- Mustard Seed ---------- */

// Mustard Seed (2026-10-23, per Dan): a drop-and-merge puzzle with plants. The plant to drop jumps from column to column above the grid, from the first to the last and back;
// DROP TILE lets it fall into the column it is over, and each round it jumps faster. It lands on top of that column's stack, and when it lands on a plant of the same stage the two
// grow into the next stage (1 seed, 2 sprout, 3 plant, 4 flowering bush, 5 tree, 6 great tree). The grown plant can then match the one below it, and so on, so one drop can chain.
// A plant that grows to the round's goal stage is picked (it glows for a moment, is counted and leaves its square); the round is complete when `need` of them have been picked.
// If any column is filled to the top the garden is full and it is TRY AGAIN (2026-10-23, per Dan: no more "a full column still takes a matching plant"). No chances, three rounds:
// R1 4 columns of 5, pick 3 flowering bushes; R2 5 columns of 6, pick 4 trees; R3 6 columns of 5, pick 5 trees. Slow plant in round 1. The numbers were set by playing 1500 games each
// with a player that looks one drop ahead (wins every time), one that does that but drops anywhere 1 time in 4 (wins about 99 %, 99 % and 90 %) and one that drops anywhere at random
// (wins 29 %, 1 % and 0 %). (It was swipe-to-slide, then tap-two-to-join; Dan found the first hard to understand and the second had no skill in it.)
// rate = how many columns the plant jumps along in a second.
var MS_ROUNDS = [{cols: 4, rows: 5, goal: 4, need: 3, w: [.4, .35, .25], rate: 2.5}, {cols: 5, rows: 6, goal: 5, need: 4, w: [.3, .3, .25, .15], rate: 4}, {cols: 6, rows: 5, goal: 5, need: 5, w: [.4, .3, .2, .1], rate: 5.5}];
var MS_TOP = 6;                                                          // the highest stage
function msNextStage(w){
  var total = w.reduce(function(x, y){ return x + y; }, 0), r = Math.random() * total, acc = 0;
  for(var i = 0; i < w.length; i++){ acc += w[i]; if(r < acc) return i + 1; }
  return 1;
}
function msNewRound(round){
  var cfg = MS_ROUNDS[round], cols = [];
  msPos = 0; msDir = 1; msAcc = 0; msPrevPos = 0; msMovedAt = 0;         // the plant above the grid starts over the first column
  for(var c = 0; c < cfg.cols; c++) cols.push([]);                       // each column is its plants from the bottom up
  return {v: 4, round: round, cols: cols, rows: cfg.rows, goal: cfg.goal, need: cfg.need, got: 0, goalKey: "", cur: msNextStage(cfg.w), merged: [], dropped: "", busy: false, status: "playing", interlude: null};
}
function initMustardSeed(){ state.session.mustardSeed = msNewRound(0); saveState(); }
// is any column filled to the top?
function msFull(cols, rows){
  for(var c = 0; c < cols.length; c++) if(cols[c].length >= rows) return true;
  return false;
}
// settles the merges (a plant that lands on one of the same stage, then the grown plant on the one below it, and so on) and stops at the first plant that grows to the goal stage,
// leaving it in its square: goalAt is where it is. Returns the new columns, how many merges happened and which squares grew.
function msSettle(cols, goal){
  var out = cols.map(function(col){ return col.slice(); }), merges = 0, goalAt = null, grown = {}, again = true, guard = 0;
  while(again && !goalAt && guard++ < 80){
    again = false;
    for(var x = 0; x < out.length && !again; x++){
      var col = out[x];
      for(var y = 1; y < col.length; y++){
        if(col[y] && col[y] < MS_TOP && col[y] === col[y - 1]){
          col[y - 1]++; col.splice(y, 1); merges++; again = true; grown[x + "," + (y - 1)] = 1; if(col[y - 1] >= goal) goalAt = [x, y - 1];
          break;
        }
      }
    }
  }
  return {cols: out, merges: merges, goalAt: goalAt, grown: Object.keys(grown)};
}
function msDropIn(cols, c, v, goal){
  var out = cols.map(function(col){ return col.slice(); });
  out[c].push(v);
  return msSettle(out, goal);
}
// The plant above the grid. msPos is the column it is over (0 = the first, cols - 1 = the last) and msDir which way it is going; every 1 / rate seconds it JUMPS to the next
// column, and it turns round at the first and the last. It lives outside the screen drawing, so a redraw never moves it. The column under it is lit.
var msPos = 0, msDir = 1, msRaf = 0, msLastT = 0, msAcc = 0, msPrevPos = 0, msMovedAt = 0;
var MS_SHOW_LAG = 40;                                                    // ms the screen is behind the game: what the player sees at a touch is where the plant was this long before
function msPlace(){
  var s = state.session.mustardSeed, mover = document.getElementById("msMover"), track = document.getElementById("msTrack");
  if(!s || !mover || !track) return;
  var n = s.cols.length, cw = mover.offsetWidth, step = cw + 5;
  mover.style.transform = "translateX(" + (11 + msPos * step) + "px)";
  var cols = document.querySelectorAll(".msCol");
  for(var i = 0; i < cols.length; i++) cols[i].classList.toggle("under", i === msPos);
}
function msLoop(now){
  var s = state.session.mustardSeed;
  if(state.screen !== "mustardSeed" || !s){ msRaf = 0; return; }
  var dt = Math.min(.1, (now - msLastT) / 1000); msLastT = now;
  var jumped = false;
  if(s.status === "playing" && !s.interlude && !s.busy){
    var n = s.cols.length, interval = 1 / MS_ROUNDS[s.round].rate;
    msAcc += dt;
    while(msAcc >= interval){
      msAcc -= interval;
      if(msPos + msDir > n - 1 || msPos + msDir < 0) msDir = -msDir;      // the end of the row: turn round
      msPrevPos = msPos; msPos += msDir; msMovedAt = now; jumped = true;
    }
  }
  msPlace();
  if(jumped){                                                             // the plant fades in over its new column, so a glimpse of it just before a tap is faint
    var mv = document.getElementById("msMover");
    if(mv && mv.animate) mv.animate([{opacity: .2}, {opacity: 1}], {duration: 90, easing: "ease-out"});
  }
  msRaf = requestAnimationFrame(msLoop);
}
function msLoopStart(){
  if(msRaf) return;
  msLastT = performance.now(); msRaf = requestAnimationFrame(msLoop);
}
// Everything has to fit on one screen, with no scrolling (2026-10-23, per Dan), so the size of a square comes from the real height of the screen: lay it out with tiny squares,
// see how much room is left under the button, and give that room to the (rows + 1) squares that stack up (the grid and the plant above it). The width also limits it.
function msFit(){
  var area = document.getElementById("msArea"), s = state.session.mustardSeed;
  if(!area || !s || s.interlude) return;
  var n = s.cols.length, rows = s.rows, TINY = 16;
  var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  var scr = area.closest(".screen"), pad = scr ? parseFloat(getComputedStyle(scr).paddingBottom) || 0 : 0;
  var bar = area.querySelector(".msBar"), board = area.querySelector(".msBoard");
  // (2026-10-24, per Dan: the DROP TILE button sits halfway between the bottom of the grid and the bottom of the screen.) What is under the grid at the least (the stage guide and
  // the button) has to fit above the button's own middle, so the room kept for it is twice that, less half the button.
  function solve(){
    area.style.setProperty("--cell", TINY + "px"); bar.style.marginTop = "";
    var boardBottom = board.getBoundingClientRect().bottom + (window.scrollY || 0), stack = bar.getBoundingClientRect().bottom + (window.scrollY || 0) - boardBottom;
    var byH = TINY + (vh - 6 - boardBottom - (2 * stack - bar.offsetHeight)) / (rows + 1);
    var byW = (Math.min(area.clientWidth, 380) - 22 - (n - 1) * 5) / n;
    return Math.floor(Math.min(byH, byW, 62));
  }
  area.classList.remove("noLegend");
  var cell = solve();
  if(cell < 34){ area.classList.add("noLegend"); cell = solve(); }          // a short screen: the stage guide goes so the squares can stay big enough
  area.style.setProperty("--cell", Math.max(18, cell) + "px");
  bar.style.marginTop = "";
  var bb = board.getBoundingClientRect().bottom, goal = bb + (vh - bb) / 2, mt = parseFloat(getComputedStyle(bar).marginTop) || 0;
  for(var pass = 0; pass < 3; pass++){                                       // (the button's margin collapses with the stage guide's, so the move is measured, not worked out)
    var br = bar.getBoundingClientRect(), extra = goal - (br.top + br.height / 2);      // how far the button's middle is above the middle of the room under the grid
    if(Math.abs(extra) < .5) break;
    mt = Math.max(0, mt + extra); bar.style.marginTop = mt + "px";
  }
  msPlace();
}
window.addEventListener("resize", function(){ if(state.screen === "mustardSeed") msFit(); });

function msDrop(c){

/* ---------- Pray the Beads ---------- */

// Pray the Beads (2026-10-23, per Dan; the screen was mocked up first): a rhythm game. Rosary beads glide down a curving string toward a gold ring, and the player taps TAP
// (or the stage) when a bead is in the ring. Every round is a large gold bead (Our Father) and then 20 beads (Hail Mary), a steady beat apart, and each round the beat is quicker.
// (Changed 2026-10-23, per Dan: the beads are spaced so that only one can be in the ring at a time, the ring is only a little larger than a bead, a tap counts when the bead is in
// the ring with a little room above and below it, there are 20 beads, they move faster and there are 3 chances, not 5. Then, 2026-10-24: the distance from one bead to the next is random
// (and then more so: .8 to 2.2 times the usual) and the three rounds have 20, 30 and 40 beads and go much faster one after the other.) A tap that is too early, or a bead that gets by untouched,
// costs a chance. ROUND X COMPLETED! after each round, with the lost chances all given back after rounds 1 and 2 (2026-10-25, per Dan), so every round starts with 3.
// Changed again 2026-10-24, per Dan: only the TAP button counts a tap (not the stage); some beads come close together, in bursts of 2 to 4, to be tapped quickly one after the other; and
// a bead tapped in time rings the bell of Follow the Light on a random note of G (round 1), D (round 2) or C (round 3).
// All of it runs on the clock: bead i reaches the ring at s.at[i] ms after the round starts (made when the round begins), and where a bead is drawn depends only on the time, so a redraw (which
// happens at every tap) never moves anything. The tap is judged from the moment the finger touched (pixDownT), less the little the screen is behind the game. How far from the
// ring's centre a bead may be (as a fraction of the width of the stage) is turned into milliseconds from how fast the beads are going.
var PB_CHANCES = 3;
// (2026-10-24, per Dan: the speed doubles each round, so the beads move 2 and then 4 times as fast as in round 1. gap = ms for a bead to travel the usual distance to the next one, which
// is how far apart they are drawn, so it halves each round. Taps would then come too fast to make, so no two beads are less than PB_MIN_MS apart, and a tap counts for at least
// PB_MIN_WINDOW ms either side of the beat even when the ring is passed quicker than that.) beads = how many, after the large one.
// Spacing (2026-10-25, per Dan): round 1 is as it was (PB_APART and PB_BURST below); round 2 has its beads closer together, and more groups of close beads, and round 3 closer still. apart = how far
// from the last bead a bead comes, in usual gaps; burst = how often a bead is followed by a group of close ones, how many, and how close.
var PB_ROUNDS = [{gap: 600},      // (2026-10-25, per Dan: round 1 faster, was 700, and round 3 slower, was 380; round 2 as it was)
  {gap: 540, apart: [.95, 1.9], burst: {chance: .4, count: [1, 3], apart: [.6, .85]}},      // (later the same day, per Dan: more distance again; round 3 had been too hard)
  {gap: 450, apart: [.85, 1.6], burst: {chance: .5, count: [1, 3], apart: [.6, .8]}}];      // (2026-10-25, per Dan: round 1 a little faster, was 760; then round 3 got round 2's old speed (380), round 2 a speed halfway between rounds 1 and 3 (540), and every round 20 more beads: 40 / 50 / 60)
var PB_MIN_MS = {normal: 300, burst: 220};
var PB_MIN_WINDOW = {good: 110, perfect: 55};
var PB_FIRST_MS = 1500;                                                    // the first bead is never sooner than this after the round starts
var PB_APART = [.9, 2.2];
var PB_BURST = {chance: .35, count: [1, 3], apart: [.55, .8]};            // now and then a bead is followed by 1 to 3 close ones (2026-10-24, per Dan), to be tapped quickly one after the other                                                // the distance from one bead to the next is random, this many times the usual one (never closer than one bead at a time in the ring)
var PB_FIRST = 2;                                                          // the first bead reaches the ring this many usual gaps after the round starts
var PB_TRAVEL = 4;                                                         // the beads are this many gaps apart along the string's length: with the ring only a little bigger than a bead, one at a time is in it
var PB_RING = .15;                                                         // the ring's width, and a bead is .12, as fractions of the stage's width
var PB_ROOM = .02;                                                         // the room above and below the ring in which a tap still counts
var PB_PERFECT_ZONE = .045;                                                // a bead this near the middle of the ring is Perfect
var PB_SHOW_LAG = 40, PB_START_WAIT = 800;
var PB_GRACE = 60;                                                         // ms a bead is not yet counted as missed after its window, for a tap that is still on its way to the game
var pbWaiting = true;                                                        // a round does not start until the player taps the screen (2026-10-25, per Dan), as in Dove of Peace
var pbStartAt = 0, pbRaf = 0, pbLastT = 0, pbBound = null, pbBoundRound = -1, pbLastTapAt = 0;
// the string: a curve from the top of the stage down to the cross (all in % of the stage), measured so that beads a steady time apart are an even distance apart
var PB_PATH = (function(){
  var P = [[60, -6], [82, 20], [28, 44], [50, 72]], pts = [], len = [0], N = 160;
  for(var i = 0; i <= N; i++){
    var u = i / N, v = 1 - u;
    var x = v * v * v * P[0][0] + 3 * v * v * u * P[1][0] + 3 * v * u * u * P[2][0] + u * u * u * P[3][0];
    var y = v * v * v * P[0][1] + 3 * v * v * u * P[1][1] + 3 * v * u * u * P[2][1] + u * u * u * P[3][1];
    pts.push([x, y]);
    if(i) len.push(len[i - 1] + Math.sqrt(Math.pow(x - pts[i - 1][0], 2) + Math.pow((y - pts[i - 1][1]) * 1.3, 2)));      // the stage is taller than it is wide
  }

})();

function pbPoint(u){

function pbArrive(s, i){ return s.at[i]; }
// (2026-10-25, per Dan) every round is one whole rosary, in the order of a real one, from the first large bead above the cross, up, and clockwise round to the last small bead: 60 beads.
//   large (Our Father), 3 small (Hail Marys), large, the centrepiece (a large bead here), then five decades: 10 small, large, 10 small, large, 10 small, large, 10 small, large, 10 small.
// 7 large and 53 small. PB_LARGE[i] says whether bead i is a large one (drawn with the large gold bead).
var PB_LARGE = (function(){
  var a = [], i;
  function add(n, large){ for(var k = 0; k < n; k++) a.push(large); }
  add(1, true); add(3, false); add(1, true); add(1, true);
  for(i = 0; i < 5; i++){ add(10, false); if(i < 4) add(1, true); }
  return a;
})();
function pbCount(s){ return PB_LARGE.length; }
// how long before or after a bead's beat a tap still counts (good) and is Perfect, from how fast the beads are going where they reach the ring
function pbWindows(s){
  var st = document.getElementById("pbStage"), w = st ? st.clientWidth : 340, h = st ? st.clientHeight : 320, gap = PB_ROUNDS[s.round].gap;
  var speed = (PB_PATH.total / 1.3 * h / 100) / (PB_TRAVEL * gap);          // px per ms, straight down at the ring
  return {good: Math.max((PB_RING / 2 + PB_ROOM) * w / speed, PB_MIN_WINDOW.good), perfect: Math.max(PB_PERFECT_ZONE * w / speed, PB_MIN_WINDOW.perfect)};
}
// A tapped bead sounds a chime (it was the bell of Follow the Light, then a chime on a random note of the round's key: 2026-10-24, per Dan). Now (2026-10-25, per Dan) the chimes play the tune of
// Schubert's Ave Maria (public domain), one note for each bead, in the order of the beads: the first 60 notes of the voice part (bars 3 to 9 of the Mutopia score, in B-flat major, without the
// small ornament notes and counting a tied note once) are PB_MELODY, as MIDI note numbers (Bb4 = 70, middle C = 60). The sound is still the same chime (pixChime, which sounds a freq two octaves up).
// A missed bead is a missing note: the bead keeps its place in the tune. The tune is moved into the round's key as before, G in round 1, D in round 2 and C in round 3 (PB_SHIFT, in half-steps
// down from B-flat major), which keeps it inside the range of the old notes.
var PB_MELODY = [70,69,70,74,72, 70,72,70,69,67,69, 70,74,74,72,70,69,67,74,76, 74,73,69,72,70,69,72,74,75,72,69, 70,74,72,72,69,67,71,74,77,74,71, 72,67,69,70,69,67,65,65, 72,72,72,71,72,74,72,74,70,70];
var PB_SHIFT = [-3, -8, -10];
function pbChime(s, i){
  var m = PB_MELODY[i];
  if(typeof m !== "number") return;
  pixChime(440 * Math.pow(2, (m + PB_SHIFT[Math.min(s.round, PB_SHIFT.length - 1)] - 69) / 12));
}
// (2026-10-24, per Dan: the TAP button sits halfway between the bottom of the play area and the bottom of the screen.) The button's margin is set by measuring where it is.
function pbFit(){
  var stage = document.getElementById("pbStage"), bar = document.querySelector(".pbBar");

  var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;

window.addEventListener("resize", function(){ if(state.screen === "prayBeads") pbFit(); });
// the music is OFF while the beads are moving (2026-10-25, per Dan), and comes back to its own volume when the last bead of the round has been dealt with (tapped, or missed), and at every
// other time too (waiting for the first tap, between rounds, game over, any other screen)
function pbDuckSync(){
  var s = state.session.prayBeads;
  var on = state.screen === "prayBeads" && s && s.status === "playing" && !s.interlude && !pbWaiting && !!s.res && s.res.indexOf(0) !== -1;
  pixSetMusicDuck(on ? 0 : 1);
}
function pbChancesLeft(s){ return typeof s.chances === "number" ? s.chances : PB_CHANCES; }
function pbBeginRound(s){
  var cfg = PB_ROUNDS[s.round], n = pbCount(s), ap = cfg.apart || PB_APART, bu = cfg.burst || PB_BURST;
  s.res = []; s.at = [];
  var burst = 0;
  for(var i = 0; i < n; i++){
    s.res.push(0);                                                         // 0 still to come, 1 Perfect, 2 Good, 3 missed
    var f, floor = PB_MIN_MS.normal;
    if(i === 0) f = 0;
    else if(burst > 0){ f = bu.apart[0] + Math.random() * (bu.apart[1] - bu.apart[0]); burst--; floor = PB_MIN_MS.burst; }
    else {
      f = ap[0] + Math.random() * (ap[1] - ap[0]);
      if(Math.random() < bu.chance) burst = bu.count[0] + Math.floor(Math.random() * (bu.count[1] - bu.count[0] + 1));
    }
    s.at.push(i === 0 ? Math.max(PB_FIRST * cfg.gap, PB_FIRST_MS) : s.at[i - 1] + Math.max(cfg.gap * f, floor));       // when it reaches the ring, ms after the start
  }

}
// the first tap on the screen starts the round: the beads begin to come after a short wait
function pbStart(){

document.addEventListener("pointerdown", function(e){          // any new touch while the message is up starts the round, whatever the layer does (as in Catch the Light and Jacob's Ladder)

function initPrayBeads(){

// draws every bead where the clock says it is
function pbPlace(){

  for(var i = 0; i < pbCount(s); i++){
    var el = document.getElementById("pbB" + i); if(!el) continue;
    var u = 1 - (pbArrive(s, i) - t) / (PB_TRAVEL * gap);
    if(u < -.03 || u > 1.14){ el.style.display = "none"; continue; }
    var p = pbPoint(u), sz = bw * (.55 + .45 * Math.min(1, Math.max(0, u))) * (PB_LARGE[i] ? 1.45 : 1);
    el.style.display = "block"; el.style.width = sz + "px"; el.style.height = sz + "px";
    el.style.left = p[0] + "%"; el.style.top = p[1] + "%";

function pbLoop(now){

  if(dt > 300) pbStartAt += dt;                                            // the screen was asleep or the page in the background: the round waits

    var gap = PB_ROUNDS[s.round].gap, t = now - PB_SHOW_LAG - pbStartAt, win = pbWindows(s);     // the same clock as the taps (pbTap), so a bead is never missed while a tap on it is still on its way

    }
    if(s.status === "playing" && !s.busy && !s.interlude && s.res.indexOf(0) === -1 && t > pbArrive(s, pbCount(s) - 1) + 800){
      s.interlude = {n: s.round + 1, phase: "msg", award: false, final: s.round >= PB_ROUNDS.length - 1};     // ROUND X COMPLETED!

function pbTap(){
  var s = state.session.prayBeads;

/* ---------- Pilgrim's Road ---------- */

// Pilgrim's Road (2026-10-24, per Dan; the screen was mocked up first): a path puzzle. The board is a square of tiles; the pilgrim stands on the left edge, the church on the right
// edge, and every tile between is a piece of road to turn (a tap turns it a quarter turn). Join the road from the pilgrim to the church. The road joined to the pilgrim so far
// turns gold. There are no chances, only a count of turns, and three rounds on 4 x 4, 5 x 5 and 6 x 6 boards (ROUND X COMPLETED! between them, no heart).
// Each board is made fresh. The road goes through EVERY tile of the board (2026-10-24, per Dan; before, it was a winding road with other tiles to leave out): one path that visits all
// the squares once, from the pilgrim's to the church's, so every tile is a straight or a bend, and then every tile is turned at random (and the board is turned again if that happens
// to solve it). Once the road is joined, the pilgrim walks along it to the church before ROUND X COMPLETED!. A tile's road is its svg, and turning it only turns the svg, so a tap does not redraw
// the screen. The pilgrim and the church are fixed tiles with road on one side only (towards the road's first and last tile).
var PR_ROUNDS = [{n: 4}, {n: 5}, {n: 6}];
var PR_BASE = {S: [0, 2], C: [0, 1], T: [0, 1, 2], E: [], P: [1], H: [3]};      // the sides of each kind of tile that have road: 0 up, 1 right, 2 down, 3 left (before it is turned)
var PR_DR = [-1, 0, 1, 0], PR_DC = [0, 1, 0, -1];
var PR_ARM = ['<rect x="33" y="0" width="34" height="67"/>', '<rect x="33" y="33" width="67" height="34"/>', '<rect x="33" y="33" width="34" height="67"/>', '<rect x="0" y="33" width="67" height="34"/>'];
function prSides(tile){
  var r = ((tile.rot % 4) + 4) % 4, out = [];
  PR_BASE[tile.t].forEach(function(d){ out.push((d + r) % 4); });
  return out;
}
// which tiles are joined to the pilgrim (by the road on both sides of each join), how many that is, and whether it reaches the church with every tile on the way (won)
function prReach(s){
  var n = s.n, seen = {}, queue = [[s.rs, 0]];
  seen[s.rs + "," + 0] = 1;
  while(queue.length){
    var cur = queue.shift(), sides = prSides(s.grid[cur[0]][cur[1]]);
    for(var i = 0; i < sides.length; i++){
      var d = sides[i], nr = cur[0] + PR_DR[d], nc = cur[1] + PR_DC[d];
      if(nr < 0 || nc < 0 || nr >= n || nc >= n || seen[nr + "," + nc]) continue;
      if(prSides(s.grid[nr][nc]).indexOf((d + 2) % 4) === -1) continue;
      seen[nr + "," + nc] = 1; queue.push([nr, nc]);
    }
  }
  var linked = !!seen[s.re + "," + (n - 1)], count = Object.keys(seen).length;
  return {seen: seen, linked: linked, count: count, won: linked && count === n * n};      // won = the road reaches the church AND goes through every tile
}
// one path through every square of the n x n board exactly once, from the pilgrim's square (rs, 0) to the church's (re, n - 1) (each of those two has road on one side only, towards
// the next square of the path, and cannot be turned). Found by a walk that tries the squares with the fewest ways on first (Warnsdorff's rule, with some
// chance in it), backing up when it is stuck; it is tried again from the start if that takes too long. null if none was found.
function prMakeHamilton(n, rs, re){
  var total = n * n;
  for(var attempt = 0; attempt < 300; attempt++){
    var seen = {}, path = [[rs, 0]], nodes = 0;
    seen[rs + ",0"] = 1;
    var ok = (function walk(){
      if(++nodes > 6000) return false;
      var cur = path[path.length - 1];
      if(path.length === total) return cur[0] === re && cur[1] === n - 1;
      var cand = [];
      for(var d = 0; d < 4; d++){
        var nr = cur[0] + PR_DR[d], nc = cur[1] + PR_DC[d];
        if(nr < 0 || nc < 0 || nr >= n || nc >= n || seen[nr + "," + nc]) continue;
        if(nr === re && nc === n - 1 && path.length !== total - 1) continue;          // the church is the last square
        var free = 0;
        for(var e = 0; e < 4; e++){
          var qr = nr + PR_DR[e], qc = nc + PR_DC[e];
          if(qr >= 0 && qc >= 0 && qr < n && qc < n && !seen[qr + "," + qc]) free++;
        }
        cand.push({r: nr, c: nc, k: free + Math.random() * 1.6});
      }
      cand.sort(function(x, y){ return x.k - y.k; });
      for(var i = 0; i < cand.length; i++){
        seen[cand[i].r + "," + cand[i].c] = 1; path.push([cand[i].r, cand[i].c]);
        if(walk()) return true;
        path.pop(); delete seen[cand[i].r + "," + cand[i].c];
      }
      return false;
    })();
    if(ok) return path;
  }
  return null;
}
function prDirTo(a, b){ for(var d = 0; d < 4; d++) if(a[0] + PR_DR[d] === b[0] && a[1] + PR_DC[d] === b[1]) return d; return -1; }
function prMakeBoard(s){
  var n = PR_ROUNDS[s.round].n, total = n * n, path = null, rs = 0, re = 0, tries = 0;
  while(!path && tries++ < 500){
    rs = Math.floor(Math.random() * n); re = Math.floor(Math.random() * n);
    // a path through every square needs its two ends on the right colours of the board (squares coloured like a chessboard): different ones if there is an even number of squares, both the
    // colour of the corners if odd
    var startColor = rs % 2, endColor = (re + n - 1) % 2;
    if(total % 2 === 0 ? startColor === endColor : (startColor !== 0 || endColor !== 0)) continue;
    path = prMakeHamilton(n, rs, re);
  }
  var grid = [];
  for(var r = 0; r < n; r++) grid.push(new Array(n));
  // the pilgrim's road leads to the second square of the path and the church's comes from the one before the last (the base of P is the right side, of H the left)
  grid[rs][0] = {t: "P", rot: (prDirTo(path[0], path[1]) + 3) % 4}; grid[re][n - 1] = {t: "H", rot: (prDirTo(path[total - 1], path[total - 2]) + 1) % 4};
  for(var i = 1; i < path.length - 1; i++){
    var a = prDirTo(path[i], path[i - 1]), b = prDirTo(path[i], path[i + 1]);
    var kindP = (a + 2) % 4 === b ? "S" : "C", sol = 0;
    for(var rot = 0; rot < 4; rot++){
      var sides = PR_BASE[kindP].map(function(d){ return (d + rot) % 4; });
      if(sides.indexOf(a) !== -1 && sides.indexOf(b) !== -1){ sol = rot; break; }
    }
    grid[path[i][0]][path[i][1]] = {t: kindP, rot: sol, path: true, sol: sol};      // sol = the way it was laid, kept so that a board can be checked to be solvable
  }
  s.n = n; s.rs = rs; s.re = re; s.grid = grid; s.turns = 0; s.busy = false; s.interlude = null;
  // turn the road tiles about at random until the board is not already solved
  var guard = 0;
  do {
    for(var r3 = 0; r3 < n; r3++) for(var c3 = 0; c3 < n; c3++){
      var tl = grid[r3][c3];
      if(tl.t === "P" || tl.t === "H") continue;
      tl.rot = (tl.sol % 4) + Math.floor(Math.random() * 4);
    }
  } while(prReach(s).won && guard++ < 50);
}
// the squares the road goes through, from the pilgrim to the church, following the road as it is turned
function prRoute(s){
  var n = s.n, r = s.rs, c = 0, pr = -1, pc = -1, route = [[r, c]], guard = 0;
  while(guard++ < n * n + 2){
    if(r === s.re && c === n - 1) break;
    var sides = prSides(s.grid[r][c]), moved = false;
    for(var i = 0; i < sides.length; i++){
      var d = sides[i], nr = r + PR_DR[d], nc = c + PR_DC[d];
      if(nr < 0 || nc < 0 || nr >= n || nc >= n || (nr === pr && nc === pc)) continue;
      if(prSides(s.grid[nr][nc]).indexOf((d + 2) % 4) === -1) continue;
      pr = r; pc = c; r = nr; c = nc; route.push([r, c]); moved = true;
      break;
    }
    if(!moved) break;
  }

}
// the reward: the pilgrim walks along the finished road, square by square, and goes in at the church door; done() runs a moment after
function prWalk(s, done){
  var board = document.getElementById("prBoard"), route = prRoute(s), first = document.getElementById("prT" + s.rs + "_0");
  if(!board || !first || route.length < 2){ done(); return; }
  var fig = first.querySelector(".prFigure"), size = first.offsetWidth * .38, step = Math.max(90, Math.min(200, Math.round(3000 / route.length)));
  function center(cell){ var el = document.getElementById("prT" + cell[0] + "_" + cell[1]); return {x: el.offsetLeft + el.offsetWidth / 2, y: el.offsetTop + el.offsetHeight / 2}; }
  var walker = document.createElement("div"); walker.className = "prWalker";
  walker.innerHTML = '<div class="pilgrimSprite"></div>';

  walker.style.left = (p0.x - size / 2) + "px"; walker.style.top = (p0.y - size * 15 / 22) + "px";
  walker.style.transition = "left " + step + "ms linear, top " + step + "ms linear, opacity .3s";
  board.appendChild(walker);
  if(fig) fig.style.visibility = "hidden";
  var k = 1;
  function next(){
    if(state.screen !== "pilgrimRoad" || state.session.pilgrimRoad !== s) return;
    var c = center(route[k]);
    walker.style.left = (c.x - size / 2) + "px"; walker.style.top = (c.y - size * 15 / 22) + "px";
    k++;
    if(k < route.length) setTimeout(next, step);
    else setTimeout(function(){                                            // at the church: in at the door
      if(state.screen !== "pilgrimRoad" || state.session.pilgrimRoad !== s) return;
      walker.style.opacity = "0"; pixSfxPlay("churchBell", false);       // the church bell as he goes in (2026-10-26, per Dan); the round message waits for it to finish
      setTimeout(function(){ pixAfterSfx("churchBell", done); }, 800);
    }, step + 100);
  }

}
function initPilgrimRoad(){
  var s = {v: 1, round: 0, interlude: null};
  prMakeBoard(s);
  state.session.pilgrimRoad = s;
  saveState();
}
// the svg of a tile's road, drawn with its sides as they are before the tile is turned: a darker edge under the lighter road
function prSvg(kind, rot){
  var sides = PR_BASE[kind], edge = "", fill = "";

  sides.forEach(function(d){ edge += PR_ARM[d]; fill += PR_ARM[d]; });
  return '<svg class="prRoad" viewBox="0 0 100 100" style="transform:rotate(' + rot * 90 + 'deg)"><g class="o" transform="translate(50 50) scale(1.22) translate(-50 -50)">' + edge + '</g><g class="f">' + fill + '</g></svg>';
}
function prTileHtml(s, r, c, reach){
  var tile = s.grid[r][c], key = r + "," + c, cls = "prTile g" + ((r * 3 + c * 5) % 4) + (reach.seen[key] ? " on" : "");
  if(tile.t === "P") return '<div class="' + cls + ' prFixed" id="prT' + r + '_' + c + '">' + prSvg("P", tile.rot) + '<div class="prFigure"><div class="pilgrimSprite"></div></div></div>';
  if(tile.t === "H") return '<div class="' + cls + ' prFixed' + (reach.won ? ' won' : '') + '" id="prT' + r + '_' + c + '">' + prSvg("H", tile.rot) + '<img class="prChurchImg" src="tiles/pr/church.png" alt=""></div>';
  if(tile.t === "E") return '<div class="' + cls + ' prFixed" id="prT' + r + '_' + c + '"></div>';

// the gold road, and the church lit up when it is reached, after a tile has been turned
function prStatus(s, reach){ return t("pr_road")(reach.count, s.n * s.n) + "   " + t("pr_turns")(s.turns); }
function prPaint(s){
  var reach = prReach(s);

    saveState();

function prInterlude(){

}
function prCollectAward(){ state.session.pilgrimRoad = null; grantMission("pilgrimRoad"); }
function prQuit(){ state.session.pilgrimRoad = null; go("mainMenu"); }
function screenPilgrimRoad(){
  var s = state.session.pilgrimRoad;

  if(s.interlude) return pixShell('<h2 class="pixMTitle">' + t("pilgrimRoadName") + '</h2>' + pixRoundDoneHtml(s.interlude), "pixLower");

/* ---------- Dove of Peace ---------- */

// Dove of Peace (2026-10-24, per Dan; the screen was mocked up first): a one-tap flapper. The dove flies to the right, carrying an olive branch, and a tap anywhere on the screen (2026-10-24,
// per Dan: there is no FLAP button) makes it flap upward; between taps it sinks. Pairs of dark storm clouds, one above and one below a gap, come in from the right and the dove has to fly through the gaps. Ten
// pairs make a round and a green path along the top shows how many are behind it. Hitting a cloud (or the ground) costs one of 5 hearts: the dove is put back in the nearest gap
// and flickers for a moment, when nothing can hurt it. The three rounds have the clouds coming faster and the gaps narrower, and in the third the wind pushed the dove up and down (taken out 2026-10-25, per Dan: it felt like stronger gravity; DP_ROUNDS wind is 0 in every round now).
// ROUND X COMPLETED! after each, with the lost chance given back after rounds 1 and 2, like the other games.
// Rounds 2 and 3 also have vultures (2026-10-24, per Dan): one now and then flies in from the right, quicker than the clouds, at about the height the dove is at (2026-10-24, per Dan: it has to be in its way), and hitting one costs a chance too.
// A vulture is only sent when it would reach the dove in the open sky between two pairs of clouds, so it can always be got out of the way of.
// At the end of round 3 (2026-10-24, per Dan) the storm clears and the dove, with the olive branch in its beak, flies across the sky and lands on Noah's Ark floating on the flood,
// under a rainbow: about 6 seconds, drawn by dpDrawScene, and then ROUND 3 COMPLETED! and the Mission Complete screen as before.
// The sky is drawn on a <canvas> a third of the stage's size and stretched up with hard pixels. The flight itself (where the dove and the clouds are) is not saved: a game that is
// reloaded in the middle of a round starts the round again. Distances are fractions of the stage (x of its width, y of its height) so that it plays the same on any phone.
var DP_CHANCES = 3, DP_CLOUDS = 10;      // chances: 3 for now (2026-10-25, per Dan; it was 5)

/* ---------- Jacob's Ladder ---------- */

// Jacob's Ladder (2026-10-24, per Dan; the screen was mocked up first, the play is Doodle Jump's): Jacob bounces up by himself and the player steers him left and right by holding the
// left or right half of the screen (or the LEFT and RIGHT halves of the bar). He is always at the same height on the screen: it is the sky that moves. There are layers of clouds
// scrolling down behind (a far, a middle and a near one, at different speeds), and in front of them a field of ladder rungs, loose wooden rungs that are not attached to anything, at
// all sorts of places across. Jacob only lands on a rung when he is coming DOWN, and then bounces again; going up he passes through them. At either side of the sky he bounces off (he does not come in at the other side).
// Rungs: plain ones; ones that slide sideways; ones that break after one bounce (rounds 2 and 3); and, now and then, one with golden wings that bounces him very high. Rounds 2 and 3
// also have storm clouds drifting about: touching one costs a chance. So does falling a long way below the highest he has been: he is put back on a rung there and flickers for a
// moment. 3 chances. Each round is a climb to the gate of heaven (1200, 1800 and 2400 pixels of the little picture, shown in metres, 10 pixels to a metre), ROUND X COMPLETED! after
// each with the lost chance given back after rounds 1 and 2, like the other games. The world is worked out in the pixels of a little canvas, 118 wide and as tall as the stage needs,
// and nothing about the climb is saved: a game that is reloaded in the middle of a round starts the round again.

function jlDir(){

var HG_MARGIN = 7;             // the meadow round the garden
var HG_MAXFRAC = .45;          // the dotted line is this much of the picture's width at most

// the colours of this round's flowers and bees: every bee has at least one flower of its colour

// ---- pictures ----

function hgBurst(x, y, col){
  var k, cols = [col.c, col.l, "#FFFFFF", "#FFE45E"];
  for(k = 0; k < 16; k++){ var a = Math.random() * 6.2832, sp = hgRand(14, 44); hg.particles.push({x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 8, t: 0, life: hgRand(.45, .9), c: cols[k % cols.length]}); }
}

function hgStep(s, dt){
  var cfg = HG_ROUNDS[s.round], W = hg.W, H = hg.H;
  hg.t += dt;
  if(hg.mode === "crash"){ hg.crash.t += dt; hg.flash = Math.max(0, hg.flash - dt * 1.5); hgParticles(dt); return; }
  if(hg.mode === "done"){ hgParticles(dt); return; }
  // bees come in, one every cfg.gap seconds while there are not too many in the air
  hg.nextSpawn -= dt;
  if(hg.nextSpawn <= 0){
    var q = hg.bees.filter(function(b){ return b.state === "queued"; })[0];
    if(q && hgLive() < cfg.live){ hgSpawn(q); hg.nextSpawn = cfg.gap; } else if(!q) hg.nextSpawn = 1; else hg.nextSpawn = .4;
  }
  hg.bees.forEach(function(b){
    b.ph += dt * 22;
    if(b.state === "free"){
      b.x += b.vx * dt; b.y += b.vy * dt;
      if(b.x < -12 || b.x > W + 12 || b.y < -12 || b.y > H + 12){ b.state = "gone"; b.wait = hgRand(.9, 1.8); }       // it has flown off the screen: it comes back from another edge
    } else if(b.state === "gone"){
      b.wait -= dt; if(b.wait <= 0) hgSpawn(b);
    } else if(b.state === "follow"){
      var remain = HG_FOLLOW * dt;
      while(remain > 0 && b.path && b.seg < b.path.length){
        var tp = b.path[b.seg], dx = tp.x - b.x, dy = tp.y - b.y, d = Math.sqrt(dx * dx + dy * dy);
        if(Math.abs(dx) > .15) b.face = dx >= 0 ? 1 : -1;
        if(d <= remain){ b.x = tp.x; b.y = tp.y; remain -= d; b.seg++; }
        else { b.x += dx / d * remain; b.y += dy / d * remain; remain = 0; }
      }
      if(b.path && b.seg >= b.path.length) hgArrive(b);
    }
  });
  // two bees touching: the round is lost
  var i, j, bs = hg.bees;
  for(i = 0; i < bs.length && hg.mode === "play"; i++) for(j = i + 1; j < bs.length; j++){
    if(!hgInPlay(bs[i]) || !hgInPlay(bs[j])) continue;
    var cx = bs[i].x - bs[j].x, cy = bs[i].y - bs[j].y;
    if(cx * cx + cy * cy < HG_COLL * HG_COLL){ hgCrash(s, bs[i], bs[j]); break; }
  }
  hg.flowers.forEach(function(f){ if(f.pulse > 0) f.pulse = Math.max(0, f.pulse - dt); });
  hgParticles(dt);
  if(hg.mode === "play" && hg.delivered >= hg.total){
    hg.mode = "done"; hg.drag = null;
    setTimeout(function(){
      if(state.screen !== "hopeGarden" || state.session.hopeGarden !== s || s.interlude) return;
      s.interlude = {n: s.round + 1, phase: "msg", award: false, final: s.round >= HG_ROUNDS.length - 1};
      saveState(); render();
    }, 900);
  }
}
function hgParticles(dt){
  hg.particles.forEach(function(p){ p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 40 * dt; });
  hg.particles = hg.particles.filter(function(p){ return p.t < p.life; });
}
function hgCrash(s, a, b){
  hg.mode = "crash"; hg.crash = {a: a, b: b, t: 0, x: (a.x + b.x) / 2, y: (a.y + b.y) / 2}; hg.flash = .55; hg.drag = null;
  if(a.state === "hover") a.state = "free";
  if(b.state === "hover") b.state = "free";
  hgBurst(hg.crash.x, hg.crash.y, {c: "#FF5A5A", l: "#FFB0A0"});
  pixSfxPlay("jlFall", true);
  var st = document.getElementById("hgStage");
  if(st){ var el = document.createElement("div"); el.className = "hgOhNo"; el.textContent = t("hg_bump"); st.appendChild(el); }
  setTimeout(function(){
    if(state.screen !== "hopeGarden" || state.session.hopeGarden !== s || s.status !== "playing") return;
    s.status = "failed"; saveState(); render();
  }, HG_CRASH_MS);
}

// ---- drawing ----
function hgDraw(){
  var cv = document.getElementById("hgCanvas"), s = state.session.hopeGarden;
  if(!cv || !hg || !hg.ready || !s) return;
  var x = cv.getContext("2d"), W = hg.W, H = hg.H;
  x.drawImage(hg.bg, 0, 0);
  // flowers, row by row
  hg.flowers.forEach(function(f){
    var bob = f.pulse > 0 ? -Math.round(Math.sin(f.pulse / .6 * Math.PI) * 3) : 0, sw = Math.floor(f.stemW / 2);
    x.fillStyle = "#1B1F3B"; x.fillRect(f.x - sw - 1, f.stemTop + bob, f.stemW + 2, f.stemBot - f.stemTop - bob);
    x.fillStyle = "#2E9B3A"; x.fillRect(f.x - sw, f.stemTop + bob, f.stemW, f.stemBot - f.stemTop - bob);
    x.fillStyle = "#58D05C"; x.fillRect(f.x - sw, f.stemTop + bob, 1, f.stemBot - f.stemTop - bob);
    var ly = Math.round((f.stemTop + f.stemBot) / 2), lw = Math.max(3, Math.round(f.D / 4)), dir = f.row % 2 ? -1 : 1, lx = dir > 0 ? f.x + Math.ceil(f.stemW / 2) : f.x - sw - lw;
    x.fillStyle = "#1B1F3B"; x.fillRect(lx - 1, ly - 1, lw + 2, 4); x.fillStyle = "#46C24E"; x.fillRect(lx, ly, lw, 2); x.fillStyle = "#2E9B3A"; x.fillRect(lx, ly + 1, lw, 1);
    x.drawImage(hgHeadSprite(f.ci, f.D), Math.round(f.x - f.D / 2), Math.round(f.y - f.D / 2) + bob);
  });
  // the line being drawn
  if(hg.drag){
    var col = HG_COLORS[hg.drag.bee.ci], pts = hg.drag.pts, carry = 0, k;
    for(k = 1; k < pts.length; k++){
      var ax = pts[k - 1].x, ay = pts[k - 1].y, bx = pts[k].x, by = pts[k].y, d = Math.sqrt((bx - ax) * (bx - ax) + (by - ay) * (by - ay)), pos = carry;
      while(pos <= d){
        var px = Math.round(ax + (bx - ax) * pos / (d || 1)), py = Math.round(ay + (by - ay) * pos / (d || 1));
        x.fillStyle = "#1B1F3B"; x.fillRect(px - 2, py - 2, 4, 4); x.fillStyle = col.c; x.fillRect(px - 1, py - 1, 2, 2); x.fillStyle = col.l; x.fillRect(px - 1, py - 1, 1, 1);
        pos += 6;
      }
      carry = pos - d;
    }
    var last = pts[pts.length - 1]; x.fillStyle = "#FFFFFF"; x.fillRect(Math.round(last.x) - 1, Math.round(last.y) - 1, 3, 3); x.fillStyle = col.c; x.fillRect(Math.round(last.x), Math.round(last.y), 1, 1);
  }
  // the bees, over everything
  var bees = hg.bees.filter(function(b){ return b.state === "free" || b.state === "hover" || b.state === "follow"; }).sort(function(a, b){ return a.y - b.y; });
  bees.forEach(function(b){
    var fr = Math.floor(b.ph) % 2, sp = hgBeeSprite(b.ci, fr, b.face), hov = b.state === "hover" ? Math.round(Math.sin(hg.t * 12)) : 0;
    x.fillStyle = "rgba(40,24,8,.28)"; x.fillRect(Math.round(b.x) - 4, Math.round(b.y) + 7, 8, 1);
    x.drawImage(sp, Math.round(b.x - sp.width / 2), Math.round(b.y - sp.height / 2) + hov);
    if(b.state === "hover"){            // four white corners show which bee is being guided
      var bx2 = Math.round(b.x), by2 = Math.round(b.y); x.fillStyle = "#FFFFFF";
      x.fillRect(bx2 - 9, by2 - 8, 3, 1); x.fillRect(bx2 - 9, by2 - 8, 1, 3); x.fillRect(bx2 + 7, by2 - 8, 3, 1); x.fillRect(bx2 + 9, by2 - 8, 1, 3);
      x.fillRect(bx2 - 9, by2 + 8, 3, 1); x.fillRect(bx2 - 9, by2 + 6, 1, 3); x.fillRect(bx2 + 7, by2 + 8, 3, 1); x.fillRect(bx2 + 9, by2 + 6, 1, 3);
    }
  });
  hg.particles.forEach(function(p){ x.fillStyle = p.c; x.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); });
  if(hg.flash > 0){ x.fillStyle = "rgba(255,60,60," + Math.min(.45, hg.flash).toFixed(2) + ")"; x.fillRect(0, 0, W, H); }
}
function hgLoop(now){
  var s = state.session.hopeGarden;
  if(state.screen !== "hopeGarden" || !s || !hg){ hgRaf = 0; return; }
  var dt = Math.min(.05, (now - hg.last_t) / 1000); hg.last_t = now;
  if(s.status === "playing" && !s.interlude && hg.ready && !hgWaiting) hgStep(s, dt);
  hgDraw();
  hgRaf = requestAnimationFrame(hgLoop);
}
function hgLoopStart(){ if(hgRaf) return; if(hg) hg.last_t = performance.now(); hgRaf = requestAnimationFrame(hgLoop); }
// the picture is measured from the room the stage has: whole picture pixels, each 3 x 3 screen pixels
function hgFit(){
  var cv = document.getElementById("hgCanvas"), st = document.getElementById("hgStage"), s = state.session.hopeGarden;
  if(!cv || !st || !hg || !s) return;
  var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  st.style.height = Math.max(240, Math.floor(vh - st.getBoundingClientRect().top - 32)) + "px";          // the garden takes all the room under the heading
  var W = Math.max(60, Math.floor(st.clientWidth / HG_SCALE)), H = Math.max(80, Math.floor(st.clientHeight / HG_SCALE));
  cv.width = W; cv.height = H; cv.style.width = (W * HG_SCALE) + "px"; cv.style.height = (H * HG_SCALE) + "px";
  if(hg.W !== W || hg.H !== H || !hg.ready){ hg.W = W; hg.H = H; hg.drag = null; hgLayout(); }
}
window.addEventListener("resize", function(){ if(state.screen === "hopeGarden"){ hgFit(); hgDraw(); } });

// ---- the finger ----
function hgPt(ev){
  var cv = document.getElementById("hgCanvas"), r = cv.getBoundingClientRect();
  return {x: Math.max(0, Math.min(hg.W, (ev.clientX - r.left) * hg.W / r.width)), y: Math.max(0, Math.min(hg.H, (ev.clientY - r.top) * hg.H / r.height))};
}
function hgDown(ev){
  var s = state.session.hopeGarden;
  if(!hg || !s || !hg.ready || s.status !== "playing" || s.interlude || hgWaiting || hg.mode !== "play" || hg.drag) return;
  ev.preventDefault();
  var p = hgPt(ev), best = null, bd = HG_TAP;
  hg.bees.forEach(function(b){ if(b.state !== "free") return; var d = Math.sqrt((b.x - p.x) * (b.x - p.x) + (b.y - p.y) * (b.y - p.y)); if(d < bd){ bd = d; best = b; } });
  if(!best) return;
  if(pixAudioStale) pixReviveOnTap();
  try { document.getElementById("hgCanvas").setPointerCapture(ev.pointerId); } catch(e){}
  best.state = "hover";                                           // it waits where it is while its line is drawn
  hg.drag = {bee: best, id: ev.pointerId, pts: [{x: best.x, y: best.y}], len: 0};
  pixSfxPlay("fmFirst", true);
}
function hgMove(ev){
  var d0 = hg && hg.drag; if(!d0 || ev.pointerId !== d0.id) return;
  var p = hgPt(ev), last = d0.pts[d0.pts.length - 1], dx = p.x - last.x, dy = p.y - last.y, d = Math.sqrt(dx * dx + dy * dy), max = hgMax();
  if(d < 2.5 || d0.len >= max) return;
  if(d0.len + d > max){ var k = (max - d0.len) / d; p = {x: last.x + dx * k, y: last.y + dy * k}; d = max - d0.len; }       // the line only reaches so far
  d0.pts.push(p); d0.len += d;
}
function hgUp(ev){
  var d0 = hg && hg.drag; if(!d0 || (ev && ev.pointerId !== undefined && ev.pointerId !== d0.id)) return;
  hg.drag = null;
  var b = d0.bee; if(b.state !== "hover") return;
  if(d0.len < 5){ b.state = "free"; return; }                      // only a tap: the bee flies on as it was
  b.state = "follow"; b.path = d0.pts; b.seg = 1;
}
window.addEventListener("pointerup", hgUp, true);
window.addEventListener("pointercancel", hgUp, true);
// the first tap of a round starts it (the same layer as in Jacob's Ladder)
function hgGo(ev){
  var s = state.session.hopeGarden;
  if(!hgWaiting || !s || s.status !== "playing" || s.interlude) return;
  if(ev && ev.type === "click" && !hgTouched) return;
  if(ev && (ev.type === "pointerdown" || ev.type === "touchstart")) hgTouched = true;
  hgWaiting = false;
  try { if(pixAudioStale) pixReviveOnTap(); } catch(e){}
  var rd = document.getElementById("hgReady"); if(rd && rd.parentNode) rd.parentNode.removeChild(rd);
  var all = document.querySelector(".hgTapAll"); if(all && all.parentNode) all.parentNode.removeChild(all);
  if(hg) hg.last_t = performance.now();
}
document.addEventListener("pointerdown", function(e){
  if(state.screen !== "hopeGarden" || !hgWaiting) return;
  if(e.target && e.target.closest && e.target.closest(".exitBar, .exitBtn")) return;
  hgGo(e);
}, true);
