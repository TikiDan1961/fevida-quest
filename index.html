<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fe y Vida Quest</title>
<style>
  :root{
    --gold:#D9A63B;
    --magenta:#D6247A;
    --teal:#0FA3A0;
    --purple:#5A2E86;
    --purple-dark:#3A1C5A;
    --cream:#FFF8EC;
    --ink:#2A1A3A;
    --glow: rgba(255,215,0,.85);
    --danger:#C43B3B;
    --good:#2E9E4F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  /* This is a game, not a document: tapping or holding a button, tile or text must
     never highlight it as if it were being copied, and a long press must not open
     the iOS copy/save-image bubble (2026-10-19, per Dan). */
  #app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  #app img{-webkit-user-drag:none;user-drag:none;}
  button{touch-action:manipulation;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 50% 0%, var(--purple) 0%, var(--purple-dark) 55%, #200f33 100%);
    color:var(--cream);
    height:100%;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    /* Fixed height (not min-height) + its own overflow-y, not 100vh alone —
       on iOS Safari 100vh is measured against the viewport with the address
       bar hidden, which is taller than what's actually visible when the bar
       is showing (the normal state). min-height:100vh then let the WHOLE
       page grow past the real visible area, making the entire screen
       vertically scrollable even though nothing on it actually needed to
       scroll. 100dvh (dynamic viewport height, iOS 15.4+) tracks the real
       visible height instead; html/body get overflow:hidden so any residual
       mismatch scrolls only inside #app, never the whole page. */
    height:100vh;
    height:100dvh;
    overflow-y:auto;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 22px);
    display:flex;
    flex-direction:column;
  }
  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .screen.screen-enter{ animation:fadeIn .25s ease-out; }
  /* Fade only -- no slide (2026-10-24, per Dan): a slide moves the whole screen 6px and then snaps it into place, which looked like a 1px shift. */
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  h1{font-size:1.5rem;margin:.2em 0 .1em;color:var(--gold);text-align:center;}
  h2{font-size:1.15rem;margin:.3em 0;color:var(--gold);text-align:center;}
  p{line-height:1.45;font-size:.98rem;}
  .center{text-align:center;}
  .spacer{flex:1;}
  .btn{
    display:block;
    width:100%;
    border:2px solid var(--gold);
    background:linear-gradient(180deg,var(--magenta),#a3155e);
    color:#fff;
    font-weight:700;
    font-size:1rem;
    letter-spacing:.02em;
    padding:14px 12px;
    border-radius:14px;
    margin:8px 0;
    cursor:pointer;
    transition:transform .08s ease;
  }
  .btn:active{transform:scale(.97);box-shadow:0 0 14px 4px var(--glow);border-color:#fff;}
  .btn.secondary{background:linear-gradient(180deg,var(--teal),#087572);}
  .btn.gold{background:linear-gradient(180deg,var(--gold),#b3822a);color:var(--ink);}
  .btn.outline{background:transparent;color:var(--gold);}
  .btn:disabled{opacity:.4;pointer-events:none;}
  .badge-icon{filter:drop-shadow(0 0 6px rgba(0,0,0,.4));}

  .lang-grid{display:flex;flex-direction:column;gap:14px;margin-top:24px;}
  .lang-btn{font-size:1.3rem;padding:22px;border-radius:18px;}

  /* 8-bit look (2026-10-19, per the client's reference images), starting with the
     language screen. Pixelify Sans (SIL Open Font License, tiles/PixelifySans-OFL.txt)
     is bundled with the app so it works offline. It is only crisp at whole
     multiples of 8px (16, 24, 32), so sizes below are 1rem = 16px, 1.5rem = 24px,
     2rem = 32px. */
  /* The game's font is Jersey 10 (2026-10-26, per Dan: Pixelify Sans was hard to read, its C looked like an O; SIL Open Font License, tiles/Jersey10-OFL.txt), bundled so it works offline.
     It has one weight, declared as 400 to 700 so the phone does not fake a bold one. Its letters are smaller than Pixelify Sans's for the same size, so size-adjust makes them 120%: every
     font-size in this file stays as it was. Pixelify Sans stays in the font lists as a fallback and is only fetched if Jersey 10 cannot be. (The old one-glyph "5" font, tiles/FeYVidaFive.ttf, is not needed any more.) */
  @font-face{font-family:"Jersey 10";src:url("tiles/Jersey10.ttf") format("truetype");font-weight:400 700;font-style:normal;size-adjust:120%;font-display:block;}
  @font-face{font-family:"Pixelify Sans";src:url("tiles/PixelifySans.ttf") format("truetype");font-weight:400 700;font-style:normal;font-display:block;}
  /* Language screen (2026-10-19, per the client's reference image): a pixel-art
     church scene fills the screen, the small logo and QUEST sit in the sky, and a
     white card holds the QR code and the two language buttons. The scene image
     is 125x140 pixels, drawn at the full width of the screen. */
  .pixHome{position:relative;min-height:100dvh;margin:calc(-1 * (env(safe-area-inset-top,0px) + 18px)) -18px calc(-1 * (env(safe-area-inset-bottom,0px) + 22px));padding:calc(env(safe-area-inset-top,0px) + 8px) 0 14px;display:flex;flex-direction:column;align-items:center;
    /* The scene sits 34px below the top (sky colour fills the gap and grass fills below it) so QUEST has clear room above the church cross. */
    background:url("tiles/scene_church.png") center top 34px / 100% auto no-repeat,linear-gradient(#4FB0F2 0,#4FB0F2 150px,#52B043 150px);image-rendering:pixelated;font-family:"Jersey 10","Pixelify Sans",ui-monospace,monospace;}
  .pixLogoSmall{display:block;width:192px;height:auto;image-rendering:pixelated;}
  .pixQuest{font-family:"Jersey 10","Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:4rem;line-height:1;letter-spacing:.04em;margin:0;color:#FFC93A;
    text-shadow:3px 0 #1b2a6b,-3px 0 #1b2a6b,0 3px #1b2a6b,0 -3px #1b2a6b,3px 3px #1b2a6b,-3px -3px #1b2a6b,3px -3px #1b2a6b,-3px 3px #1b2a6b,0 7px 0 #1b2a6b,3px 7px 0 #1b2a6b,-3px 7px 0 #1b2a6b;}
  .pixCard{width:calc(100% - 28px);max-width:420px;background:#fff;border-radius:18px;padding:14px 16px 12px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.28);color:#1E2F7A;}
  .pixCardTitle{font-weight:700;font-size:1.5rem;letter-spacing:.03em;line-height:1.1;}
  .pixCardSub{font-weight:500;font-size:1rem;letter-spacing:.03em;color:#5666a8;margin-top:2px;}
  .pixQr{position:relative;width:177px;height:177px;margin:10px auto 12px;padding:16px;}
  .pixQr img{display:block;width:145px;height:145px;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;}
  .pixQr i{position:absolute;width:22px;height:22px;border:0 solid #4CB848;}
  .pixQr .tl{left:0;top:0;border-left-width:5px;border-top-width:5px;border-top-left-radius:6px;}
  .pixQr .tr{right:0;top:0;border-right-width:5px;border-top-width:5px;border-top-right-radius:6px;}
  .pixQr .bl{left:0;bottom:0;border-left-width:5px;border-bottom-width:5px;border-bottom-left-radius:6px;}
  .pixQr .br{right:0;bottom:0;border-right-width:5px;border-bottom-width:5px;border-bottom-right-radius:6px;}
  .btn.pixBtn{width:min(78%,260px);margin:0 auto 10px;padding:8px 12px 6px;font-family:"Jersey 10","Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:1.5rem;line-height:1.2;letter-spacing:.06em;border-radius:12px;border:3px solid #1E6B2B;border-bottom-width:6px;background:#52C246;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.35);box-shadow:inset 0 3px 0 rgba(255,255,255,.4);transition:none;}
  .btn.pixBtn.secondary{border-color:#1C4E9A;background:#3A93E8;}
  /* Pressed: the button sinks and lights up -- a hard light ring plus a soft glow in its own colour (2026-10-19, per Dan). */
  /* Only transform and box-shadow change while pressed -- never a border width or size, which would resize the button and make the white card above it jump. */
  .pixLang .btn.pixBtn:active,.pixChurch .btn.pixBtn:active{transform:none;}   /* the buttons on the first two screens (language, START YOUR QUEST) glow but do not move when pressed (2026-10-22, per Dan) */
  .btn.pixBtn:active{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 0 0 3px #E2FFD8,0 0 18px 8px rgba(120,255,120,.8);}
  .pixMission.pixLower .btn.pixBtn:active{transform:none;}   /* Faith Match / Faith Flash buttons glow but never move when tapped (2026-10-20, per Dan) */
  .btn.pixBtn:disabled{opacity:.5;filter:grayscale(.4);pointer-events:none;}
  .btn.pixBtn.secondary:active{box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 0 0 3px #DCEEFF,0 0 18px 8px rgba(110,190,255,.85);}
  /* Welcome screen: the church-interior picture (125x270 pixels, drawn at the full screen
     width and anchored to the bottom so the pews stay under the buttons; any extra height
     at the top is ceiling brown). */
  .pixChurch{padding-top:calc(env(safe-area-inset-top,0px) + 16px);
    background:url("tiles/church_interior2.png") center bottom / 100% auto no-repeat,#6B4423;}
  /* The church scene (2026-10-23): laid over the same picture as the Welcome screen, in the picture's own 125 x 270 shape, anchored at the bottom like the picture. */
  .cwScene{position:absolute;left:0;bottom:0;width:100%;aspect-ratio:125/270;pointer-events:none;}
  .cwPilgrim{position:absolute;aspect-ratio:11/15;}
  .cwSprite{width:100%;height:100%;background:url("tiles/pilgrim_back.png") 0 0 / 200% 100% no-repeat;image-rendering:pixelated;animation:pilgrimBreath 1.8s steps(1) infinite;}
  .cwPilgrim.walking .cwSprite{animation:pilgrimStep .5s steps(1) infinite,pilgrimBob .5s steps(1) infinite;}
  .cwTicket{position:absolute;display:none;image-rendering:auto;}      /* the ticket is a smooth 640 x 640 picture (tiles/golden_ticket.png), no longer the 48 x 48 pixel icon (2026-10-25, per Dan) */
  .cwTicket.show{display:block;animation:cwTicketPop .45s ease-out 1,cwTicketGlow 1s ease-in-out .45s infinite alternate;filter:drop-shadow(0 0 8px rgba(255,230,120,.95));}
  @keyframes cwTicketPop{0%{transform:scale(0);opacity:0;}65%{transform:scale(1.18);opacity:1;}100%{transform:scale(1);opacity:1;}}
  @keyframes cwTicketGlow{0%{filter:drop-shadow(0 0 5px rgba(255,230,120,.8));}100%{filter:drop-shadow(0 0 16px rgba(255,240,150,1));}}
  .pixWelcomeCard{padding:18px 18px 20px;}
  .pixWelTitle{font-family:"Jersey 10","Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:1.75rem;line-height:1.15;letter-spacing:.02em;color:#1E2F7A;margin:0 0 10px;}
  .pixWelBody{font-family:"Jersey 10","Pixelify Sans",ui-monospace,monospace;font-weight:500;font-size:1.25rem;line-height:1.3;letter-spacing:.01em;color:#2A3A78;margin:0;}
  /* Same box as the language screen's white card (width and side padding), so the buttons land in the same place and size. */
  .pixBtnDock{width:calc(100% - 28px);max-width:420px;padding:0 16px 12px;}
  /* The welcome buttons carry longer words in a smaller type, but keep the language buttons' exact box (51.8px tall). */
  /* ENGLISH / ESPAÑOL (pixBtnLg) and START YOUR QUEST / CHANGE LANGUAGE (pixBtnMd, pixBtnSm) share one frame; only the type size differs. The words are centred on the button face (between the 3px top edge and the 6px bottom edge). */
  .btn.pixBtn.pixBtnLg,.btn.pixBtn.pixBtnMd,.btn.pixBtn.pixBtnSm{height:51.8px;display:flex;align-items:center;justify-content:center;line-height:1;padding:1px 12px 0;}
  .btn.pixBtn.pixBtnLg{font-size:1.5rem;padding-top:2px;}
  .btn.pixBtn.pixBtnMd{font-size:1.25rem;}
  .btn.pixBtn.pixBtnSm{font-size:1rem;letter-spacing:.04em;}
  .btn.pixBtn.pixBtnSm.pixBtnBig{font-size:1.5rem;letter-spacing:.06em;}      /* (2026-10-26, per Dan) START MISSION, MISSION COMPLETED and MAIN MENU have larger text: the size of the big buttons (1.25rem on short screens, below) */
  /* Home screen icons, the Missions folder and the expanding tile (2026-10-19, per Dan) */
  .homeGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 2px;margin:22px 0 10px;}
  @media (max-width:340px){
    .homeGrid .appTile{width:62px;height:62px;}
    .homeGrid .miniGrid{grid-template-columns:24px 24px;}
    .homeGrid .appTile .miniGrid img.spr{width:24px;height:24px;image-rendering:pixelated;}
  }
  .appIcon{display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;}
  /* Only the icon itself (its tile and its name) takes a tap or lights up -- not the empty space around it in its grid cell, so a tap between
     two icons does nothing (2026-10-20, per Dan). The tile and name still pass their tap up to the icon, which does the work. */
  .appIcon{pointer-events:none;}
  /* Narrower still (2026-10-21, per Dan): only the middle of the tile takes the tap -- 12px in from each edge, about the size of the picture --
     and the name under it takes none. A tap near the edge of a tile, or on its name, does nothing. */
  .appIcon .appTile{pointer-events:none;}
  .appIcon .appTile::before{content:"";position:absolute;left:12px;top:12px;right:12px;bottom:12px;pointer-events:auto;}
  @media (max-width:340px){ .appIcon .appTile::before{left:10px;top:10px;right:10px;bottom:10px;} }
  .appTile{position:relative;width:72px;height:72px;border-radius:16px;border:3px solid #1B1F3B;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 0 rgba(20,30,90,.4),inset 0 3px 0 rgba(255,255,255,.35);}
  .appTile img.spr{width:48px;height:48px;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;pointer-events:none;}
  .appIcon:active .appTile{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 0 0 3px #FFF6C0,0 0 16px 6px rgba(255,236,120,.9);}
  .appName{margin-top:9px;font-family:"Jersey 10","Pixelify Sans",ui-monospace,monospace;font-weight:600;font-size:.875rem;line-height:1.1;color:#fff;
    text-shadow:2px 0 #1b2a6b,-2px 0 #1b2a6b,0 2px #1b2a6b,0 -2px #1b2a6b,2px 2px #1b2a6b,-2px -2px #1b2a6b,2px -2px #1b2a6b,-2px 2px #1b2a6b;}
  .appTag{margin-top:3px;font-family:"Jersey 10","Pixelify Sans",ui-monospace,monospace;font-weight:600;font-size:.75rem;letter-spacing:.03em;color:#FFC93A;text-transform:lowercase;}
  .appTag::first-letter{text-transform:uppercase;}
  .miniGrid{display:grid;grid-template-columns:32px 32px;gap:0;}
  /* (2026-10-26, per Dan: sharper, still pixelated) the four little pictures on the Missions icon were smoothed (image-rendering:auto), which blurred them; they are drawn blocky now, like the rest.
     The icons are 16 x 16 pixel pictures stored at 48 x 48 (3 x 3 each), so 32px (24px on small phones) gives every picture pixel a whole number of screen pixels on a 2x or 3x screen. */
  .appTile .miniGrid img.spr{width:32px;height:32px;image-rendering:pixelated;}
  .countBadge{position:absolute;top:-9px;right:-12px;min-width:34px;padding:2px 6px;border-radius:12px;background:#D6343A;border:3px solid #fff;color:#fff;
    font-family:"Jersey 10","Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:.75rem;line-height:1.1;text-shadow:none;box-shadow:0 2px 0 rgba(0,0,0,.3);}
  .doneBadge{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:#2E9E4F;border:3px solid #fff;color:#fff;font-size:.8rem;font-weight:700;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.3);}
  /* (2026-10-25, per Dan) an icon that cannot be opened is grey: the locked Golden Ticket, the coming-soon missions, and all the icons while the pilgrim is talking and walking */
  .appIcon{transition:filter .2s,opacity .2s;}
  .appIcon.locked .appTile{filter:grayscale(1) brightness(.9);}
  .appIcon.locked .appName{opacity:.75;}
  .appIcon.soon .appTile{filter:grayscale(1);opacity:.55;}
  .appIcon.soon .appName{opacity:.85;}
  .pixMenu.pilgrimBusy .homeGrid .appIcon{filter:grayscale(1);opacity:.55;}
  /* Hope Garden (2026-10-26, per Dan): the garden is a canvas drawn at 3 x 3 screen pixels to the picture pixel (sized in hgFit); no buttons under it */
  .hgArea{width:min(100%,380px);margin:0 auto;}
  .hgStage{position:relative;overflow:hidden;box-sizing:border-box;height:clamp(260px,calc(100vh - 262px),640px);height:clamp(260px,calc(100dvh - 262px),640px);display:flex;align-items:center;justify-content:center;border:4px solid #FFC93A;border-radius:16px;
    box-shadow:0 0 0 4px #1B1F3B,0 5px 0 4px rgba(20,30,90,.4);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:#79CE57;touch-action:none;}
  .hgCanvas{display:block;flex:none;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none;}
  .hgStage .dpReady{top:50%;transform:translateY(-50%);}
  .hgOhNo{position:absolute;left:0;right:0;top:36%;text-align:center;pointer-events:none;z-index:5;font-family:"Jersey 10","Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:2.1rem;color:#FF5A5A;
    text-shadow:3px 0 #fff,-3px 0 #fff,0 3px #fff,0 -3px #fff,3px 3px #fff,-3px -3px #fff,3px -3px #fff,-3px 3px #fff,5px 5px 0 #1B1F3B;animation:jlOh .22s steps(2) infinite;}
  /* the Hope Garden icon on the Main Menu sits on the scene beside the church; hgPlaceMenuIcon puts it in line with the left-most icon of the row above */
  .pixHome.pixSky > .hgMenuIcon{position:absolute;z-index:6;visibility:hidden;left:0;top:300px;margin:0;}
  .pixMenu.pilgrimBusy .hgMenuIcon{filter:grayscale(1);opacity:.55;pointer-events:none;}

  .appIcon.done .appTile{filter:saturate(.65);}
  .pixHome.pixSky > .folderOverlay{position:fixed;left:0;top:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;
    background:rgba(10,20,70,.55);animation:folderFade .2s ease-out;}
  @keyframes folderFade{from{opacity:0;}to{opacity:1;}}
  .folderPanel{position:relative;width:100%;max-width:420px;max-height:86%;overflow-y:auto;background:#223A8C;border:4px solid #FFC93A;border-radius:22px;
    padding:14px 12px 18px;box-shadow:0 6px 0 rgba(0,0,0,.35);transform-origin:var(--ox,50%) var(--oy,50%);animation:folderPop .24s ease-out;}
  @keyframes folderPop{from{transform:scale(.2);opacity:0;}to{transform:scale(1);opacity:1;}}
  .folderTitle{font-family:"Jersey 10","Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:1.5rem;letter-spacing:.08em;text-transform:uppercase;color:#FFC93A;text-align:center;margin:2px 0 16px;}
  .folderGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 4px;}
  .folderGrid .appName{font-size:.8125rem;overflow-wrap:anywhere;}
  @media (max-width:340px){ .folderGrid .appName{font-size:.75rem;} }
  .folderClose{position:absolute;top:8px;right:10px;width:44px;height:44px;padding:0 0 3px;border:3px solid #1B1F3B;border-radius:12px;background:#D6343A;color:#fff;cursor:pointer;
    font-family:"Jersey 10","Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:1.5rem;line-height:1;text-shadow:2px 2px 0 rgba(0,0,0,.35);
    box-shadow:0 4px 0 rgba(20,30,90,.4),inset 0 3px 0 rgba(255,255,255,.35);}
  .folderClose:active{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 0 0 3px #FFE0DC,0 0 16px 6px rgba(255,120,110,.9);}
  .expandClone{position:fixed;z-index:100;border-radius:16px;border:3px solid #1B1F3B;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none;
    transition:left .28s ease-in,top .28s ease-in,width .28s ease-in,height .28s ease-in,border-radius .28s ease-in,opacity .25s ease-out;}
  .expandClone img.spr{width:48px;height:48px;image-rendering:pixelated;transition:transform .28s ease-in;}
  /* Pilgrim scene on the Home Screen (2026-10-20, per Dan): a hill with a church, a winding path and a little pilgrim who walks
     toward the church as the player earns Quest Points. The scene picture is 125x106 pixels, drawn at the full screen width; everything on it is placed in percentages so it scales with the picture. */
  /* The scene fills everything under the icons, down to the bottom of the screen (2026-10-20, per Dan). scene_world.png is 125x240 pixels:
     the hill and church at the top, then the path winding on down through the lawn. It is drawn at the full screen width (the negative side
     margins cancel the sky's 18px padding) and cropped at the bottom of the screen. .pixSceneBox is the picture's own box, so everything
     placed on it in percentages stays lined up with the art whatever the crop. */
  .pixHome.pixSky > .pixScene{position:relative;flex:1 1 auto;min-height:0;width:calc(100% + 36px);margin:4px -18px calc(-1 * (env(safe-area-inset-bottom,0px) + 22px));
    overflow:hidden;z-index:auto;pointer-events:none;}
  .pixScene::before{content:"";display:block;padding-top:84.8%;}   /* the top 106 rows (hill, church, first bend) always show in full */
  .pixSceneBox{position:absolute;left:0;top:0;width:100%;aspect-ratio:125/240;}
  .pixSceneBox::after{content:"";position:absolute;left:0;right:0;top:100%;height:300px;background:#52B043;}   /* lawn green below the picture, for very tall screens */
  @media (max-height:600px){
    .pixMenu .homeGrid{margin:14px 0 0;}
    .pixHome.pixSky > .pixScene{margin-top:0;}
  }
  .pixSceneArt{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;}
  .churchGlow{position:absolute;left:43.2%;top:12.5%;width:12.8%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle,rgba(255,226,120,.9) 0,rgba(255,226,120,0) 68%);opacity:.3;animation:glowPulse 2.6s ease-in-out infinite alternate;}
  .churchGlow.lit{transform:scale(1.35);opacity:.6;animation-name:glowPulseLit;}
  @keyframes glowPulse{from{opacity:.2;}to{opacity:.6;}}

  /* the play area is only for watching (2026-10-22, per Dan): the lights fall inside .clField, which sits inside the gold edge so nothing crosses it,
     and the finger slides on the SLIDE band below */
  /* (2026-10-25, per Dan) the painted stars are muted a little (a blue veil over them), and a few stars twinkle brighter now and then (.clTwinkles, below) */
  .pixMission .clStage{position:relative;flex:1;min-height:150px;margin:8px 0 8px;background-color:#1E2F7A;background-image:linear-gradient(rgba(30,47,122,.42),rgba(30,47,122,.42)),url("tiles/stars_tile.png");background-size:auto,96px 96px;background-repeat:repeat;image-rendering:pixelated;
    border:4px solid #1B1F3B;border-radius:14px;box-shadow:inset 0 0 0 4px #FFC93A,0 6px 0 rgba(20,30,90,.4);overflow:hidden;touch-action:none;}
  .pixMission .clField{position:absolute;left:4px;top:4px;right:4px;bottom:4px;overflow:hidden;border-radius:6px;}
  .pixMission .clTwinkles{position:absolute;left:4px;top:4px;right:4px;bottom:4px;overflow:hidden;pointer-events:none;}
  .pixMission .clTwinkles i{position:absolute;width:3px;height:3px;margin:-1px 0 0 -1px;opacity:0;background:#fff;box-shadow:-3px 0 #fff,3px 0 #fff,0 -3px #fff,0 3px #fff,0 0 8px 3px rgba(255,255,255,.8);animation:clTw 3s linear infinite;}
  .pixMission .clTwinkles i.y{background:#FFF2A8;box-shadow:-3px 0 #FFF2A8,3px 0 #FFF2A8,0 -3px #FFF2A8,0 3px #FFF2A8,0 0 8px 3px rgba(255,236,140,.8);}
  @keyframes clTw{0%,60%{opacity:0;transform:scale(.5);}72%{opacity:1;transform:scale(1.2);}88%{opacity:.65;transform:scale(1);}100%{opacity:0;transform:scale(.5);}}
  /* the light that falls glows as it falls (2026-10-25, per Dan): a soft pulsing halo round it */
  .pixMission .clIcon::before{content:"";position:absolute;left:-16px;top:-16px;right:-16px;bottom:-16px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,244,170,.9) 0,rgba(255,214,90,.5) 36%,rgba(255,214,90,0) 70%);animation:clGlow .55s ease-in-out infinite alternate;}
  @keyframes clGlow{from{opacity:.55;transform:scale(.88);}to{opacity:1;transform:scale(1.18);}}
  .pixMission > .clTapAll{position:fixed;left:0;top:0;right:0;bottom:0;z-index:10;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;}      /* until the first tap of a round, the whole screen starts it (the red X, above it, still works) */
  .pixMission .clField .dpReady{top:50%;transform:translateY(-50%);}
  .pixMission .clIcon{position:absolute;top:-50px;width:32px;height:32px;background:url("tiles/icons48/ic_catchLight.png") center / 100% 100% no-repeat;image-rendering:auto;user-select:none;pointer-events:none;}

  .pixMission .clSlide{flex:none;display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;height:90px;margin:0;padding:0 16px;background:#2B4BA8;border:4px solid #1B1F3B;border-radius:14px;
    box-shadow:inset 0 0 0 3px #3A93E8,0 6px 0 rgba(20,30,90,.4);touch-action:none;user-select:none;-webkit-user-select:none;cursor:ew-resize;}
  /* the tap zone starts 10 px above the band and runs down to the bottom of the screen (2026-10-22, per Dan): the padding above and below is cancelled by the

  .navArrow:active{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 0 0 3px #FFF6C0,0 0 16px 6px rgba(255,236,120,.9);}
  .dots{display:flex;gap:6px;justify-content:center;margin:12px 0 2px;flex-wrap:wrap;}
  .dot{width:10px;height:10px;border-radius:2px;background:rgba(255,255,255,.55);border:2px solid #1B1F3B;box-sizing:border-box;}
  .dot.active{background:#FFC93A;}

  .ticketBox{background:linear-gradient(160deg,var(--gold),#c99a2e);color:var(--ink);border-radius:18px;padding:26px 18px;text-align:center;border:3px dashed var(--ink);margin:16px 0;}
  .ticketBox .tk{font-size:3.5rem;}

  .smallNote{font-size:.78rem;opacity:.75;text-align:center;margin-top:6px;}

  /* Follow the Light — 3x3 image-tile memory grid (2026-09-30 redesign) */
  .flGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0;}
  .flPad{aspect-ratio:1/1;border-radius:12px;border:2px solid var(--gold);background:linear-gradient(160deg,var(--purple),var(--purple-dark));display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:transform .1s ease,box-shadow .15s ease;}
  .flPad:active{transform:scale(.95);}
  .flPad.lit{box-shadow:0 0 20px 6px var(--glow);border-color:#fff;}
  .flPad.disabled{pointer-events:none;}
  .flPad img{width:100%;height:100%;object-fit:cover;display:block;}
  .flMsg{min-height:1.3em;}
  .flMsg.wrong{color:var(--danger);font-weight:700;}

  /* Word Unscramble */
  .wuAnswerRow{display:flex;gap:8px;justify-content:center;margin:18px 0 10px;flex-wrap:wrap;}
  .wuSlot{width:38px;height:46px;border:2px solid var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;background:rgba(255,255,255,.06);}
  .wuSlot.filled{background:rgba(255,255,255,.18);}
  .wuAnswerRow.correct .wuSlot{border-color:var(--good);background:rgba(46,158,79,.4);}
  .wuAnswerRow.wrong .wuSlot{border-color:var(--danger);background:rgba(196,59,59,.4);animation:wuShake .4s;}
  @keyframes wuShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .wuTray{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0;}
  .wuTile{width:42px;height:48px;border:2px solid var(--gold);border-radius:8px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;cursor:pointer;}
  .wuTile:active{box-shadow:0 0 10px 3px var(--glow);}
  .wuTile.used{opacity:.2;pointer-events:none;}

  /* Catch the Light — Kaboom!-style: icons no longer take taps of their own
     (pointer-events:none — the STAGE captures the drag instead), so no
     cursor:pointer here any more. touch-action:none on the stage stops the
     phone's own scroll/pan gesture from fighting the hands drag. */
  .clHud{display:flex;justify-content:space-between;align-items:center;font-size:.95rem;margin:4px 0;}
  .clStage{position:relative;flex:1;min-height:260px;background:rgba(255,255,255,.05);border:2px solid var(--gold);border-radius:16px;overflow:hidden;margin:8px 0;touch-action:none;}
  .clIcon{position:absolute;top:-50px;font-size:2.2rem;user-select:none;line-height:1;pointer-events:none;}
  .clHands{position:absolute;bottom:6px;font-size:2.8rem;line-height:1;transform:translateX(-50%);user-select:none;pointer-events:none;}
  .clCountdownNum{font-size:5rem;font-weight:800;color:var(--gold);margin:18px 0;}

  /* Acts of Kindness Sort */
  .kindBtns{display:flex;gap:10px;}
  .kindBtns .btn{flex:1;}
  .kindBtn.correct{background:linear-gradient(180deg,var(--good),#1c6d35);border-color:#fff;}
  .kindBtn.wrong{background:linear-gradient(180deg,var(--danger),#8a2626);border-color:#fff;}
  .kindBtn.disabled{pointer-events:none;opacity:.7;}

  /* Hidden Blessings */
  .hbScene{position:relative;flex:1;min-height:280px;border-radius:16px;overflow:hidden;border:2px solid var(--gold);margin:10px 0;background:radial-gradient(circle at 30% 20%,var(--purple) 0%,var(--purple-dark) 60%,#1a0c28 100%);}
  .hbSpot{position:absolute;width:15%;aspect-ratio:1/1;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:1.7rem;opacity:.16;filter:grayscale(85%) brightness(.7);cursor:pointer;transition:opacity .2s ease,filter .2s ease;}
  .hbSpot.found{opacity:1;filter:none;animation:hbPop .35s ease;pointer-events:none;}
  @keyframes hbPop{0%{transform:translate(-50%,-50%) scale(.6);}60%{transform:translate(-50%,-50%) scale(1.3);}100%{transform:translate(-50%,-50%) scale(1);}}
</style>

// Reusable badge <img> with a graceful fallback to the mission's emoji icon
// (in the existing .passportBadge circle styling) if its PNG isn't there yet
// — lets the 5 new missions work end-to-end today, before Dan's new badge
// art exists, and upgrades automatically the moment each file is dropped in.
// 10 mission-badge pages + 1 Joyous Photo page. Kept as its own constant
// (rather than re-deriving MISSIONS.length+1 at every call site) so the
// Passport's page-count/wrap math and the "/11" CSS above (percentages
// can't reference a JS constant, so they're hand-kept in sync with this)
// stay easy to grep together if the mission count ever changes again.
var PASSPORT_PAGES = MISSIONS.length;       // one badge page for each mission; the Joyous Photo page that came last is gone (2026-10-22, per Dan)
// The rendered track carries 2 extra "phantom" slides beyond the real
// PASSPORT_PAGES -- a clone of the last page before slot 0 and a clone of
// the first page after the last real slot -- purely so a wrap (11th page ->
// 1st, or 1st -> 11th) can animate as one continuous slide in the swiped
// direction instead of either snapping instantly or visibly scrolling
// backward across every page in between. See screenPassport()/render()'s
// passport hook (2026-09-29, per Dan reporting wraps didn't visually scroll).
var PASSPORT_TRACK_SLOTS = PASSPORT_PAGES + 2;

// deliberately NOT tied to MISSIONS.length any more, since the whole point
// of this change is that the two can differ (half the missions, not all of
// them). 5 x 100 pts/mission = 500.
var GOLDEN_TICKET_MISSIONS_NEEDED = 5;

function badgeImgHtml(m, sizePx){
  // margin:0 auto (2026-09-29, per Dan — the Award screen's badge sat at the
  // left edge, not centered): .screen has no align-items:center of its own
  // (buttons/paragraphs rely on the flex default of stretch to go full-width),
  // so this span — a direct flex-item child there — stretches to fill the
  // full screen width; .center's text-align:center only ever centers INLINE
  // content, never a display:block element with its own explicit width like
  // this img, so margin:auto is what actually centers it within that
  // stretched span. Harmless where it was already centered another way
  // (e.g. the Passport page, whose own flex column DOES set align-items:
  // center, sizing the span down to the image's own width with nothing left
  // for margin:auto to distribute).
  return '<span style="display:inline-block;">' +
    '<img class="badge-icon" src="' + m.badgeImg + '" style="width:' + sizePx + 'px;height:' + sizePx + 'px;display:block;margin:0 auto;" ' +
      'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';">' +
    '<div class="passportBadge" style="display:none;margin:0;">' + m.icon + '</div>' +
  '</span>';
}

// The preloaded pictures used to be dropped as soon as they finished loading, so a phone was free to throw the decoded

function keepMatchTilesAlive(){

  box.style.cssText = "position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;pointer-events:none;";
  MATCH_PRELOAD.forEach(function(src){

    im.alt = ""; im.decoding = "sync"; im.src = src;
    box.appendChild(im);
  });

function preloadMatchTiles(){
  if(matchTilesPreloaded) return;
  matchTilesPreloaded = true;
  keepMatchTilesAlive();
  var remaining = MATCH_PRELOAD.length;
  function tileDone(){
    remaining--;
    if(remaining <= 0){
      matchTilesReady = true;
      if(state.screen === "faithMatch" || state.screen === "stainedGlass") render();
    }
  }
  MATCH_PRELOAD.forEach(function(src){
    var img = new Image();
    img.onload = function(){
      // .decode() actually decodes the bitmap into the browser's image cache
      // (not just fetching the bytes), which is what keeps a later fresh
      // <img> pointing at this same src from needing to redecode on paint.
      // The 1.5s fallback (2026-10-19) keeps a decode() promise that never
      // settles -- seen in a background/unpainted tab -- from leaving Faith
      // Match and the Stained-Glass Puzzle stuck on "Loading tiles..." forever;
      // the bytes have already arrived by this point.
      var finished = false;
      function once(){ if(!finished){ finished = true; tileDone(); } }
      if(img.decode) img.decode().then(once).catch(once);
      else once();
      setTimeout(once, 1500);
    };

    img.src = src;

}

// Switched from localStorage to sessionStorage (2026-09-29, per Dan) — a
// booth device reopening the same URL across separate deploys/visits kept
// resuming the previous participant's saved progress, since localStorage
// persists indefinitely for the origin regardless of which tab or visit
// wrote it. sessionStorage is scoped to the one browser tab: a genuinely
// new visit (a fresh QR scan opening its own tab) always starts clean, but
// the ORIGINAL persistence requirement — surviving the player backgrounding
// the app or taking a phone call mid-mission — still holds, since mobile
// browsers keep a backgrounded tab's sessionStorage intact and restore it
// even after the OS evicts the tab's process under memory pressure. Only
// an actual tab close (or the in-app CLEAR TICKET, unchanged) starts over.
function loadState(){
  try{
    var raw = sessionStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    var parsed = JSON.parse(raw);
    var d = defaultState();
    // shallow-merge to survive future field additions
    var merged = Object.assign(d, parsed, {
      missions: Object.assign(d.missions, parsed.missions||{}),
      session: Object.assign(d.session, parsed.session||{})
    });
    // A tab saved by an earlier build may still be on the retired Service
    // Sprint screen (replaced by Stained-Glass Puzzle, 2026-10-19).
    if(merged.screen === "serviceSprint" || merged.screen === "pathOfLight" || merged.screen === "lightWindows" || merged.screen === "joyousPhoto") merged.screen = "mainMenu";
    delete merged.photo;               // a photo saved in this tab by an older version is dropped: the app keeps no photo now
    // a tab saved before the music slider was rescaled would sound far too quiet at its old setting: it starts at the top of the new slider
    if(!parsed.musicScale){ merged.volMusic = 60; merged.musicScale = 2; }
    return merged;
  }catch(e){ return defaultState(); }
}

function saveState(){
  try{ sessionStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

// Two buses (gain nodes) per audio context: "sfx" for every sound effect and "music" for the music track. A slider position 0-100 becomes a
// gain with a squared curve, which feels even to the ear (100 = the loudness the sounds were mixed at).
// The music slider's 100% is the loudness the slider's 20% used to give (2026-10-22, per Dan), so the whole slider now lives in the useful range.
var PIX_MUSIC_MAX = 0.04;     // = 0.2 squared

    osc.connect(gain); gain.connect(pixBus(ctx, "sfx"));
    osc.start(t0); osc.stop(t0 + 0.17);
  } catch(e){}

// and the first real tap afterwards replaces it with a brand-new context created INSIDE that tap (the one way iOS always allows audio to

    // And an engine made a moment ago is not thrown away again by the other events of the same tap (pointerup, touchend and click come together): it is only
    // woken. That answers false, so the caller leaves the engine marked as not yet trusted. (The wait was 1.2 s at first, which let a second tap after waking

var pilgrimPath = PILGRIM_PATH_FULL, pilgrimSpeed = 24 / 800;   // speed: 24 picture pixels a second, as a fraction of the path

// Each finished GAME moves the pilgrim on to the next of 5 stops along the path, and the 5th is the church door (2026-10-22, per Dan; it was 1/15 of the
// way for each of 15 games). Any 5 games do it: the 6th and later don't move him, since he has gone into the church. Missions that are not games -- Choose Joy and Light a
// Candle (Be the Light, the third, was replaced by Dove of Peace 2026-10-24) -- give no points and don't move him: their ids are in PILGRIM_NON_GAMES.
var PILGRIM_GAMES_TOTAL = 5;
var PILGRIM_NON_GAMES = ["chooseJoy", "lightCandle"];      // (put back 2026-10-24 with the two missions: they are not games, so no points and no step; Hidden Blessings is a game. Light a Candle was replaced by Jacob's Ladder, a game, the same day; its id stays here so that it would stay a non-game if it came back)
function pilgrimGamesDone(){
  return MISSIONS.filter(function(m){ return PILGRIM_NON_GAMES.indexOf(m.id) === -1 && state.missions[m.id].done; }).length;
}
// Every game finished is one step (2026-10-23, per Dan: Word Trail did not move him). The steps are counted as the games are finished, so finishing a
// game again after it was cleared (the testing tap-to-clear) still moves him on, instead of being lost because he had already walked past that many
// stops. For a real player, who cannot clear a mission, steps and games done are the same number.
function pilgrimSteps(){ return Math.max(pilgrimGamesDone(), state.pilgrimSteps || 0); }
function pilgrimTarget(){ return Math.min(1, pilgrimSteps() / PILGRIM_GAMES_TOTAL); }

// The path is cropped by the bottom of the screen: start the pilgrim at the lowest point that is still fully on screen.
function pilgrimFitPath(){
  var box = document.getElementById("pixScene"), rows = SCENE_H;
  if(box && box.clientWidth) rows = box.clientHeight / (box.clientWidth / SCENE_W);
  var limit = rows - 5, i = 0;
  while(i < PILGRIM_PATH_FULL.length - 2 && PILGRIM_PATH_FULL[i][1] > limit) i++;
  pilgrimPath = PILGRIM_PATH_FULL.slice(i);
  var len = 0;
  for(var k = 1; k < pilgrimPath.length; k++) len += Math.hypot(pilgrimPath[k][0]-pilgrimPath[k-1][0], pilgrimPath[k][1]-pilgrimPath[k-1][1]);
  pilgrimSpeed = 24 / len;
}

var pilgrimPos = null;          // how far along the path the pilgrim stands right now (0 to 1)
var pilgrimFaceLeft = null;
var pilgrimRaf = 0, pilgrimBubbleTimer = 0, pilgrimStartTimer = 0, pilgrimGreetTimer = 0;
var pilgrimGreetPending = false, pilgrimMsgI = 0;

function pilgrimPoint(f){
  var n = pilgrimPath.length - 1, x = Math.max(0, Math.min(1, f)) * n, i = Math.min(n - 1, Math.floor(x)), u = x - i;
  var a = pilgrimPath[i], b = pilgrimPath[i+1];
  return {x:a[0] + (b[0]-a[0])*u, y:a[1] + (b[1]-a[1])*u, dx:b[0]-a[0]};
}

// The two sheep each wander about inside their own invisible area of the lawn (2026-10-20, per Dan): box = where their feet can go,
// in picture pixels. They walk to a random spot, stand a moment, then pick another.
var PETS = [
  {id:"petSheep1", kind:"sheepNear", w:16, h:10, speed:10, box:{x0:66, x1:114, y0:105, y1:117}},
  {id:"petSheep2", kind:"sheepFar", w:14, h:9, speed:7,  box:{x0:30, x1:58,  y0:84,  y1:91}}   // the open grass on the left, one bend up (the dog and the cat became white sheep, 2026-10-20, per Dan)
];

function petHtml(p){
  return '<div class="pixPet" id="' + p.id + '" role="button" aria-label="Sheep" data-sfx="own" onclick="petTap(\'' + p.id + '\')" style="width:' + (p.w / SCENE_W * 100) + '%;aspect-ratio:' + p.w + '/' + p.h + '"><div class="petFlip"><div class="petSprite ' + p.kind + '"></div></div></div>';
}
function petRand(a, b){ return a + Math.random() * (b - a); }
function petPlace(p, el){
  var s = petState[p.id];
  el.style.left = ((s.x - p.w / 2) / SCENE_W * 100) + "%";
  el.style.top = ((s.y - p.h + 1) / SCENE_H * 100) + "%";
  el.firstChild.classList.toggle("left", !!s.left);
}
function petsInit(){
  cancelAnimationFrame(petsRaf);
  PETS.forEach(function(p){
    var el = document.getElementById(p.id); if(!el) return;
    var s = petState[p.id];
    if(!s){
      s = petState[p.id] = {x:petRand(p.box.x0, p.box.x1), y:petRand(p.box.y0, p.box.y1), wait:petRand(0.3, 2), left:Math.random() < 0.5};
      s.tx = s.x; s.ty = s.y;
    }
    petPlace(p, el);
  });
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var last = performance.now();
  function frame(now){
    var dt = Math.min(0.1, (now - last) / 1000), alive = false;
    last = now;
    PETS.forEach(function(p){
      var el = document.getElementById(p.id), s = petState[p.id];
      if(!el || !el.isConnected || !s) return;
      alive = true;
      if(s.wait > 0){
        s.wait -= dt; el.classList.remove("walking");
        if(s.wait <= 0){ s.tx = petRand(p.box.x0, p.box.x1); s.ty = petRand(p.box.y0, p.box.y1); }
      } else {
        var dx = s.tx - s.x, dy = s.ty - s.y, dist = Math.hypot(dx, dy), step = p.speed * dt;
        if(dist <= step){ s.x = s.tx; s.y = s.ty; s.wait = petRand(1, 4); el.classList.remove("walking"); }
        else { s.x += dx / dist * step; s.y += dy / dist * step; if(Math.abs(dx) > 0.5) s.left = dx < 0; el.classList.add("walking"); }
      }
      petPlace(p, el);
    });
    if(alive) petsRaf = requestAnimationFrame(frame);
  }
  petsRaf = requestAnimationFrame(frame);
}

// Perspective (2026-10-23, per Dan): the church is far away, so the further up the path he is, the smaller he is. He is full size where he starts (the
// lowest bend on screen) and half size at the church door (where the door is only about 8 picture pixels tall), shrinking evenly with his height in the
// picture in between: the same spot always gets the same size.
var PILGRIM_FAR_SCALE = 0.5;
function pilgrimScaleAt(y){
  var near = pilgrimPath[0][1], far = pilgrimPath[pilgrimPath.length - 1][1];
  var u = near > far ? (y - far) / (near - far) : 1;
  return PILGRIM_FAR_SCALE + (1 - PILGRIM_FAR_SCALE) * Math.max(0, Math.min(1, u));
}
function pilgrimPlace(el, f, sign){
  var p = pilgrimPoint(f), sc = pilgrimScaleAt(p.y);
  el.style.width = (PILGRIM_W * sc / SCENE_W * 100) + "%";                  // the height follows (aspect-ratio), so his feet stay on the path
  el.style.left = ((p.x - PILGRIM_W * sc / 2) / SCENE_W * 100) + "%";
  el.style.top = ((p.y - (PILGRIM_H - 1) * sc) / SCENE_H * 100) + "%";
  if(Math.abs(p.dx) > 0.05){
    if(sign) pilgrimFaceLeft = (p.dx * sign < 0);
    else if(pilgrimFaceLeft === null) pilgrimFaceLeft = (p.dx < 0);
  }
  var flip = el.firstChild;
  if(flip) flip.classList.toggle("left", !!pilgrimFaceLeft);
}

// The mission he suggests is always a game that is not done yet (2026-10-23, per Dan): only games move him along the path.
function pilgrimNextGame(){
  return MISSIONS.filter(function(m){ return missionIsGame(m.id) && !state.missions[m.id].done; })[0];
}
function pilgrimMessages(){
  var list = [], left = PILGRIM_GAMES_TOTAL - pilgrimSteps();
  var next = pilgrimNextGame();
  if(goldenTicketUnlocked()) list.push(t("pilgrimTicket"));
  else if(state.points === 0) list.push(t("pilgrimStart"));
  if(next) list.push(t("pilgrimTry")(t(next.nameKey)));
  if(left > 0) list.push(t("pilgrimToGo")(left));
  list.push(t("pilgrimCheer1"), t("pilgrimCheer2"), t("pilgrimCheer3"));
  return list;
}

function pilgrimSay(text, anchor, ms){   // anchor = who is talking (the pilgrim unless told otherwise), ms = how long the bubble stays
  var scene = document.getElementById("pixSceneBox"), pil = anchor || document.getElementById("pilgrim"), b = document.getElementById("pilgrimBubble");
  if(!scene || !pil || !b) return;
  b.classList.remove("show"); b.textContent = text;
  b.style.visibility = "hidden"; b.style.display = "block";   // measure it before showing
  var sr = scene.getBoundingClientRect(), pr = pil.getBoundingClientRect(), bw = b.offsetWidth, bh = b.offsetHeight;
  var cx = pr.left + pr.width / 2 - sr.left;
  var left = Math.max(6, Math.min(sr.width - bw - 6, cx - bw / 2));
  b.style.left = left + "px";
  b.style.top = (pr.top - sr.top - bh - 12) + "px";
  b.style.setProperty("--tail", Math.max(16, Math.min(bw - 16, cx - left)) + "px");
  b.style.display = ""; b.style.visibility = "";
  void b.offsetWidth;
  b.classList.add("show");
  clearTimeout(pilgrimBubbleTimer);
  pilgrimBubbleTimer = setTimeout(pilgrimHide, ms || 5200);
}
// Tapping a sheep: a little hop and a "baaaa" bubble above it.
function petTap(id){

  pilgrimSay(t("sheepSays"), el, 2200);

function pilgrimHide(){
  clearTimeout(pilgrimBubbleTimer);

// Tapping the pilgrim: a little hop and the next thing he has to say.
function pilgrimTap(){

// After a badge is collected (2026-10-22, per Dan) the Main Menu opens with the Missions window closed, and the pilgrim first says "Great job!", then walks
// to his next spot (nothing on the screen can be tapped while he does), and on arriving he suggests a mission that is not done yet. null = not in that
// sequence; "great" = about to speak; "walk" = walking.
var pilgrimAward = null;

function pilgrimBusy(el, on){ var scr = el && el.closest(".screen"); if(scr) scr.classList.toggle("pilgrimBusy", on); }
// The 5th stop is the church door, and there he goes in (2026-10-22, per Dan): he steps up into the doorway and is gone. From then on he stays inside
// (state.pilgrimIn), and the icons can be tapped again once he is in.
function pilgrimEnter(el){
  pilgrimAward = null; pilgrimGreetPending = false; pilgrimHide();
  el.classList.remove("walking", "hop");
  void el.offsetWidth;
  el.classList.add("entering");

  pixSfxPlay("churchBell", false);                  // the church bell rings as he goes in; the next screen waits for it to finish (2026-10-26, per Dan)

    state.pilgrimIn = true; saveState();
    if(el.isConnected) el.style.visibility = "hidden";
    pixAfterSfx("churchBell", function(){
      if(el.isConnected) pilgrimBusy(el, false);

/* ---------- The church scene: the pilgrim walks up the aisle and the Golden Ticket appears ---------- */

// (2026-10-23, per Dan) After the pilgrim goes in at the church door, the Welcome screen's church interior fills the screen. He walks up the aisle, seen from
// behind and getting smaller; three quarters of the way to the altar a large pixelated Golden Ticket appears above it, with sound_effect_12. Two seconds
// later the Main Menu comes back with the Golden Ticket icon unlocked. The scene is laid over the picture in picture pixels (125 x 270), so everything

function cwPreload(){ ["tiles/pilgrim_back.png", "tiles/golden_ticket.png", "tiles/church_interior2.png"].forEach(function(src){ var im = new Image(); im.src = src; }); }

var cwRunning = false, cwRaf = 0, cwTimer = 0;

function cwStart(){
  if(cwRunning) return;
  var el = document.getElementById("cwPilgrim"), tk = document.getElementById("cwTicket"); if(!el) return;
  cwRunning = true;
  var t0 = performance.now(), shown = false;
  function place(p){
    var y = CW.yStart + (CW.yEnd - CW.yStart) * p;
    var s = CW.scaleFar + (CW.scaleNear - CW.scaleFar) * (y - CW.yEnd) / (CW.yStart - CW.yEnd);       // the further up the aisle, the smaller

function pilgrimArrived(el, walkedForward){

// Called after the Home Screen is drawn. The pilgrim stands where he was last time, then walks to the spot that matches
// the games the player has finished. If the screen is redrawn mid-walk (e.g. the folder opens) he carries on from where he is.
function pilgrimInit(isNew){
  cancelAnimationFrame(pilgrimRaf); clearTimeout(pilgrimStartTimer); clearTimeout(pilgrimGreetTimer); clearTimeout(pilgrimBubbleTimer);
  var el = document.getElementById("pilgrim"); if(!el) return;
  if(isNew) pilgrimGreetPending = true;
  pilgrimFitPath();
  petsInit();
  var target = pilgrimTarget();
  if(pilgrimPos === null) pilgrimPos = (typeof state.pilgrimP === "number") ? Math.max(0, Math.min(1, state.pilgrimP)) : target;
  // Clearing a mission (2026-10-22, per Dan) never walks him backward: he stays where he is, and only moves on once the games finished take him
  // further than that. (CLEAR TICKET starts everything over, so that one lets him walk back to the start.)
  if(!pilgrimAllowBack) target = Math.max(target, pilgrimPos);
  if(state.pilgrimIn && !pilgrimAllowBack){                // he is in the church: nothing to draw
    pilgrimPos = 1; pilgrimAward = null;
    el.style.visibility = "hidden"; el.style.pointerEvents = "none";
    return;
  }
  pilgrimPlace(el, pilgrimPos, 0);
  var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var dist = target - pilgrimPos;
  if(pilgrimAward) pilgrimBusy(el, true);                  // nothing can be tapped until he has arrived
  if(pilgrimAward === "great"){
    pilgrimGreetTimer = setTimeout(function(){ if(el.isConnected) pilgrimSay(t("pilgrimGreat"), null, 1800); }, 600);
    pilgrimStartTimer = setTimeout(function(){ if(!el.isConnected) return; pilgrimAward = "walk"; pilgrimWalk(el, target, calm); }, 2700);
    return;
  }
  pilgrimWalk(el, target, calm);
}

// A simple walking sound (2026-10-22, per Dan), softer since like footsteps in sand: a muffled "shff", a short soft burst of noise with a gentle start and a
// dark, rounded tone, every quarter of a second while he walks, a touch different from one foot to the other. It goes through the sound-effects volume.
var pilgrimLastStep = 0, pilgrimFoot = 0, pilgrimNoiseBuf = null;
function pilgrimStepSfx(now){
  if(now - pilgrimLastStep < 250) return;
  pilgrimLastStep = now;
  try {
    var ctx = pixCtx(); if(!ctx || ctx.state !== "running") return;
    if(!pilgrimNoiseBuf || pilgrimNoiseBuf.sampleRate !== ctx.sampleRate){
      var n = Math.floor(ctx.sampleRate * 0.1), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
      for(var i = 0; i < n; i++){ var x = i / n; d[i] = (Math.random() * 2 - 1) * Math.min(1, x * 9) * Math.pow(1 - x, 1.6); }     // a quick soft rise, then a long fade: no sharp click
      pilgrimNoiseBuf = b;
    }
    var t0 = ctx.currentTime, src = ctx.createBufferSource(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = pilgrimNoiseBuf; lp.type = "lowpass"; lp.Q.value = 0.3; lp.frequency.value = pilgrimFoot ? 560 : 440; pilgrimFoot ^= 1;     // dark: the sharp top of the noise is gone
    g.gain.setValueAtTime(0.42, t0);                                                                                                        // about 8 dB quieter than before
    src.connect(lp); lp.connect(g); g.connect(pixBus(ctx, "sfx")); src.start(t0);
  } catch(e){}
}

function pilgrimWalk(el, target, calm){
  var dist = target - pilgrimPos;
  if(Math.abs(dist) < 0.0005 || calm){
    pilgrimPos = target; pilgrimPlace(el, pilgrimPos, 0);
    pilgrimArrived(el, false);
    return;
  }
  var sign = dist > 0 ? 1 : -1;
  pilgrimStartTimer = setTimeout(function(){
    if(!el.isConnected) return;
    el.classList.add("walking");
    var last = performance.now();
    function step(now){
      if(!el.isConnected) return;      // redrawn: the new drawing picks the walk up from pilgrimPos
      pilgrimStepSfx(now);
      var move = pilgrimSpeed * Math.min(0.1, (now - last) / 1000); last = now;
      if(Math.abs(target - pilgrimPos) <= move){
        pilgrimPos = target; pilgrimPlace(el, pilgrimPos, sign);
        el.classList.remove("walking");
        pilgrimArrived(el, sign > 0);
        return;
      }
      pilgrimPos += sign * move; pilgrimPlace(el, pilgrimPos, sign);
      pilgrimRaf = requestAnimationFrame(step);
    }
    pilgrimRaf = requestAnimationFrame(step);
  }, 350);
}

/* ---------- Faith Flash ---------- */

// Each round asks 10 questions drawn at random from the pool (2026-10-19, per
// Dan -- the pool is now 74 questions, so asking all of them would be a very
// long round). PLAY AGAIN draws a fresh 10.
var FAITH_FLASH_ROUND_SIZE = 10;
// A game is 3 rounds of 10 (2026-10-20, per Dan): 30 different questions, none repeated, and the chances below last the WHOLE game -- they are
// not given back at the start of a round.
var FAITH_FLASH_ROUNDS = 3;
function ffRounds(s){ return Math.ceil(s.order.length / FAITH_FLASH_ROUND_SIZE); }
function ffRound(s){ return Math.floor(s.index / FAITH_FLASH_ROUND_SIZE); }
// Three chances, shown as hearts just like Faith Match (2026-10-20, per Dan): a wrong answer costs one, and the game ends when the last is gone.
var FF_CHANCES = 3;   // 3 chances for the whole game (2026-10-25, per Dan; it was 5 since 2026-10-21, before that 3, then 8)
function ffChancesLeft(s){ return typeof s.chances === "number" ? s.chances : FF_CHANCES; }

// Where the right answer sits (2026-10-23, per Dan: it must appear randomly in all three positions). A plain shuffle can leave it in the same spot
// for several questions running, so a game gets each position the same number of times, in random order, never 3 in a row. ffTargets(n) = a list of n positions (0, 1 or 2) for the n questions of a game.
function ffTargets(n){
  for(var tries = 0; tries < 200; tries++){
    var list = [];
    for(var i = 0; i < n; i++) list.push(i % 3);
    list = shuffle(list);
    var ok = true;
    for(var k = 2; k < n; k++) if(list[k] === list[k-1] && list[k] === list[k-2]){ ok = false; break; }
    if(ok) return list;
  }
  return list;
}
// answerOrder[displayed position] = which of the question's 3 answers sits there; the right one goes to `target`, the other two are shuffled
function ffAnswerOrder(q, target){
  var others = shuffle([0,1,2].filter(function(i){ return i !== q.correct; })), order = [], o = 0;
  for(var p = 0; p < 3; p++) order.push(p === target ? q.correct : others[o++]);
  return order;
}

function initFaithFlash(){
  var order = shuffle(FAITH_FLASH_QUESTIONS.map(function(_,i){return i;})).slice(0, FAITH_FLASH_ROUND_SIZE * FAITH_FLASH_ROUNDS);   // all different
  var targets = ffTargets(order.length);
  state.session.faithFlash = {order:order, index:0, correct:0, answered:null, targets:targets, answerOrder:ffAnswerOrder(FAITH_FLASH_QUESTIONS[order[0]], targets[0]),
    status:"playing", chances:FF_CHANCES, past:[]};
  saveState();
}

function ffAnswer(choiceIdx){
  var s = state.session.faithFlash;
  if(!s || s.answered !== null) return;
  var q = FAITH_FLASH_QUESTIONS[s.order[s.index]];
  var actualIdx = s.answerOrder[choiceIdx];
  s.answered = choiceIdx;
  var isCorrect = actualIdx === q.correct;
  if(!s.past) s.past = [];
  s.past[s.index] = isCorrect ? "done" : "bad";
  if(isCorrect) s.correct++;
  else s.chances = ffChancesLeft(s) - 1;
  var lastChance = !isCorrect && s.chances <= 0;
  // the same sounds as Faith Match: a match, a miss, or the last chance used
  pixSfxPlayHeld(isCorrect ? "fmMatch" : (lastChance ? "fmLast" : "fmMiss"), true);
  saveState(); render();
  // After a moment to see the answer the game moves on by itself, so the player is never asked to tap NEXT QUESTION with nothing to tap it for:
  // the results show when the last chance is lost or the last question of the game is answered, and the next round starts after the last
  // question of a round (2026-10-20, per Dan).
  var roundEnd = (s.index % FAITH_FLASH_ROUND_SIZE) === FAITH_FLASH_ROUND_SIZE - 1 || s.index >= s.order.length - 1;
  if(lastChance || roundEnd){
    var at = s.index;
    setTimeout(function(){
      var s2 = state.session.faithFlash;
      if(!s2 || s2 !== s || s2.status !== "playing" || s2.index !== at) return;   // only this game and this question: not a new one started in the meantime
      if(lastChance){ s2.status = "results"; saveState(); render(); }
      else ffRoundDone();                 // also after the last round: ROUND 3 COMPLETED! shows, and ffNext then goes on to the results (2026-10-22, per Dan)
    }, 1300);
  }
}
// The answer buttons make no button sound of their own: the answer's own sound is the one you hear.
function ffPress(){ pixPressSfx("none"); }
// An answer counts the moment the finger touches it (2026-10-22, per Dan), not when it is lifted. The click that follows is ignored (it is only used
// when a keyboard presses the button: event.detail is 0 then), so an answer can never count twice.
function ffClickAnswer(i){
  if(pixAudioStale) pixReviveOnTap();          // the first touch after coming back from another app wakes the sound engine before the answer's sound
  pixClickSfx("none"); ffAnswer(i);
}

// ROUND X COMPLETED! (2026-10-20, per Dan): the question and answers go away and one 8-bit frame says the round is done, with sound_effect_3
// (sounds/sfx_fm_fanfare.mp3, played once). After 2 seconds, if a chance has been lost, a big heart is AWARDED! in the same frame and gives one back. The next
// round starts once the fanfare is over. render() calls ffInterlude() so a reload in the middle of it picks the sequence back up.
var FF_INTERLUDE_AWARD_MS = 2000;
var ffInterludeRunning = false;
// the ROUND X COMPLETED! frame, shared by Faith Flash and Faith Match (il = {n, award}): the message, and once a chance is given back, the big heart and AWARDED!
// The ROUND X COMPLETED! sequence for the games after Faith Flash (Faith Match, Follow the Light, Stained-Glass Puzzle; 2026-10-22, per Dan). `key` is the
// game's screen name; the game keeps {n, phase, award} in session.interlude. The sound plays once; after 2 seconds giveAward(s) may hand back a chance
// (it returns true if it did, and a game with no chances passes null: the message then stays alone); finish(s) starts the next round once the sound is over.
// render() calls the game's own function again, so a reload in the middle of it picks the sequence back up.
var pixRoundRunning = {};
// ONE time for every game (2026-10-25, per Dan: the message must stay up exactly as long in each game): the ROUND X COMPLETED! message is up for ROUND_MSG_MS (the fanfare, which is 3.3 s, and a
// beat), the message before the badge screen (the last round) for ROUND_MSG_FINAL_MS (just the fanfare). They no longer follow the length of the sound file, so they are the same whether or not it
// had been decoded yet. A heart that is given back appears 2 s in (FF_INTERLUDE_AWARD_MS) and does not change the total. The badge screen has its own single time, AWARD_SHOW_MS.
var ROUND_MSG_MS = 4100, ROUND_MSG_FINAL_MS = 3350;
var ROUND_SHOW_EXTRA_MS = 500;     // the ROUND COMPLETED message, with or without the heart, stays up this much longer than the sound (2026-10-22, per Dan)
function pixRoundRun(key, getSession, giveAward, finish){
  if(pixRoundRunning[key]) return;
  var s = getSession();
  if(!s || !s.interlude || state.screen !== key) return;
  pixRoundRunning[key] = true;
  function alive(){ return getSession() === s && s.interlude && state.screen === key; }   // the player has not left
  function done(){
    pixRoundRunning[key] = false;
    if(alive()) finish(s);
  }
  if(s.interlude.phase === "award"){ setTimeout(done, 1200 + ROUND_SHOW_EXTRA_MS); return; }   // reloaded after the heart was given: just let it be seen, then go on
  var buf = pixSfxBuf.ffRound;
  // the very last ROUND COMPLETED goes to the Mission Completed screen as soon as its sound is over: no extra wait (2026-10-23, per Dan, shorter)
  var soundMs = s.interlude.final ? ROUND_MSG_FINAL_MS : ROUND_MSG_MS;
  pixSfxPlay("ffRound", false);
  setTimeout(function(){
    if(!alive()){ pixRoundRunning[key] = false; return; }
    // never on the last round (2026-10-22, per Dan): that one shows the message alone, since the mission is won
    var award = (giveAward && !s.interlude.final) ? giveAward(s) : false;
    if(award){
      s.interlude.phase = "award"; s.interlude.award = true;
      saveState(); render();
      pixSfxPlay("clCatch", false);                                // a heart is given back: sound_effect_1 (2026-10-25, per Dan)
    }
    setTimeout(done, Math.max(soundMs - FF_INTERLUDE_AWARD_MS, award ? 1200 + ROUND_SHOW_EXTRA_MS : 0));
  }, FF_INTERLUDE_AWARD_MS);
}
function pixRoundDoneHtml(il){
  return '<div class="pixRoundMid"><div class="pixPaper pixRoundDone"><div class="pixResTitle">' + t("ff_roundDone")(il.n) + '</div>' +
    (il.award ? '<img class="pixBigHeart" src="tiles/heart_full.png" alt=""><div class="pixResTitle">' + t("ff_awarded") + '</div>' : '') +
  '</div></div>';
}
function ffRoundDone(){
  var s = state.session.faithFlash;
  if(!s) return;
  s.interlude = {n: ffRound(s) + 1, phase: "msg", award: false};
  saveState(); render();
}
function ffInterlude(){
  if(ffInterludeRunning) return;
  var s = state.session.faithFlash;
  if(!s || !s.interlude || state.screen !== "faithFlash") return;
  ffInterludeRunning = true;
  function alive(){ return state.session.faithFlash === s && s.interlude && state.screen === "faithFlash"; }   // the player has not left
  function finish(){
    ffInterludeRunning = false;
    if(!alive()) return;
    s.interlude = null;
    ffNext();
  }
  if(s.interlude.phase === "award"){ setTimeout(finish, 1200 + ROUND_SHOW_EXTRA_MS); return; }   // reloaded after the heart was given: just let it be seen, then go on
  var buf = pixSfxBuf.ffRound;
  var lastRound = s.index >= s.order.length - 1;       // the last one goes to the Mission Completed screen as soon as its sound is over (2026-10-23, per Dan)
  var fanfareMs = lastRound ? ROUND_MSG_FINAL_MS : ROUND_MSG_MS;       // the same times as every other game (see ROUND_MSG_MS)
  pixSfxPlay("ffRound", false);
  setTimeout(function(){
    if(!alive()){ ffInterludeRunning = false; return; }
    var award = ffChancesLeft(s) < FF_CHANCES && s.index < s.order.length - 1;     // never after the last round (2026-10-22, per Dan)
    if(award){
      s.chances = ffChancesLeft(s) + 1;
      s.interlude.phase = "award"; s.interlude.award = true;
      saveState(); render();
      pixSfxPlay("clCatch", false);                                // a heart is given back: sound_effect_1 (2026-10-25, per Dan)
    }
    setTimeout(finish, Math.max(fanfareMs - FF_INTERLUDE_AWARD_MS, award ? 1200 + ROUND_SHOW_EXTRA_MS : 0));
  }, FF_INTERLUDE_AWARD_MS);
}

function ffNext(){
  var s = state.session.faithFlash;
  if(!s || s.answered === null) return;          // only after an answer: a second touch can never skip a question
  if(s.index >= s.order.length - 1){
    ffCollectAward();               // a win goes straight to the Mission Complete screen (2026-10-22, per Dan: no screen between)
  } else {
    s.index++; s.answered = null;
    var nq = FAITH_FLASH_QUESTIONS[s.order[s.index]];
    s.answerOrder = s.targets ? ffAnswerOrder(nq, s.targets[s.index]) : shuffle([0,1,2]);      // a game saved before the positions were balanced just shuffles
    saveState(); render();
  }
}

/* ---------- Faith Match ---------- */

function buildMatchDeck(dim){
  var pairs = (dim*dim)/2;
  // Pick a random subset of the tile pool each time instead of always the
  // first N in order — since all 3 levels now use the same 4x4 size (8
  // pairs), without this every level would show the exact same 8 tiles.
  var pool = pairs <= MATCH_SYMBOLS.length ? shuffle(MATCH_SYMBOLS).slice(0,pairs) : MATCH_SYMBOLS;
  var deck = [];
  for(var i=0;i<pairs;i++){
    var sym = pool[i % pool.length];
    deck.push(sym, sym);
  }
  deck = shuffle(deck);
  return deck.map(function(sym,id){ return {id:id, symbol:sym, matched:false}; });
}

function initFaithMatchLevel(levelIdx){
  var dim = MATCH_LEVELS[levelIdx];
  state.missions.faithMatch.level = levelIdx;
  state.session.faithMatch = {
    level: levelIdx, dim: dim, chances: MATCH_CHANCES[levelIdx], maxChances: MATCH_CHANCES[levelIdx],
    cards: buildMatchDeck(dim), flipped: [], status: "playing"
  };
  saveState();
}

// The first tile of a pair has its own sound (sound_effect_10, 2026-10-20, per Dan) in place of the button sound. The second tile has no
// button sound at all, just the match / miss sound (see fmFlip).
function fmIsFirstTile(cardId){
  var s = state.session.faithMatch;
  if(!s || s.status !== "playing" || s.levelDone || s.celebrate || s.chances <= 0 || s.flipped.length !== 0) return false;
  var c = s.cards[cardId];
  return !!c && !c.matched;
}
function fmIsSecondTile(cardId){
  var s = state.session.faithMatch;
  if(!s || s.status !== "playing" || s.levelDone || s.celebrate || s.chances <= 0 || s.flipped.length !== 1) return false;
  var c = s.cards[cardId];
  return !!c && !c.matched && s.flipped.indexOf(cardId) === -1;
}
// first tile = sound_effect_10; second tile = silent here (fmFlip plays the match / miss sound); anything else = the button sound
// A tile that is already turned over takes no tap at all (2026-10-23, per Dan): no sound (see also the CSS, which gives it no pressed glow).
function fmIsRevealed(cardId){
  var s = state.session.faithMatch, c = s && s.cards[cardId];
  return !!c && (c.matched || s.flipped.indexOf(cardId) !== -1);
}
function fmSoundFor(cardId){ return fmIsFirstTile(cardId) ? "fmFirst" : (fmIsSecondTile(cardId) || fmIsRevealed(cardId) ? "none" : null); }
// A tile turns over the moment the finger touches it, together with its sound (2026-10-22, per Dan) -- before, it waited for the finger to lift.
// The click that follows only does the work a keyboard press needs (event.detail is 0 then), or plays the tile's sound late if the sound engine
// could not start on the touch itself (a phone's first tap): the sound is remembered from the touch, so it is the one for that moment.
var fmPendingSfx;
function fmDown(cardId){
  var name = fmSoundFor(cardId);                  // chosen before the flip changes the state: first tile, second tile or neither
  fmPendingSfx = name;
  if(pixAudioStale) pixReviveOnTap();             // the first touch after coming back from another app wakes the sound engine first
  pixPressSfx(name);
  fmFlip(cardId);
}
function fmClick(cardId, ev){
  var keyboard = ev && ev.detail === 0;
  var name = (!keyboard && fmPendingSfx !== undefined) ? fmPendingSfx : fmSoundFor(cardId);
  fmPendingSfx = undefined;
  pixClickSfx(name);
  if(keyboard) fmFlip(cardId);
}

function fmFlip(cardId){
  var s = state.session.faithMatch;
  if(!s || s.status !== "playing" || s.levelDone || s.celebrate || s.chances <= 0) return;
  if(s.flipped.length >= 2) return;
  var card = s.cards[cardId];
  if(card.matched || s.flipped.indexOf(cardId) !== -1) return;
  s.flipped.push(cardId);
  if(s.flipped.length === 2){
    var a = s.cards[s.flipped[0]], b = s.cards[s.flipped[1]];
    // the second tile is tapped: a match, a miss and the last chance used each have their own sound (2026-10-20, per Dan). If this match
    // finishes the level, the level-clear sound takes over a moment later (see fmCelebrate).
    pixSfxPlay(a.symbol === b.symbol ? "fmMatch" : (s.chances <= 1 ? "fmLast" : "fmMiss"), true);   // s.chances is not lowered until the miss resolves, so 1 means this miss is the last chance
    if(a.symbol === b.symbol){
      // A correct match resolves immediately -- unlike a mismatch, there's
      // no reason to pause on it to let the player study both cards before
      // they flip back down -- so the tiles dim without delay (2026-09-30,
      // per Dan; previously both cases shared the same 650ms pause).
      fmEvaluate();
      return;
    }
  }
  saveState(); render();
  if(s.flipped.length === 2){
    setTimeout(fmEvaluate, 650);
  }
}

function fmEvaluate(){
  var s = state.session.faithMatch;
  if(!s || s.flipped.length !== 2) return;
  var a = s.cards[s.flipped[0]], b = s.cards[s.flipped[1]];
  if(a.symbol === b.symbol){
    a.matched = true; b.matched = true;
    s.flipped = [];
    var allMatched = s.cards.every(function(c){ return c.matched; });
    if(allMatched){
      // every level, the last one too (2026-10-22, per Dan: the last level was missing the flash and its fanfare), flashes the tile frames with the
      // fanfare; ROUND X COMPLETED! follows (see fmCelebrate), and after the last level the Mission Complete screen.
      s.levelDone = true;
      saveState(); render();
      fmCelebrate();
      return;
    }
  } else {
    s.flipped = [];
    s.chances--;
    if(s.chances <= 0){
      saveState(); render();
      setTimeout(function(){
        var s2 = state.session.faithMatch;
        if(!s2 || s2.status !== "playing") return;
        s2.status = "failed";
        saveState(); render();
      }, 1300);
      return;
    }
  }
  saveState(); render();
}

// ---- level clear: random glowing tile frames + the level-clear sound ----
var fmCelebrating = false;

// Glows one randomly chosen tile frame at a time (never the same one twice in a row), half a second each, then starts the
// next level. Also called from render() so a reload in the middle of it picks the sequence back up.
function fmCelebrate(){
  if(fmCelebrating) return;
  var s = state.session.faithMatch;
  if(!s || !(s.levelDone || s.celebrate)) return;
  fmCelebrating = true;
  var nextLevel = s.level + 1;
  function begin(){
    var s2 = state.session.faithMatch;
    if(!s2 || !(s2.levelDone || s2.celebrate) || state.screen !== "faithMatch"){ fmCelebrating = false; return; } // the player left
    s2.celebrate = true;
    saveState(); render();                     // every tile goes to normal brightness
    pixSfxPlay("fmFanfare", false);           // not exclusive: the tail of the match sound is allowed to finish underneath
    var step = 0, last = -1, t0 = performance.now();
    function tick(){
      var s3 = state.session.faithMatch;
      if(!s3 || !s3.celebrate || state.screen !== "faithMatch"){ fmCelebrating = false; return; }
      var cards = document.querySelectorAll(".matchGrid .matchCard");
      for(var i = 0; i < cards.length; i++) cards[i].classList.remove("glow");
      if(step >= FM_FLASH_STEPS){
        fmCelebrating = false;
        // After the flashing, ROUND X COMPLETED! shows before the next level (2026-10-22, per Dan); see fmInterlude.
        s3.levelDone = false; s3.celebrate = false;
        s3.interlude = {n: s3.level + 1, phase: "msg", award: false, next: nextLevel, final: s3.level >= MATCH_LEVELS.length - 1};
        saveState(); render();
        return;
      }
      var idx;
      do { idx = Math.floor(Math.random() * cards.length); } while(idx === last && cards.length > 1);
      last = idx;
      if(cards[idx]) cards[idx].classList.add("glow");
      step++;
      setTimeout(tick, Math.max(0, t0 + step * FM_FLASH_MS - performance.now()));
    }
    tick();
  }
  setTimeout(begin, s.celebrate ? 0 : FM_FANFARE_DELAY_MS);   // after a reload mid-celebration there is no second pause
}

// ROUND X COMPLETED! between the levels (2026-10-22, per Dan): the sound plays once and the next level starts when it is over. The message is shown
// alone, never with a chance heart (2026-10-22, per Dan): Faith Match gives every level all of its chances again, so there is nothing to give back.
// render() calls fmInterlude() so a reload in the middle of it picks the sequence back up.
function fmInterlude(){
  pixRoundRun("faithMatch", function(){ return state.session.faithMatch; },
    null,
    function(s){
      if(s.interlude.final){ s.interlude = null; fmCollectAward(); return; }       // a win goes straight to the Mission Complete screen (2026-10-22, per Dan)
      initFaithMatchLevel(s.interlude.next); render();
    });
}

function fmCollectAward(){
  var level = state.session.faithMatch.level;
  state.session.faithMatch = null;
  state.missions.faithMatch.level = 0;
  grantMission("faithMatch");
}

// A level that is not finished sends the player back to Level 1 (2026-10-20, per Dan): running out of chances, and also leaving Faith Match
// part-way through. (A page reload in the middle of a level still resumes that level, since the game is saved.)
function fmTryAgain(){
  initFaithMatchLevel(0);
  go("faithMatch");
}

function fmQuit(){ state.session.faithMatch = null; go("mainMenu"); }

// Renders `max` pixel hearts: full ones for the chances left, grey ones for the chances used. All `max` are always drawn so the
// row's width never changes as chances tick down (2026-09-29, per Dan; pixel hearts 2026-10-20).
function chancesHeartsHtml(current, max){
  var html = "";
  for(var i=0;i<max;i++){
    html += '<img src="tiles/heart_' + (i < current ? "full" : "empty") + '.png" alt="">';
  }
  return '<span class="pixHearts" role="img" aria-label="' + current + ' / ' + max + '">' + html + '</span>';
}

function screenFaithMatch(){
  if(!matchTilesReady){
    // Guaranteed brief in practice (preload starts at app boot), but this is
    // what actually prevents the blank-white-tile flash: no card can be
    // flipped until every tile image has genuinely finished loading.
    return pixShell('<div class="spacer"></div><div class="pixPaper"><div class="pixQ">' + t("fm_loading") + '</div></div><div class="spacer"></div>', "pixLower");
  }
  var s = state.session.faithMatch;
  if(!s){ initFaithMatchLevel(0); s = state.session.faithMatch; }

  if(s.status === "failed"){
    return pixResultHtml("faithMatchName", {cls:"pixLower", title:t("fm_failTitle"), body:t("fm_failBody"),
      buttons:pixBtnHtml(t("tryAgain"), "fmTryAgain()") + pixBtnHtml(t("mainMenu"), "fmQuit()", true)});
  }

  if(s.status === "complete"){
    return pixResultHtml("faithMatchName", {cls:"pixLower", title:t("fm_passTitle"), body:t("fm_passBody"), badge:"faithMatch",
      buttons:pixBtnHtml(t("collectAward"), "fmCollectAward()") + pixBtnHtml(t("mainMenu"), "fmQuit()", true)});
  }

  if(s.interlude){
    return pixShell('<h2 class="pixMTitle">' + t("faithMatchName") + '</h2>' +
      '<div class="pixChances"><span class="pixNote">' + t("chancesLeft") + '</span>' + chancesHeartsHtml(Math.max(0,s.chances), s.maxChances || MATCH_CHANCES[s.level]) + '</div>' +
      pixRoundDoneHtml(s.interlude), "pixLower");
  }

  var dim = s.dim;
  var cellsHtml = s.cards.map(function(c){
    var shown = c.matched || s.flipped.indexOf(c.id) !== -1;
    var cls = "matchCard" + (c.matched ? " matched" : (shown ? " flipped" : ""));
    // decoding="sync": render() replaces the WHOLE grid's innerHTML on every
    // flip/match, so every matchCard <img> (even an already-matched one) is a
    // brand-new DOM node each time -- if the browser's decoded-bitmap cache
    // has been evicted (common on mobile) that forces a redecode, which paints
    // one/two blank-white frames first under the default async decoding.
    // Forcing a synchronous decode removes that flash (2026-09-30, per Dan).
    var inner = shown ? '<img src="' + c.symbol + '" alt="" decoding="sync">' : "";
    return '<div class="' + cls + '" onpointerdown="fmDown(' + c.id + ')" onclick="fmClick(' + c.id + ', event)">' + inner + '</div>';
  }).join("");

  return pixShell('<h2 class="pixMTitle">' + t("faithMatchName") + '</h2>' +
    '<div class="pixNote">' + t("fm_level")(s.level+1, MATCH_LEVELS.length) + '</div>' +
    '<div class="pixChances"><span class="pixNote">' + t("chancesLeft") + '</span>' + chancesHeartsHtml(Math.max(0,s.chances), s.maxChances || MATCH_CHANCES[s.level]) + '</div>' +
    '<div class="matchGrid' + (s.celebrate ? ' celebrate' : '') + '" style="grid-template-columns:repeat(' + dim + ',1fr)">' + cellsHtml + '</div>' +
    '<div class="spacer"></div>', "pixLower");
}
