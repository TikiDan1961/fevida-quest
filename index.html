  return pixShell('<div class="pixIntroMid"><h2 class="pixMTitle pixIntroTitle">' + t("chooseJoyName") + '</h2>' +
    '<div class="pixPaper">' + pixBigTileHtml("chooseJoy") + '<p class="pixResBody pixFirst">' + t("cj_body") + '</p></div></div>' +
    pixBtnHtml(t("missionCompleted"), "cjCollectAward()"));          // no MAIN MENU button: the red X closes it (2026-10-22, per Dan)
}

/* ---------- Follow the Light ---------- */
// Simon-style pattern memory on a 3x3 grid of image tiles (redesigned
// 2026-09-30, per Dan, to mirror Faith Match's header: "Level X of X" +
// a shared "Chances left" pool of 3 across all 8 levels, instead of the
// original 4-pad/no-chances version). Tiles reuse Faith Match's own tile
// art (MATCH_SYMBOLS) rather than needing bespoke assets: each level picks
// 9 distinct images at random for the grid, then a random tap pattern of
// that level's target length. A wrong tap costs a chance and replays the
// SAME pattern from the start (not a new one) so the player can still
// memorize it; running out of chances restarts the whole run from Level 1,
// same philosophy as Catch the Light.
var FL_LEVELS = [3,4,5,6,7,8,9,10]; // pattern length per level (Level 1..8)
var FL_GRID_TILES = 9; // 3x3
var FL_MAX_MISSES = 3; // chances shared across all 8 levels
var FL_SHOW_ON_MS = 550, FL_SHOW_GAP_MS = 250; // per-tile flash / gap while playing back a pattern
var FL_PRE_SHOW_MS = 800; // "after a moment" pause before playback starts on a fresh level
var FL_TAP_FLASH_MS = 400; // how long a tile's image shows after a correct tap
var FL_WRONG_MSG_MS = 900; // how long "INCORRECT TILE!" shows before "TRY AGAIN"
var FL_RETRY_MSG_MS = 900; // how long "TRY AGAIN" shows before the pattern replays

function initFollowLightRun(){
  state.session.followLight = {level:0, chances:FL_MAX_MISSES, maxChances:FL_MAX_MISSES, status:"playing"};
  flSetupLevel(0);
}

function flSetupLevel(levelIdx){
  var s = state.session.followLight;
  var patternLen = FL_LEVELS[levelIdx];
  var pattern = FL_HYMNS[FL_LEVEL_HYMN[levelIdx % FL_LEVEL_HYMN.length]].notes.slice(0, patternLen);
  s.level = levelIdx;
  s.tiles = shuffle(MATCH_SYMBOLS).slice(0, FL_GRID_TILES);
  s.pattern = pattern;
  s.playerIndex = 0;
  s.showingIndex = -1;
  s.phase = "ready";
  saveState();
}

// Pauses on a blank grid for FL_PRE_SHOW_MS ("after a moment"), then hands
// off to flPlayPattern(). Called once right after entering a fresh level
// (openMission, flTryAgain, and flLevelComplete's own advance-to-next-level).
function flStartLevel(){
  setTimeout(function(){
    var s = state.session.followLight;
    if(!s || s.status !== "playing" || s.phase !== "ready") return;
    s.phase = "showing";
    saveState(); render();
    flPlayPattern();
  }, FL_PRE_SHOW_MS);
}

// Plays back the current level's pattern one tile at a time via its own
// setTimeout chain. Guards on s.phase==="showing" at every step so a
// quit/retry/wrong-tap mid-playback can't leave a stray timer still
// flashing tiles after the player has moved on.
function flPlayPattern(){
  var s = state.session.followLight;
  if(!s || s.phase !== "showing") return;
  var step = 0;
  function showNext(){
    var s2 = state.session.followLight;
    if(!s2 || s2.phase !== "showing") return;
    if(step >= s2.pattern.length){
      s2.showingIndex = -1;
      s2.phase = "input";
      saveState(); render();
      return;
    }
    s2.showingIndex = s2.pattern[step];
    flPlayTone(s2.pattern[step], FL_SHOW_ON_MS * 0.8);
    saveState(); render();
    setTimeout(function(){
      var s3 = state.session.followLight;
      if(!s3 || s3.phase !== "showing") return;
      s3.showingIndex = -1;
      saveState(); render();
      step++;
      setTimeout(showNext, FL_SHOW_GAP_MS);
    }, FL_SHOW_ON_MS);
  }
  showNext();
}

// Every tile has its own note (2026-10-21, per Dan): a chip-style square-wave beep, heard when the tile lights up in the pattern and again when the
// player taps it correctly. The nine notes are a major pentatonic scale (C D E G A, then up an octave), so any order of tiles sounds pleasant.
var FL_TONES = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33];     // C D E F G A B C D: tile 0 is the lowest note, tile 8 the highest
// Each level plays the first notes of a hymn (2026-10-22, per Dan): as many notes as the level's pattern is long. The seven hymns are the ones Dan
// chose; their opening notes are from the "Incipit" lists on hymnary.org (the first notes as scale degrees, with no octaves: the octaves are chosen so
// each note is the nearest one to the note before it, which is not checked against a score). Each hymn is played in its own key: `scale` holds the
// pitches (Hz) of the nine tiles for that hymn, lowest tile to highest, and a note is a tile number 0 to 8. These are copyrighted hymns (OCP, GIA):
// the client should check that eight to ten notes in a game is fine with the publishers.
var FL_HYMNS = [
  {name:"Be Not Afraid", key:"G", scale:[369.99, 392.0, 440.0, 493.88, 523.25, 587.33, 659.26, 739.99, 783.99], notes:[3, 4, 5, 5, 5, 5, 5, 5, 3, 4]},
  {name:"One Bread, One Body", key:"G", scale:[196.0, 220.0, 246.94, 261.63, 293.66, 329.63, 369.99, 392.0, 440.0], notes:[7, 7, 8, 7, 4, 4, 4, 3, 2, 0]},
  {name:"Christ, Be Our Light", key:"G", scale:[261.63, 293.66, 329.63, 369.99, 392.0, 440.0, 493.88, 523.25, 587.33], notes:[1, 4, 5, 6, 5, 4, 3, 4, 1, 1]},
  {name:"I Am the Bread of Life", key:"Ab", scale:[277.18, 311.13, 349.23, 392.0, 415.3, 466.16, 523.25, 554.37, 622.25], notes:[6, 6, 6, 4, 4, 1, 1, 1, 2, 2]},
  {name:"On Eagle's Wings", key:"D", scale:[277.18, 293.66, 329.63, 369.99, 392.0, 440.0, 493.88, 554.37, 587.33], notes:[5, 5, 5, 2, 3, 3, 5, 2, 3, 3]},
  {name:"You Are Mine", key:"Bb", scale:[261.63, 293.66, 311.13, 349.23, 392.0, 440.0, 466.16, 523.25, 587.33], notes:[1, 3, 6, 5, 4, 3, 2, 3, 1, 1]},
  {name:"Here I Am, Lord", key:"G", scale:[220.0, 246.94, 261.63, 293.66, 329.63, 369.99, 392.0, 440.0, 493.88], notes:[6, 5, 6, 3, 2, 3, 3, 6, 5, 6]}
];
// which hymn each of the 8 levels plays (the level's note count is 3, 4, 5, 6, 7, 8, 9, 10): On Eagle's Wings is heard twice, first 7 notes, then 10
var FL_LEVEL_HYMN = [0, 1, 2, 3, 4, 5, 6, 4];
// a bell: a struck note whose overtones fade at different speeds (the high ones quickly), rung an octave above the tile's note
// a chime (2026-10-24, per Dan: instead of the Follow the Light bell for a tapped bead in Pray the Beads): a high, bright struck tone that rings a second or so, a copy of it a few
// cents apart so that it shimmers, and two overtones that die away quickly
function pixChime(freq){
  try {
    if(pixAudioStale) pixReviveOnTap();
    var ctx = pixCtx(); if(!ctx) return;
    if(ctx.state !== "running" && ctx.resume) ctx.resume();
    var now = ctx.currentTime, f = freq * 4;                                   // two octaves up
    var parts = [[1, 0.15, 1.3], [1.004, 0.07, 1.1], [3.0, 0.05, 0.4], [4.2, 0.03, 0.2]];     // [pitch ratio, loudness, how long it rings in seconds]
    for(var k = 0; k < parts.length; k++){
      var osc = ctx.createOscillator(), gain = ctx.createGain(), part = parts[k];
      osc.type = "sine";
      osc.frequency.setValueAtTime(f * part[0], now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(part[1], now + 0.002);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + part[2]);
      osc.connect(gain); gain.connect(pixBus(ctx, "sfx"));
      osc.start(now); osc.stop(now + part[2] + 0.05);
    }
  } catch(e){}
}
function flPlayTone(tileIdx, ms){
  try {
    if(pixAudioStale) pixReviveOnTap();          // first tap after coming back from another app: wake the sound engine before the note
    var ctx = pixCtx(); if(!ctx) return;
    if(ctx.state !== "running" && ctx.resume) ctx.resume();
    var fs = state.session.followLight, hymn = fs ? FL_HYMNS[FL_LEVEL_HYMN[(fs.level || 0) % FL_LEVEL_HYMN.length]] : null;
    var now = ctx.currentTime, f = (hymn ? hymn.scale[tileIdx % hymn.scale.length] : FL_TONES[tileIdx % FL_TONES.length]) * 2;   // an octave up
    var parts = [[1, 0.18, 1.7], [2.0, 0.08, 1.1], [2.76, 0.06, 0.65], [4.07, 0.03, 0.4], [5.43, 0.02, 0.25]];   // [pitch ratio, loudness, how long it rings in seconds]
    for(var k = 0; k < parts.length; k++){
      var osc = ctx.createOscillator(), gain = ctx.createGain(), part = parts[k];
      osc.type = "sine";
      osc.frequency.setValueAtTime(f * part[0], now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(part[1], now + 0.004);                 // the strike
      gain.gain.exponentialRampToValueAtTime(0.0001, now + part[2]);           // the ring fading away
      osc.connect(gain); gain.connect(pixBus(ctx, "sfx"));
      osc.start(now); osc.stop(now + part[2] + 0.05);
    }
  } catch(e){}
}

function flTileTap(tileIdx){
  var s = state.session.followLight;
  if(!s || s.phase !== "input") return;
  if(tileIdx !== s.pattern[s.playerIndex]){ flWrongTap(); return; }
  flPlayTone(tileIdx, 320);
  // The step is counted at once. (Before, it was counted when the tile's flash ended, 0.4 s later, so a quick second tap was compared with the
  // note that had just been played and counted as a miss: 2026-10-22, per Dan.)
  s.playerIndex++;
  var done = s.playerIndex >= s.pattern.length;
  s.showingIndex = tileIdx;
  s.tapStamp = (s.tapStamp || 0) + 1;
  var stamp = s.tapStamp;
  if(done) s.phase = "tapped";                      // no more taps while the last tile flashes
  saveState(); render();
  setTimeout(function(){
    var s2 = state.session.followLight;
    if(!s2 || s2.status !== "playing") return;
    if(done){ flLevelComplete(); return; }
    if(s2.tapStamp === stamp && s2.phase === "input"){ s2.showingIndex = -1; saveState(); render(); }   // only the latest tap puts the light out
  }, FL_TAP_FLASH_MS);
}

// REPEAT (2026-10-22, per Dan): plays the current pattern again, from its first note, whenever the player is waiting to tap. It is free and has no
// limit; a tap sequence begun before it starts over from the first note.
function flReplay(){
  var s = state.session.followLight;
  if(!s || s.status !== "playing" || s.phase !== "input") return;
  s.phase = "showing"; s.playerIndex = 0; s.showingIndex = -1;
  saveState(); render();
  flPlayPattern();
}

function flWrongTap(){
  var s = state.session.followLight;
  s.chances--;
  s.showingIndex = -1;
  flPlayFailSound();
  if(s.chances <= 0){
    s.status = "failed";
    saveState(); render();
    return;
  }
  s.phase = "wrong";
  saveState(); render();
  setTimeout(function(){
    var s2 = state.session.followLight;
    if(!s2 || s2.status !== "playing") return;
    s2.phase = "retry";
    s2.playerIndex = 0;
    saveState(); render();
    setTimeout(function(){
      var s3 = state.session.followLight;
      if(!s3 || s3.status !== "playing" || s3.phase !== "retry") return;
      s3.phase = "showing";
      saveState(); render();
      flPlayPattern();
    }, FL_RETRY_MSG_MS);
  }, FL_WRONG_MSG_MS);
}

function flLevelComplete(){
  var s = state.session.followLight;
  s.showingIndex = -1;
  // After the last tile has flashed, ROUND X COMPLETED! shows before the next level, and before the results after the last one (2026-10-22, per Dan);
  // see flInterlude.
  s.phase = "levelComplete";
  s.interlude = {n: s.level + 1, phase: "msg", award: false, next: s.level + 1, final: s.level >= FL_LEVELS.length - 1};
  saveState(); render();
}
// the round-complete screen: a chance used so far is AWARDED! back (the chances are shared by all the levels)
function flInterlude(){
  pixRoundRun("followLight", function(){ return state.session.followLight; },
    function(s){ if(s.chances < s.maxChances){ s.chances++; return true; } return false; },
    function(s){
      var next = s.interlude.next, last = s.interlude.final;
      s.interlude = null;
      if(last){ flCollectAward(); return; }       // a win goes straight to the Mission Complete screen (2026-10-22, per Dan)
      flSetupLevel(next); render(); flStartLevel();
    });
}

// Simple Web Audio beep for a wrong tap — this app has no sound-asset
// pipeline elsewhere, so a synthesized tone avoids needing a bespoke audio
// file. The AudioContext is created lazily (browsers block it until a user
// gesture) and reused rather than rebuilt on every wrong tap.
function flPlayFailSound(){
  try {
    var ctx = pixCtx(); if(!ctx) return;
    if(ctx.state !== "running" && ctx.resume) ctx.resume();
    var osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(220, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.connect(gain); gain.connect(pixBus(ctx, "sfx"));
    osc.start(); osc.stop(ctx.currentTime + 0.3);
  } catch(e){}
}

function flCollectAward(){ state.session.followLight = null; grantMission("followLight"); }
// Running out of chances restarts the whole 8-level run from Level 1 (same
// convention as Catch the Light's clTryAgain), not just the failed level.
function flTryAgain(){ initFollowLightRun(); go("followLight"); flStartLevel(); }
function flQuit(){ state.session.followLight = null; go("mainMenu"); }

function screenFollowLight(){
  var s = state.session.followLight;
  if(!s){ initFollowLightRun(); s = state.session.followLight; flStartLevel(); }

  if(s.status === "failed"){
    return pixResultHtml("followLightName", {cls:"pixLower", title:t("fl_failTitle"), body:t("fl_failBody"),
      buttons:pixBtnHtml(t("tryAgain"), "flTryAgain()") + pixBtnHtml(t("mainMenu"), "flQuit()", true)});
  }
  if(s.status === "complete"){
    return pixResultHtml("followLightName", {cls:"pixLower", title:t("fl_passTitle"), body:t("fl_passBody"), badge:"followLight",
      buttons:pixBtnHtml(t("collectAward"), "flCollectAward()") + pixBtnHtml(t("mainMenu"), "flQuit()", true)});
  }

  if(s.interlude){
    return pixShell('<h2 class="pixMTitle">' + t("followLightName") + '</h2>' +
      '<div class="pixChances"><span class="pixNote">' + t("chancesLeft") + '</span>' + chancesHeartsHtml(Math.max(0,s.chances), s.maxChances) + '</div>' +
      pixRoundDoneHtml(s.interlude), "pixLower");
  }

  var msg = "", msgCls = "pixNote flMsg";
  if(s.phase === "input") msg = t("fl_repeat");
  else if(s.phase === "wrong"){ msg = t("fl_incorrect"); msgCls += " bad"; }
  else if(s.phase === "retry") msg = t("fl_tryAgainMsg");

  var tilesHtml = s.tiles.map(function(src, i){
    var lit = s.showingIndex === i;
    var cls = "flPad" + (lit ? " lit" : "") + (s.phase !== "input" ? " disabled" : "");
    var inner = lit ? '<img src="' + src + '" alt="" decoding="sync">' : "";
    return '<div class="' + cls + '" data-sfx="own" onpointerdown="flTileTap(' + i + ')">' + inner + '</div>';
  }).join("");

  return pixShell('<h2 class="pixMTitle">' + t("followLightName") + '</h2>' +
    '<div class="pixNote">' + t("fm_level")(s.level+1, FL_LEVELS.length) + '</div>' +
    '<div class="pixChances"><span class="pixNote">' + t("chancesLeft") + '</span>' + chancesHeartsHtml(Math.max(0,s.chances), s.maxChances) + '</div>' +
    '<div class="flGrid">' + tilesHtml + '</div>' +
    '<p class="' + msgCls + '">' + msg + '</p>' +
    '<div class="spacer"></div>' +
    (s.phase === "input" ? pixBtnHtml(t("fl_replay"), "flReplay()") : '<button class="btn pixBtn pixBtnSm" disabled>' + t("fl_replay") + '</button>'), "pixLower");   // only while the player is to tap; the greyed button keeps the screen from jumping. Lowered like Faith Flash (2026-10-21, per Dan)
}

/* ---------- Word Unscramble ---------- */
// Curated per-language word lists (not literal translations of each other —
// picked separately so both feel like natural, similarly-simple faith words
// rather than forcing an EN word's exact meaning into an awkward ES fit).
// TODO(Dan): swap in different/NCYC-specific words any time — nothing else
// needs to change.
// Three levels of 5 words (2026-10-21, per Dan): level 1 has 4-letter words, level 2 has 5-letter words and level 3 has 6-letter words. No
// accented letters, so every letter tile is a plain letter -- except AMÉN, which the client spelled with its accent (2026-10-23): its É is a tile of its own, and
// Word Trail (which uses these same words) shows it in its grid.
// Each level has 15 words and a game plays 5 of them, picked at random (2026-10-23, per Dan). The words are chosen so that no one of them can be
// rearranged into a different common word (a word is only right when it is spelled exactly the same).
var WU_LEVELS = 3;
var WU_WORDS_PER_LEVEL = 5;
var WORD_UNSCRAMBLE_WORDS = {
  en: [["HOPE","LOVE","PRAY","HOLY","SOUL","MASS","GIFT","KING","LAMB","LENT","LORD","WORD","HYMN","JOHN","LUKE"],
       ["GRACE","MERCY","FAITH","TRUST","PEACE","CROSS","LIGHT","JESUS","PSALM","BIBLE","WATER","BLESS","SHEEP","CROWN","OLIVE"],
       ["SPIRIT","PRAYER","GOSPEL","HEAVEN","CHURCH","CANDLE","TEMPLE","SAVIOR","PRAISE","BISHOP","ROSARY","SERMON","ADVENT","JOSEPH","CHOSEN"]],
  es: [["AMOR","CRUZ","VIDA","DIOS","ALMA","HIJO","MISA","PAPA","REZO","AMÉN","ORAR","VINO","ROSA","CORO","BODA"],
       ["CIELO","SANTO","ALTAR","FELIZ","PADRE","REINO","TRIGO","FUEGO","CANTO","PALMA","OVEJA","SALMO","MUNDO","VERBO","JUSTO"],
       ["GRACIA","CRISTO","BIBLIA","VIRGEN","ALABAR","TIERRA","PUERTA","PASTOR","CORONA","PECADO","PASCUA","CAMINO","SALVAR","TEMPLO","GLORIA"]]
};
// which 5 of a level's words a game plays, in the order they come
function wuPickOrder(lang, level){
  return shuffle(WORD_UNSCRAMBLE_WORDS[lang][level].map(function(_,i){return i;})).slice(0, WU_WORDS_PER_LEVEL);
}

function wuScrambleWord(word){
  var letters = word.split("");
  var scrambled;
  do { scrambled = shuffle(letters); } while(scrambled.join("") === word && letters.length > 1);
  return scrambled;
}

function wuSetupWord(s){
  var lang = state.lang || "en";
  var word = WORD_UNSCRAMBLE_WORDS[lang][s.level || 0][s.order[s.index]];
  s.word = word;
  s.letters = wuScrambleWord(word);
  s.slots = [];                       // slots[i] = which letter tile sits in square i, or null
  for(var i = 0; i < word.length; i++) s.slots.push(null);
  s.hinted = [];                      // squares filled by a hint: they are right, and they stay
  s.feedback = null; // "correct" | "wrong" | null, transient
}

// 3 hints on every level (2026-10-21, per Dan): a hint puts one correct letter into its own square and locks it there.
var WU_HINTS = 3;
// 3 skips in the whole game (2026-10-21, per Dan): SKIP moves on to the next word without solving this one. A skipped word shows as a red square.
var WU_SKIPS = 3;

function initWordUnscramble(){
  var lang = state.lang || "en";
  var order = wuPickOrder(lang, 0);
  var s = {level:0, order:order, index:0, hints:WU_HINTS, skips:WU_SKIPS, past:[], status:"playing"};
  wuSetupWord(s);
  state.session.wordUnscramble = s;
  saveState();
}
// a game saved by an earlier build has a list of picked letters instead of squares: turn it into squares
function wuEnsure(s){
  if(!s || Array.isArray(s.slots)) return;
  s.slots = [];
  for(var i = 0; i < s.word.length; i++) s.slots.push(s.picked && i < s.picked.length ? s.picked[i] : null);
  s.hinted = [];
  if(typeof s.hints !== "number") s.hints = WU_HINTS;
}
// a game saved before skips existed gets its 3 skips
function wuEnsureSkips(s){
  if(typeof s.skips !== "number") s.skips = WU_SKIPS;
  if(!Array.isArray(s.past)) s.past = [];
}
function wuFirstEmpty(s){
  for(var i = 0; i < s.slots.length; i++) if(s.slots[i] === null) return i;
  return -1;
}

// No fail state, per spec — this is a puzzle, not a knowledge/reflex test.
// A wrong full attempt just shakes and clears for another try (letters placed by a hint stay).
function wuPick(letterPos){
  var s = state.session.wordUnscramble;
  if(!s || s.feedback) return;
  wuEnsure(s);
  if(s.slots.indexOf(letterPos) !== -1) return;
  var e = wuFirstEmpty(s);
  if(e < 0) return;
  s.slots[e] = letterPos;
  if(wuFirstEmpty(s) < 0) wuCheck(s); else { saveState(); render(); }
}
// tapping a letter that has been placed sends it back to the row of letters (not one placed by a hint)
function wuUnplace(i){
  var s = state.session.wordUnscramble;
  if(!s || s.feedback) return;
  wuEnsure(s);
  if(s.slots[i] === null || s.hinted.indexOf(i) !== -1) return;
  s.slots[i] = null;
  saveState(); render();
}
function wuHint(){
  var s = state.session.wordUnscramble;
  if(!s || s.feedback || s.status !== "playing") return;
  wuEnsure(s);
  if(s.hints <= 0) return;
  var k = -1, i, p;
  for(i = 0; i < s.word.length; i++){
    if(s.hinted.indexOf(i) === -1 && (s.slots[i] === null || s.letters[s.slots[i]] !== s.word.charAt(i))){ k = i; break; }   // the first square that is not right yet
  }
  if(k < 0) return;
  var ch = s.word.charAt(k), pos = -1;
  s.slots[k] = null;                                                  // a wrong letter in that square goes back to the row
  for(p = 0; p < s.letters.length && pos < 0; p++) if(s.letters[p] === ch && s.slots.indexOf(p) === -1) pos = p;
  for(p = 0; p < s.letters.length && pos < 0; p++){                  // otherwise take that letter from another square it was wrongly sitting in
    if(s.letters[p] !== ch) continue;
    var j = s.slots.indexOf(p);
    if(j !== -1 && s.hinted.indexOf(j) === -1){ s.slots[j] = null; pos = p; }
  }
  if(pos < 0) return;
  s.slots[k] = pos; s.hinted.push(k); s.hints--;
  if(wuFirstEmpty(s) < 0) wuCheck(s); else { saveState(); render(); }
}
function wuAdvance(s2){
  if(s2.index >= s2.order.length - 1){
    // ROUND X COMPLETED! (the message alone: no chances here) before the next level, and before the results after the last one (2026-10-22, per Dan)
    s2.interlude = {n: (s2.level || 0) + 1, phase: "msg", award: false, final: (s2.level || 0) >= WU_LEVELS - 1};
    saveState(); render();
  } else {
    s2.index++;
    wuSetupWord(s2);
    saveState(); render();
  }
}
function wuInterlude(){

    if(s2.interlude.final){ s2.interlude = null; wuCollectAward(); return; }       // a win goes straight to the Mission Complete screen (2026-10-22, per Dan)
    s2.interlude = null;

function wuSkip(){
  var s = state.session.wordUnscramble;
  if(!s || s.feedback || s.status !== "playing") return;
  wuEnsure(s); wuEnsureSkips(s);
  if(s.skips <= 0) return;
  s.skips--; s.past[s.index] = "bad";
  wuAdvance(s);
}
var WU_SFX_EARLY_MS = 200;
// every square is full: right, and on to the next word; wrong, and the squares clear for another try
function wuCheck(s){
  var guess = s.slots.map(function(pos){ return s.letters[pos]; }).join("");
  // The word's sound (right = sound_effect_6, wrong = the SKIP sound) waits until the last letter's own sound has finished (2026-10-23, per Dan).
  // The letter sound's last 0.2 s is only a faint tail, so the word sound comes in a little early (the gap was too long, 2026-10-23, per Dan).
  var wait = pixSfxWait("fmFirst", WU_SFX_EARLY_MS);
  if(guess === s.word){
    s.feedback = "correct";
    pixAfterSfx("fmFirst", function(){ pixSfxPlay("fmMatch", true); }, WU_SFX_EARLY_MS);
    saveState(); render();
    wuEnsureSkips(s); s.past[s.index] = "done";
    setTimeout(function(){
      var s2 = state.session.wordUnscramble;
      if(!s2) return;
      wuAdvance(s2);
    }, 900 + wait);
  } else {
    s.feedback = "wrong";
    pixAfterSfx("fmFirst", function(){ pixSfxPlay("clFade", true); }, WU_SFX_EARLY_MS);
    saveState(); render();
    setTimeout(function(){
      var s2 = state.session.wordUnscramble;
      if(!s2) return;
      for(var i = 0; i < s2.slots.length; i++) if(s2.hinted.indexOf(i) === -1) s2.slots[i] = null;
      s2.feedback = null;
      saveState(); render();
    }, 900 + wait);
  }
}

function wuClear(){
  var s = state.session.wordUnscramble;
  if(!s || s.feedback) return;
  wuEnsure(s);
  for(var i = 0; i < s.slots.length; i++) if(s.hinted.indexOf(i) === -1) s.slots[i] = null;
  saveState(); render();
}

/* ---------- Catch the Light ---------- */
// Redesigned 2026-09-29, per Dan, modeled on the Atari 2600 game Kaboom! —
// a pair of open hands (🤲, palms up) sits at the bottom of the stage and
// the player drags them left/right (a pointerdown anywhere on the stage
// jumps the hands there; dragging keeps following the pointer, like an
// analog paddle controller) to catch falling lights (✨) before they pass
// the hands. A light that gets past uncaught costs one of 3 chances SHARED
// across all 4 levels (not reset per level) — run out at any point and the
// whole thing restarts from Level 1. Clearing Level 4 with a chance still
// in hand completes the mission. Levels only raise the count and fall
// speed, per Dan's spec:
// The lights fall faster in every level (2026-10-22, per Dan): 3200 / 2700 / 2300 / 2000 ms before, and the play area is shorter now.
// 8 rounds (2026-10-22, per Dan; it was 4 of 20 / 30 / 40 / 50 lights): each one is a little shorter than the old ones and falls faster than the last.
// Every fall is 50% faster (2026-10-22, per Dan): the times were 2200 / 2000 / 1850 / 1700 / 1600 / 1500 / 1400 / 1300 ms, now each divided by 1.5.
// count = the lights in the round: 10 in round 1, 5 more each round (2026-10-22, per Dan; it was 20, 30 ... 90).
// spawnMs = the wait between one light and the next, shrinking each round (700 to 350 ms before; 450 to 150 ms since, 2026-10-22, per Dan).
var CL_LEVELS = [
  {count:10, fallMs:1467, spawnMs:450},
  {count:15, fallMs:1333, spawnMs:410},
  {count:20, fallMs:1233, spawnMs:360},
  {count:25, fallMs:1133, spawnMs:320},
  {count:30, fallMs:1067, spawnMs:280},
  {count:35, fallMs:1000, spawnMs:240},
  {count:40, fallMs:933, spawnMs:190},
  {count:45, fallMs:867, spawnMs:150}       // (a 9th and 10th round, 50 and 55 lights, were added and taken out again the same day, 2026-10-22, per Dan)
];
// Each round falls 8% faster than the one before, round 1 staying as it was (2026-10-22, per Dan): a speed 1.08 times the last is a fall time of the last
// divided by 1.08, so the fallMs values above are replaced by this rule (they were 1467 / 1333 / 1233 / 1133 / 1067 / 1000 / 933 / 867).
var CL_FIRST_FALL_MS = 1467, CL_SPEED_STEP = 1.08;
CL_LEVELS.forEach(function(lv, i){ lv.fallMs = Math.round(CL_FIRST_FALL_MS / Math.pow(CL_SPEED_STEP, i)); });
// Where a light starts (2026-10-22, per Dan): the first one anywhere, then each one CL_STEP_PX to the left or right of the one before. A side is picked at
// random together with a random number of lights, CL_RUN_MIN to CL_RUN_MAX, to drop that way before a side is picked again; when an edge is hit it heads
// back toward the middle (carrying on that way for the rest of the run), and next to an edge a new pick is always toward the middle.
var CL_STEP_PX = 80;
var CL_RUN_MIN = 1, CL_RUN_MAX = 4;   // lights dropped in one direction before a new direction is picked
var clLastX = null, clDir = 1, clDirLeft = 0;
var CL_MAX_MISSES = 5;       // chances for the whole game (5 since 2026-10-22, per Dan; it was 3)
var CL_TICK_MS = 50, CL_ICON = "✨", CL_HAND_EMOJI = "🤲";
// The GET READY countdown screen is gone (2026-10-22, per Dan): the game has its instruction screen, and a level starts as soon as it is opened.
// Brief hold on the cleared stage after the last light of a level is caught, before ROUND X COMPLETED! shows.
var CL_LEVEL_PAUSE_MS = 900;
// A light that touches the bottom edge is a miss (2026-10-22, per Dan). Everything stops, the lights on the screen fade away one at a time from the
// lowest to the highest (one every CL_FADE_STEP_MS, each taking CL_FADE_MS, each with a sound), then the chance is taken, and after a beat the level restarts.
var CL_FADE_STEP_MS = 250, CL_FADE_MS = 250, CL_RESTART_BEAT_MS = 600, CL_ICON_H = 32;   // 500 / 350 / 800 before: the whole sequence runs about twice as fast (2026-10-22, per Dan)
var clFading = false;       // true from the miss until the level restarts

// Unlike every other mission, this one runs a CONTINUOUS animation loop
// (falling icons + the hands following the player's finger), which doesn't
// mix well with this app's normal "re-render the whole screen from state"
// pattern — a mid-round render() would wipe out every in-flight falling
// icon (and its own timers) along with everything else. So while a round is
// "playing", the falling icons, the hands' position, and the HUD are all
// updated via DIRECT DOM writes, completely bypassing render() — the normal
// render() pipeline only runs again once the round actually ends
// (clEndRound) or completes a level (still mid-round, but only touches the
// HUD text, not a full re-render).
var clRunning = false; // true only while the spawn/tick intervals are live
var clWaiting = true;  // a round does not start until the player taps the screen (2026-10-25, per Dan), as in Dove of Peace and Pray the Beads
var clTimers = {spawn:null, tick:null, falls:[]};
var clActiveIcons = []; // {el, resolved} for every light currently in flight
var clHandX = 0; // current hand center, in px relative to the stage
var clDragging = false;

function initCatchLight(){
  clDragging = false; clWaiting = true;
  state.session.catchLight = {level:0, spawnedInLevel:0, resolvedInLevel:0, caughtInLevel:0, misses:0, status:"playing", phase:"playing"};
  saveState();
}

function clClearTimers(){
  clFading = false;
  if(clTimers.spawn) clearInterval(clTimers.spawn);
  if(clTimers.tick) clearInterval(clTimers.tick);
  clTimers.falls.forEach(function(id){ clearTimeout(id); });
  clTimers.spawn = null; clTimers.tick = null; clTimers.falls = [];
  clRunning = false;
  clActiveIcons.forEach(function(r){ if(r.anim) r.anim.cancel(); });
  clActiveIcons = [];
  // (clDragging is not reset here: a finger still held on the screen carries on steering the hands in the next round, see clWinMove)
}

// The SLIDE band is taller (90 px, 76 on short phones: 2026-10-26, per Dan) and sits exactly halfway between the bottom of the play area and the bottom of the screen: the margins under it are
// worked out by measuring, as for the buttons of Pray the Beads and Jacob's Ladder. (The play area is the part of the screen that gives way.)
var CL_SLIDE_GAP = 24;      // px above the band, and so also below it
function clFit(){
  var stage = document.getElementById("clStage"), zone = document.getElementById("clSlide"), band = zone && zone.querySelector(".clSlide");
  if(!stage || !band) return;
  var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  zone.style.marginTop = (CL_SLIDE_GAP - 18) + "px"; zone.style.marginBottom = "";            // (the stage's 8 px margin and the zone's 10 px padding make the 18)
  var mb = parseFloat(getComputedStyle(zone).marginBottom) || 0;
  for(var pass = 0; pass < 4; pass++){
    var st = stage.getBoundingClientRect(), bd = band.getBoundingClientRect(), above = bd.top - st.bottom, below = vh - bd.bottom, diff = above - below;
    if(Math.abs(diff) < .5) break;
    mb += diff; zone.style.marginBottom = mb + "px";
  }
}
window.addEventListener("resize", function(){ if(state.screen === "catchLight") clFit(); });
function clUpdateHud(){
  var s = state.session.catchLight;
  if(!s) return;
  var levelEl = document.getElementById("clLevel");
  var scoreEl = document.getElementById("clScore");
  var heartsEl = document.getElementById("clHearts");
  var levelCfg = CL_LEVELS[s.level];
  if(levelEl) levelEl.textContent = t("cl_level")(s.level+1, CL_LEVELS.length);
  if(scoreEl) scoreEl.textContent = t("cl_caught")(s.caughtInLevel, levelCfg.count);
  if(heartsEl) heartsEl.innerHTML = chancesHeartsHtml(Math.max(0, CL_MAX_MISSES - s.misses), CL_MAX_MISSES);
}

function clUpdateHandPosition(){
  var hands = document.getElementById("clHands");
  if(hands) hands.style.left = clHandX + "px";
}

var CL_HANDS_HALF = 39;   // half the width of the hands picture: they stay fully inside the play area
function clMoveHandTo(clientX){
  var field = document.getElementById("clField");
  if(!field) return;
  var rect = field.getBoundingClientRect();
  clHandX = Math.max(CL_HANDS_HALF, Math.min(rect.width - CL_HANDS_HALF, clientX - rect.left));
  clUpdateHandPosition();
}

// The finger slides on the SLIDE band under the play area (2026-10-22, per Dan), not on the play area itself.
// A slide has to START in the tap zone (from 10 px above the band to the bottom of the screen), but once it has started the hands follow the finger
// wherever it goes (2026-10-22, per Dan: the finger is no longer kept inside the band; it was, earlier the same day).
function clInBand(ev){
  var band = document.getElementById("clSlide");
  if(!band) return false;
  var r = band.getBoundingClientRect();     // the zone: from 10 px above the band's picture, and on down to the bottom of the screen (2026-10-22, per Dan)
  return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= window.innerHeight;
}
function clPointerDown(ev){
  var s = state.session.catchLight;
  if(!s || s.status !== "playing" || clFading) return;      // nothing moves while the lights fade away after a miss
  if(!clInBand(ev)) return;
  if(pixAudioStale) pixReviveOnTap();          // back from another app: the sound engine is woken by the first touch of the slide, not only when the finger lifts
  clDragging = true; clPtrId = ev.pointerId; clPtrX = ev.clientX;
  try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch(e){}     // keeps following the finger (or mouse) after it leaves the zone
  clMoveHandTo(ev.clientX);
}
// The finger is followed by listeners on the whole window, not by the band: a round ends with the screen being redrawn (ROUND COMPLETED, then the next
// round), which removes the band the finger went down on, and the player used to have to lift the finger and touch again (2026-10-22, per Dan). Now a
// finger that is still down carries on steering the hands in the next round, from wherever it is.
var clPtrId = null, clPtrX = 0;
function clWinMove(ev){
  if(!clDragging || ev.pointerId !== clPtrId) return;
  if(ev.pointerType === "mouse" && ev.buttons === 0){ clDragging = false; return; }       // a mouse button let go somewhere we did not hear about
  clPtrX = ev.clientX;
  if(!clFading && state.screen === "catchLight") clMoveHandTo(ev.clientX);
}
function clWinUp(ev){
  if(ev.pointerId !== clPtrId) return;
  clDragging = false; clPtrId = null;
}
window.addEventListener("pointermove", clWinMove, true);
window.addEventListener("pointerup", clWinUp, true);
window.addEventListener("pointercancel", clWinUp, true);

function clSpawnIcon(){
  var stage = document.getElementById("clField");
  var s = state.session.catchLight;
  if(!stage || !s || s.status !== "playing" || clFading) return;
  var levelCfg = CL_LEVELS[s.level];
  if(s.spawnedInLevel >= levelCfg.count) return; // this level's full quota is already in flight or resolved — just waiting on the rest
  s.spawnedInLevel++;
  saveState();
  var el = document.createElement("div");
  el.className = "clIcon";
  var stageW = stage.clientWidth, minX = 4, maxX = Math.max(minX, stageW - CL_ICON_H - 4), x;
  if(clLastX === null) x = minX + Math.random() * (maxX - minX);
  else {
    // a direction is picked at random, then kept for a random 1 to 4 lights before a new one is picked (2026-10-22, per Dan)
    if(clDirLeft <= 0){
      var canLeft = clLastX - CL_STEP_PX >= minX, canRight = clLastX + CL_STEP_PX <= maxX;     // next to an edge the pick is always the way back to the middle
      clDir = (canLeft && canRight) ? (Math.random() < 0.5 ? -1 : 1) : (canLeft ? -1 : 1);
      clDirLeft = CL_RUN_MIN + Math.floor(Math.random() * (CL_RUN_MAX - CL_RUN_MIN + 1));    // how many lights go that way: 1 to 4
    }
    x = clLastX + clDir * CL_STEP_PX;
    if(x < minX || x > maxX){                                      // the edge is hit: head back toward the middle (and carry on that way for the rest of the run)
      clDir = -clDir; x = clLastX + clDir * CL_STEP_PX;
    }
    x = Math.max(minX, Math.min(maxX, x));
    clDirLeft--;
  }
  clLastX = x;
  el.style.left = Math.round(x) + "px";
  // The light is placed at the top of the play area and slid down with a transform (2026-10-22, per Dan: moving `top` made the lights shake up and down as
  // they fell, since every frame had to re-lay-out the page; a transform is moved by the graphics card). It starts just above the area, which clips it:
  // a light slides in from the top edge instead of crossing the frame.
  el.style.top = "0px";
  el.style.transform = "translateY(-36px)";
  el.style.willChange = "transform";
  stage.appendChild(el);
  var stageH = stage.clientHeight;
  // The light falls until its bottom edge touches the bottom edge of the play area (the top of the yellow border there): that is a miss. It keeps the
  // speed it had when it fell right off the area (fieldH + 40 px in fallMs).
  var endTop = stageH - CL_ICON_H;
  var fallTime = Math.round(levelCfg.fallMs * (endTop + 36) / (stageH + 40));
  var record = {el:el, resolved:false};
  // an animation (not a CSS transition) so a miss can stop every light exactly where it is with pause()
  record.anim = el.animate([{transform:"translateY(-36px)"}, {transform:"translateY(" + endTop + "px)"}], {duration:fallTime, easing:"linear", fill:"forwards"});
  clActiveIcons.push(record);
  // If it's never caught by clCollisionTick, its own fall timer calls it a miss the moment it has reached the bottom.
  var fallId = setTimeout(function(){ clResolveIcon(record, false); }, fallTime + 10);
  clTimers.falls.push(fallId);
}

function clResolveIcon(record, caught){
  if(record.resolved || clFading) return;
  var s = state.session.catchLight;
  if(!s || s.status !== "playing") return;
  if(!caught && clTouchesHands(record)) caught = true;       // it reached the bottom in the very moment it touched the hands: still a catch
  if(!caught){ clStartMiss(); return; }
  record.resolved = true;
  if(record.anim) record.anim.cancel();
  if(record.el.parentNode) record.el.parentNode.removeChild(record.el);
  var idx = clActiveIcons.indexOf(record);
  if(idx !== -1) clActiveIcons.splice(idx, 1);
  pixSfxPlay("clCatch", false);                                // sound_effect_1 when the hands catch a light
  s.resolvedInLevel++; s.caughtInLevel++;
  saveState();
  clUpdateHud();
  clCheckLevelComplete();
}

// A miss: everything freezes where it is, each light on the screen fades away one at a time from the lowest (the one that was missed) to the highest,
// with sound_effect_2 for each. Only when the last has gone is the chance heart taken; after a beat the level starts over.
function clStartMiss(){
  var s = state.session.catchLight;
  if(!s || s.status !== "playing" || clFading) return;
  clFading = true;                     // (a finger still down is picked up again when the round restarts)
  if(clTimers.spawn) clearInterval(clTimers.spawn);
  if(clTimers.tick) clearInterval(clTimers.tick);
  clTimers.spawn = null; clTimers.tick = null;
  clTimers.falls.forEach(function(id){ clearTimeout(id); });
  clTimers.falls = [];
  var list = clActiveIcons.filter(function(r){ return !r.resolved; });
  list.forEach(function(r){ if(r.anim) r.anim.pause(); });        // stop each light exactly where it is: not one carries on falling
  list.sort(function(a, b){ return b.el.getBoundingClientRect().top - a.el.getBoundingClientRect().top; });   // lowest first
  list.forEach(function(r, i){
    clTimers.falls.push(setTimeout(function(){
      r.el.style.transition = "opacity " + CL_FADE_MS + "ms ease-out"; r.el.style.opacity = "0";
      pixSfxPlay("clFade", false);
    }, i * CL_FADE_STEP_MS));
  });
  var allGone = Math.max(0, list.length - 1) * CL_FADE_STEP_MS + CL_FADE_MS + 80;
  clTimers.falls.push(setTimeout(function(){
    var s2 = state.session.catchLight;
    if(!s2 || s2.status !== "playing") return;
    list.forEach(function(r){ r.resolved = true; if(r.el.parentNode) r.el.parentNode.removeChild(r.el); });
    clActiveIcons = [];
    s2.misses++;                                                  // the heart goes now, with the screen empty
    saveState(); clUpdateHud();
    if(s2.misses >= CL_MAX_MISSES) clTimers.falls.push(setTimeout(function(){ clEndRound("fail"); }, CL_RESTART_BEAT_MS));
    else clTimers.falls.push(setTimeout(clRestartLevel, CL_RESTART_BEAT_MS));
  }, allGone));
}
function clRestartLevel(){
  var s = state.session.catchLight;
  if(!s || s.status !== "playing") return;
  clClearTimers();
  var field = document.getElementById("clField");
  if(field) [].slice.call(field.querySelectorAll(".clIcon")).forEach(function(e){ if(e.parentNode) e.parentNode.removeChild(e); });
  s.spawnedInLevel = 0; s.resolvedInLevel = 0; s.caughtInLevel = 0;
  saveState();
  clStart();
}

// Runs every CL_TICK_MS while a round is live — the only way to detect a
// "catch" now that lights fall via a CSS transition the hands must
// intercept, not something the player taps directly (topic.index has no
// equivalent since this is the one continuously-animated mission).
function clCollisionTick(){
  var s = state.session.catchLight;
  if(!s || s.status !== "playing") return;
  var hands = document.getElementById("clHands");
  if(!hands) return;
  clActiveIcons.slice().forEach(function(record){
    if(record.resolved || clFading) return;
    if(clTouchesHands(record)) clResolveIcon(record, true);
  });
}
// A catch is any part of the light touching any part of the hands' picture (2026-10-22, per Dan), the sides included, for as long as the light has not
// yet reached the bottom of the play area (that is a miss: see clSpawnIcon).
function clTouchesHands(record){
  var hands = document.getElementById("clHands");
  if(!hands) return false;
  var h = hands.getBoundingClientRect(), r = record.el.getBoundingClientRect();
  return r.right > h.left && r.left < h.right && r.bottom > h.top && r.top < h.bottom;
}

function clCheckLevelComplete(){
  var s = state.session.catchLight;
  if(!s || s.status !== "playing") return;
  if(s.resolvedInLevel < CL_LEVELS[s.level].count) return;
  // (the last level goes through the round-complete screen too, then on to the results: see clInterlude)
  // Stop the live spawn/tick loop between levels; the next level's loop is started by the render()-hook (see render) once it opens.
  // Hold on the now-cleared stage for a moment first so catching the last light doesn't cut straight into the next screen.
  clClearTimers();
  setTimeout(function(){
    var s2 = state.session.catchLight;
    if(!s2 || s2.status !== "playing") return;
    // ROUND X COMPLETED! shows before the next level (2026-10-22, per Dan); see clInterlude
    s2.phase = "roundDone";
    s2.interlude = {n: s2.level + 1, phase: "msg", award: false, final: s2.level >= CL_LEVELS.length - 1};
    saveState(); render();
  }, CL_LEVEL_PAUSE_MS);
}
// the round-complete screen: the message alone, never a chance heart (2026-10-22, per Dan), then the next level begins
function clInterlude(){
  pixRoundRun("catchLight", function(){ return state.session.catchLight; },
    null,
    function(s){
      if(s.interlude.final){ s.interlude = null; clCollectAward(); return; }       // a win goes straight to the Mission Complete screen (2026-10-22, per Dan)
      s.interlude = null;
      s.level++;
      s.spawnedInLevel = 0; s.resolvedInLevel = 0; s.caughtInLevel = 0;
      s.phase = "playing"; clWaiting = true;      // the next round waits for a tap
      saveState();
      render();                                  // the render()-hook starts the new level's lights, once the screen has been tapped
    });
}

// the first tap on the screen starts the round. (2026-10-25, per Dan: the hands did not follow the finger that started the round, and it had to be lifted and put down again.) The
// layer that takes the tap used to be taken away at once, and a finger that goes on touching a thing that has gone is not heard by anything else. Now, when the touch began on the
// SLIDE band, the layer stays until the finger lifts and steers the hands itself (and the window-level listeners above carry on with it too).
// (2026-10-25, per Dan: on the phone a tap did nothing, after the layer had been given pointer handlers instead of a click.) The layer listens for the pointer, the touch and the click, whichever
// comes first starts the round, and the start never depends on the steering part working.
// The tail of the touch that opened the game (its lift, its click) must not start the round: a click only counts after a pointer or touch has come down on the layer (clTouched). This replaced a
// 0.35 s guard that was worked out from the clock (2026-10-25, per Dan: after the phone slept between levels 7 and 8 the message could not be got past). And whatever the layer does, ANY new
// touch on the screen while the message is up starts the round too (the listener under the function).
var clTouched = false;
function clGo(ev){
  var s = state.session.catchLight;
  if(!clWaiting || !s || s.status !== "playing" || s.interlude) return;
  if(ev && ev.type === "click" && !clTouched) return;
  if(ev && (ev.type === "pointerdown" || ev.type === "touchstart")) clTouched = true;
  clWaiting = false;
  var rd = document.getElementById("clReady"); if(rd && rd.parentNode) rd.parentNode.removeChild(rd);
  var all = document.querySelector(".clTapAll"), steer = false;
  try { if(pixAudioStale) pixReviveOnTap(); } catch(e0){}
  try {
    if(ev && ev.pointerId !== undefined && ev.type === "pointerdown" && clInBand(ev)){
      clDragging = true; clPtrId = ev.pointerId; clPtrX = ev.clientX; steer = true;
      try { if(all) all.setPointerCapture(ev.pointerId); } catch(e){}
      setTimeout(clLayerGone, 20000);                                       // (a touch whose end is never heard)
    }
  } catch(e1){}
  if(!steer) clLayerGone();
  if(!clRunning && s.phase === "playing") clStart();
}
document.addEventListener("pointerdown", function(e){
  if(state.screen !== "catchLight" || !clWaiting) return;
  if(e.target && e.target.closest && e.target.closest(".exitBar, .exitBtn")) return;          // the red X is not a tap to start
  clGo(e);
}, true);
function clLayerGone(){ var all = document.querySelector(".clTapAll"); if(all && all.parentNode) all.parentNode.removeChild(all); }
function clLayerMove(ev){
  if(!clDragging || ev.pointerId !== clPtrId) return;
  clPtrX = ev.clientX;
  if(!clFading && state.screen === "catchLight") clMoveHandTo(ev.clientX);
}
// (the lift of the finger that touched START MISSION lands on this layer, which has just appeared under it: it must not take the layer away before the round has been started, 2026-10-25)
function clLayerEnd(ev){ if(clWaiting) return; if(ev.pointerId === clPtrId){ clDragging = false; clPtrId = null; } clLayerGone(); }
function clStart(){
  if(clRunning) return;
  clRunning = true;
  clLastX = null; clDirLeft = 0;       // the first light of a level starts anywhere, then a direction is picked
  var s = state.session.catchLight;
  // Reconciles any lights that were spawned-but-unresolved at the moment of
  // a page reload (their DOM elements are gone, so they can never be caught
  // or missed) back into the still-to-spawn count, so a reload mid-level can
  // never soft-lock a level a few lights short of its own quota. A no-op on
  // every normal start, since both are already 0 then.
  if(s) s.spawnedInLevel = s.resolvedInLevel;
  var field = document.getElementById("clField"), band = document.getElementById("clSlide");
  if(field) clHandX = field.clientWidth/2;
  if(band) band.onpointerdown = clPointerDown;
  clUpdateHandPosition();
  if(clDragging) clMoveHandTo(clPtrX);          // the finger is still down from the round before: the hands go straight to it
  clUpdateHud();
  clTimers.spawn = setInterval(clSpawnIcon, s ? CL_LEVELS[s.level].spawnMs : CL_LEVELS[0].spawnMs);
  clTimers.tick = setInterval(clCollisionTick, CL_TICK_MS);
}

function clEndRound(reason){
  var s = state.session.catchLight;
  clClearTimers(); clDragging = false;
  var stage = document.getElementById("clField");
  if(stage) stage.innerHTML = "";
  if(!s) return;
  s.status = (reason === "win") ? "passed" : "failed";
  saveState();
  render();
}

function clCollectAward(){ state.session.catchLight = null; grantMission("catchLight"); }
function clTryAgain(){ initCatchLight(); go("catchLight"); }
function clQuit(){ clClearTimers(); clDragging = false; state.session.catchLight = null; go("mainMenu"); }

// a dozen small stars that twinkle brighter at random: each flashes now and then, and each time a flash is over it turns up somewhere else (see the animationiteration listener)

/* ---------- Acts of Kindness Sort ---------- */

var KINDNESS_SCENARIOS = [
  {en:"You share your snack with someone who forgot theirs.", es:"Compartes tu merienda con alguien que olvidó la suya.", correct:"kind"},
  {en:"You laugh at someone who trips and falls.", es:"Te ríes de alguien que se tropieza y se cae.", correct:"unkind"},
  {en:"You hold the door open for the person behind you.", es:"Le sostienes la puerta a la persona detrás de ti.", correct:"kind"},
  {en:"You ignore a new student sitting alone at lunch.", es:"Ignoras a un estudiante nuevo que está sentado solo en el almuerzo.", correct:"unkind"},
  {en:"You help a friend carry their heavy backpack.", es:"Ayudas a un amigo a cargar su mochila pesada.", correct:"kind"},
  {en:"You spread a rumor about a classmate.", es:"Difundes un rumor sobre un compañero de clase.", correct:"unkind"},
  {en:"You compliment someone on a job well done.", es:"Felicitas a alguien por un trabajo bien hecho.", correct:"kind"},
  {en:"You cut in line ahead of others.", es:"Te metes en la fila delante de otros.", correct:"unkind"},
  {en:"You forgive a friend who made a mistake.", es:"Perdonas a un amigo que cometió un error.", correct:"kind"},
  {en:"You leave someone out of a group activity on purpose.", es:"Dejas a alguien fuera de una actividad grupal a propósito.", correct:"unkind"}
];
var KINDNESS_CHANCES = 3;

function initKindnessSort(){
  var order = shuffle(KINDNESS_SCENARIOS.map(function(_,i){return i;}));
  state.session.kindnessSort = {order:order, index:0, chances:KINDNESS_CHANCES, answered:null, status:"playing"};
  saveState();
}

function ksAnswer(bucket){
  var s = state.session.kindnessSort;
  if(!s || s.answered) return;
  var scenario = KINDNESS_SCENARIOS[s.order[s.index]];
  var isCorrect = bucket === scenario.correct;
  s.answered = bucket;
  if(!isCorrect) s.chances--;
  saveState(); render();
  setTimeout(function(){
    var s2 = state.session.kindnessSort;
    if(!s2) return;
    if(!isCorrect && s2.chances <= 0){
      s2.status = "failed";
      saveState(); render();
      return;
    }
    if(s2.index >= s2.order.length - 1){
      ksCollectAward();                 // a win goes straight to the Mission Complete screen (2026-10-22, per Dan)
    } else {
      s2.index++;
      s2.answered = null;
      saveState(); render();
    }
  }, 1100);
}

function ksCollectAward(){ state.session.kindnessSort = null; grantMission("kindnessSort"); }
function ksTryAgain(){ initKindnessSort(); go("kindnessSort"); }
function ksQuit(){ state.session.kindnessSort = null; go("mainMenu"); }

function screenKindnessSort(){
  var s = state.session.kindnessSort;
  if(!s){ initKindnessSort(); s = state.session.kindnessSort; }
  var lang = state.lang || "en";

  if(s.status === "failed"){
    return pixResultHtml("kindnessSortName", {title:t("ks_failTitle"), body:t("ks_failBody"),
      buttons:pixBtnHtml(t("tryAgain"), "ksTryAgain()") + pixBtnHtml(t("mainMenu"), "ksQuit()", true)});
  }
  if(s.status === "passed"){
    return pixResultHtml("kindnessSortName", {title:t("ks_passTitle"), body:t("ks_passBody"), badge:"kindnessSort",
      buttons:pixBtnHtml(t("collectAward"), "ksCollectAward()") + pixBtnHtml(t("mainMenu"), "ksQuit()", true)});
  }

  var scenario = KINDNESS_SCENARIOS[s.order[s.index]];
  var answered = s.answered !== null;
  var isCorrect = answered && s.answered === scenario.correct;
  function btnHtml(bucket, label){
    var cls = "pixAns";
    if(answered){
      cls += " disabled";
      if(bucket === scenario.correct) cls += " correct";
      else if(bucket === s.answered) cls += " wrong";
    }
    return '<button class="' + cls + '" onpointerdown="pixPressSfx()" onclick="pixClickSfx();ksAnswer(\'' + bucket + '\')">' + label + '</button>';
  }

  return pixShell('<h2 class="pixMTitle">' + t("kindnessSortName") + '</h2>' +
    pixPipsHtml(s.order.length, s.index, isCorrect ? "done" : (answered ? "bad" : "now")) +
    '<div class="pixPaper">' +
      '<p class="pixWuIntro">' + t("ks_intro") + '</p>' +
      '<div class="pixQ">' + scenario[lang] + '</div>' +
    '</div>' +
    '<div class="pixChances pixChancesGap"><span class="pixNote">' + t("chancesLeft") + '</span>' + chancesHeartsHtml(Math.max(0,s.chances), KINDNESS_CHANCES) + '</div>' +
    '<div class="spacer"></div>' +
    '<div class="pixKindRow">' + btnHtml("kind", t("ks_kind")) + btnHtml("unkind", t("ks_notKind")) + '</div>' +
    (isCorrect ? '<div class="pixFlash"></div>' : '') );
}

/* ---------- Light a Candle ---------- */

// Light a Candle (2026-10-21, per Dan: start on the new missions; spec = Five New Missions Design, mission 13). A quiet mission that cannot be
// failed: pick who or what you are praying for, press and hold the candle for 3 seconds to light it, read a short prayer, tap AMEN.
// Nothing the player picks is sent anywhere; the intention only chooses the prayer text. The prayers are drafts for the client to approve.
var LC_INTENTIONS = ["family", "friends", "peace", "thanks", "healing", "courage"];
var LC_HOLD_MS = 3000;       // holding this long lights the candle
var LC_RELEASE_MS = 900;     // after an early lift the ring empties again in this time
var lcProgress = 0, lcHolding = false, lcLast = 0, lcRaf = 0;

function initLightCandle(){
  state.session.lightCandle = {status:"playing", phase:"choose", intention:null};
  lcProgress = 0; lcHolding = false;
  saveState();
}
function lcChoose(i){
  var s = state.session.lightCandle;
  if(!s || s.phase !== "choose") return;
  s.intention = i; s.phase = "hold";
  lcProgress = 0; lcHolding = false;
  saveState(); render();
}

// draws the ring, the flame and the glow for the current hold progress (0 to 1); the flame and ring grow in steps, 8-bit style
function lcPaint(){
  var zone = document.getElementById("lcCandle");
  if(!zone) return;
  var s = state.session.lightCandle;
  var lit = !!(s && s.phase === "lit");
  var p = lit ? 1 : lcProgress;
  zone.style.setProperty("--p", p.toFixed(3));
  zone.style.setProperty("--rp", (Math.floor(p * 24) / 24).toFixed(4));
  var flame = zone.querySelector(".lcFlame");
  if(flame) flame.style.transform = p <= 0 ? "scale(0)" : "scale(" + (0.2 + 0.8 * Math.ceil(p * 5) / 5).toFixed(2) + ")";
}
function lcLoop(now){
  lcRaf = 0;
  var s = state.session.lightCandle;
  if(!s || state.screen !== "lightCandle" || s.phase !== "hold"){ lcHolding = false; lcProgress = 0; return; }
  var dt = Math.min(100, now - (lcLast || now)); lcLast = now;
  lcProgress += (lcHolding ? dt / LC_HOLD_MS : -dt / LC_RELEASE_MS);
  if(lcProgress >= 1){ lcProgress = 1; lcPaint(); lcLit(); return; }
  if(lcProgress <= 0){ lcProgress = 0; lcPaint(); if(!lcHolding){ lcLast = 0; return; } }
  lcPaint();
  lcRaf = requestAnimationFrame(lcLoop);
}
function lcStartLoop(){ if(!lcRaf){ lcLast = 0; lcRaf = requestAnimationFrame(lcLoop); } }
function lcDown(e){
  var s = state.session.lightCandle;
  if(!s || s.phase !== "hold" || lcHolding) return;
  if(e && e.preventDefault) e.preventDefault();
  if(e && e.pointerId !== undefined && e.currentTarget && e.currentTarget.setPointerCapture){ try { e.currentTarget.setPointerCapture(e.pointerId); } catch(x){} }
  lcHolding = true;
  lcStartLoop();
}
function lcUp(){ if(!lcHolding) return; lcHolding = false; lcStartLoop(); }   // the loop then empties the ring
function lcLit(){
  var s = state.session.lightCandle;
  if(!s) return;
  lcHolding = false; lcProgress = 1;
  s.phase = "lit";
  saveState();
  try { if(navigator.vibrate) navigator.vibrate(60); } catch(e){}      // phones without vibration (iPhone) just skip it
  pixSfxPlay("fmMatch", false);
  render();
}
function lcAmen(){
  var s = state.session.lightCandle;
  if(!s || s.phase !== "lit") return;
  lcCollectAward();                   // AMEN goes straight to the Mission Complete screen (2026-10-22, per Dan)
}
function lcCollectAward(){ state.session.lightCandle = null; grantMission("lightCandle"); }
function lcQuit(){ lcHolding = false; lcProgress = 0; state.session.lightCandle = null; go("mainMenu"); }

// holding works with the space bar too, and letting go of the screen for any reason (another app, a call, a rotation) lets the flame fall back
document.addEventListener("keydown", function(e){
  var s = state.session.lightCandle;
  if(e.code === "Space" && state.screen === "lightCandle" && s && s.phase === "hold"){ e.preventDefault(); if(!e.repeat) lcDown(null); }
});
document.addEventListener("keyup", function(e){ if(e.code === "Space") lcUp(); });
window.addEventListener("blur", lcUp);
document.addEventListener("visibilitychange", function(){ if(document.hidden) lcUp(); });

function lcCandleHtml(lit){
  return '<div class="lcZone' + (lit ? ' lit' : '') + '" id="lcCandle" style="--p:' + (lit ? 1 : 0) + ';--rp:' + (lit ? 1 : 0) + '"' +

/* ---------- Sacred Sudoku ---------- */

// Sacred Sudoku (2026-10-21, per Dan -- replaces Light the Windows). Sudoku with stained-glass pictures instead of numbers: fill the grid so every
// picture appears once in each row, each column and each box. Three puzzles of different sizes: 4 x 4, 5 x 5 (no boxes) and 6 x 6 (boxes
// 2 rows by 3 columns). It cannot be failed. Squares that break the rule glow red. Three hints per puzzle fill in one correct square. Every
// puzzle is made fresh and has exactly one solution. The pictures are six of the Faith Match pictures that look most different from each other.
var SD_PICS = [9, 14, 8, 5, 10, 7, 4, 2, 12];   // faith_tile8_NN: dove, Sacred Heart, crucifix, Lamb of God, chalice, Chi-Rho, bread and fish, Mary, angel (the 9 x 9 level uses all nine)
var SD_LEVELS = [
  {n:4, br:2, bc:2, givens:8},                  // 4 x 4, four 2 x 2 boxes
  {n:5, br:1, bc:1, box:false, givens:12},      // 5 x 5: 5 cannot be cut into boxes, so only rows and columns count (br = bc = 1 switches the box rule off)
  {n:6, br:2, bc:3, givens:15},                 // 6 x 6, six boxes of 2 rows by 3 columns
  {n:9, br:3, bc:3, givens:34}                  // 9 x 9, nine boxes of 3 x 3 (2026-10-22, per Dan)
];
var SD_HINTS = 3;

function sdCanPlace(grid, n, br, bc, pos, v){
  var r = Math.floor(pos / n), c = pos % n, i;
  for(i = 0; i < n; i++){ if(grid[r * n + i] === v || grid[i * n + c] === v) return false; }
  var r0 = r - r % br, c0 = c - c % bc;
  for(var rr = 0; rr < br; rr++) for(var cc = 0; cc < bc; cc++) if(grid[(r0 + rr) * n + c0 + cc] === v) return false;
  return true;
}
// counts the solutions (stops at limit), always trying the square with the fewest choices first
function sdCountSolutions(grid, n, br, bc, limit){
  var count = 0;
  function rec(){
    var best = -1, bestOpts = null, pos, v;
    for(pos = 0; pos < n * n; pos++){
      if(grid[pos] !== 0) continue;
      var opts = [];
      for(v = 1; v <= n; v++) if(sdCanPlace(grid, n, br, bc, pos, v)) opts.push(v);
      if(opts.length === 0) return;
      if(best < 0 || opts.length < bestOpts.length){ best = pos; bestOpts = opts; }
      if(opts.length === 1) break;
    }
    if(best < 0){ count++; return; }
    for(var k = 0; k < bestOpts.length; k++){
      grid[best] = bestOpts[k]; rec(); grid[best] = 0;
      if(count >= limit) return;
    }
  }
  rec();
  return count;
}
function sdRandomSolution(n, br, bc){
  var grid = [], i;
  for(i = 0; i < n * n; i++) grid.push(0);
  var vals = [];
  for(i = 1; i <= n; i++) vals.push(i);
  function fill(pos){
    if(pos === n * n) return true;
    var order = shuffle(vals);
    for(var k = 0; k < order.length; k++){
      if(sdCanPlace(grid, n, br, bc, pos, order[k])){
        grid[pos] = order[k];
        if(fill(pos + 1)) return true;
        grid[pos] = 0;
      }
    }
    return false;
  }
  fill(0);
  return grid;
}
// takes pictures away one at a time, keeping the puzzle at exactly one solution, until about `givens` are left
function sdMakePuzzle(cfg){
  var n = cfg.n, sol = sdRandomSolution(n, cfg.br, cfg.bc), puz = sol.slice(), left = n * n, order = [], i;
  for(i = 0; i < n * n; i++) order.push(i);
  order = shuffle(order);
  for(i = 0; i < order.length && left > cfg.givens; i++){
    var saved = puz[order[i]];
    puz[order[i]] = 0;
    if(sdCountSolutions(puz.slice(), n, cfg.br, cfg.bc, 2) !== 1) puz[order[i]] = saved; else left--;
  }
  return {n:n, br:cfg.br, bc:cfg.bc, box:cfg.box !== false, sol:sol, puz:puz, syms:shuffle(SD_PICS).slice(0, n)};
}

function sdFirstEmpty(cells){ for(var i = 0; i < cells.length; i++) if(cells[i] === 0) return i; return null; }
function initSacredSudoku(){
  var levels = SD_LEVELS.map(sdMakePuzzle);
  state.session.sacredSudoku = {levels:levels, level:0, cells:levels[0].puz.slice(), hinted:[], sel:sdFirstEmpty(levels[0].puz), hints:SD_HINTS, busy:false, status:"playing"};
  saveState();
}
// which squares break the rule: the same picture twice in a row, column or box
function sdClashes(cells, lv){
  var n = lv.n, bad = {};
  for(var a = 0; a < n * n; a++){
    if(!cells[a]) continue;
    for(var b2 = a + 1; b2 < n * n; b2++){
      if(cells[b2] !== cells[a]) continue;
      var ra = Math.floor(a / n), ca = a % n, rb = Math.floor(b2 / n), cb = b2 % n;
      if(ra === rb || ca === cb || (Math.floor(ra / lv.br) === Math.floor(rb / lv.br) && Math.floor(ca / lv.bc) === Math.floor(cb / lv.bc))){ bad[a] = true; bad[b2] = true; }
    }
  }
  return bad;
}
function sdSelect(i){
  var s = state.session.sacredSudoku;
  if(!s || s.status !== "playing" || s.busy) return;
  var lv = s.levels[s.level];
  if(lv.puz[i] !== 0 || s.hinted.indexOf(i) !== -1) return;          // the starting pictures and hinted squares are fixed
  s.sel = i; saveState(); render();
}
function sdPlace(v){
  var s = state.session.sacredSudoku;
  if(!s || s.status !== "playing" || s.busy || s.sel === null) return;
  var lv = s.levels[s.level];
  s.cells[s.sel] = v;
  var clash = v !== 0 && sdClashes(s.cells, lv)[s.sel];
  var done = s.cells.every(function(x, i){ return x === lv.sol[i]; });
  if(done){ sdFinishPuzzle(s); return; }
  pixSfxPlay(clash ? "fmMiss" : "fmFirst", true);
  saveState(); render();
  // A picture that breaks the rule glows red, and after 2 seconds that picture -- the one just placed, which caused the red -- clears itself, so
  // there is no need to tap the X (2026-10-22, per Dan). Other red squares are left alone, and the starting and hinted pictures never clear.
  if(clash){
    var level = s.level, pos = s.sel;
    setTimeout(function(){
      var s2 = state.session.sacredSudoku;
      if(!s2 || s2 !== s || s2.level !== level || s2.done || s2.status !== "playing") return;
      var lv2 = s2.levels[s2.level];
      if(s2.cells[pos] !== v || lv2.puz[pos] !== 0 || s2.hinted.indexOf(pos) !== -1) return;   // it has been changed or cleared already
      if(!sdClashes(s2.cells, lv2)[pos]) return;                                                // it is no longer breaking the rule
      s2.cells[pos] = 0;

}
// CLEAR takes every picture the player has put on the board off again; the starting pictures and hinted ones stay
function sdClearAll(){

  var lv = s.levels[s.level];
  for(var i = 0; i < s.cells.length; i++){
    if(lv.puz[i] === 0 && s.hinted.indexOf(i) === -1) s.cells[i] = 0;
  }

}
function sdFirstEmptyPlayable(s){
  for(var i = 0; i < s.cells.length; i++) if(s.cells[i] === 0) return i;
  return null;
}
function sdHint(){
  var s = state.session.sacredSudoku;

  var wrong = [];
  for(var i = 0; i < s.cells.length; i++) if(s.cells[i] !== lv.sol[i]) wrong.push(i);
  if(!wrong.length) return;
  var target = (s.sel !== null && wrong.indexOf(s.sel) !== -1) ? s.sel : wrong[Math.floor(Math.random() * wrong.length)];
  s.cells[target] = lv.sol[target]; s.hinted.push(target); s.hints--;
  s.sel = null;
  var done = s.cells.every(function(x, k){ return x === lv.sol[k]; });
  if(done){ sdFinishPuzzle(s); return; }
  var nextEmpty = null;
  for(var k = 0; k < s.cells.length; k++) if(s.cells[k] !== lv.sol[k] && lv.puz[k] === 0){ nextEmpty = k; break; }
  s.sel = nextEmpty;
  pixSfxPlay("fmMatch", true);
  saveState(); render();
}
// Finishing a puzzle celebrates exactly like finishing a Faith Match level (2026-10-21, per Dan): the picture that completes the grid makes the
// match sound, the grid stays at normal brightness for a beat, then the Faith Match fanfare plays while ONE random square frame at a time
// glows (never the same square twice in a row, a tenth of a second each, for 3 seconds), and then the next puzzle (or the result) comes.
// render() calls sdCelebrate(), so a reload in the middle of it picks the sequence back up.
var sdCelebrating = false;
function sdFinishPuzzle(s){
  s.busy = true; s.sel = null; s.done = true;
  pixSfxPlay("fmMatch", true);                 // the last picture, like the last pair of tiles
  saveState(); render();
}
function sdCelebrate(){
  if(sdCelebrating) return;
  var s = state.session.sacredSudoku;
  if(!s || !s.done) return;
  sdCelebrating = true;
  function alive(){ return state.session.sacredSudoku === s && s.done && state.screen === "sacredSudoku"; }   // the player has not left
  function begin(){
    if(!alive()){ sdCelebrating = false; return; }
    s.celebrate = true; saveState();
    pixSfxPlay("fmFanfare", false);
    var step = 0, last = -1, t0 = performance.now();
    function tick(){
      if(!alive()){ sdCelebrating = false; return; }
      var cells = document.querySelectorAll(".sdBoard .sdCell");
      for(var i = 0; i < cells.length; i++) cells[i].classList.remove("glow");
      if(step >= FM_FLASH_STEPS){ sdCelebrating = false; sdNextPuzzle(s); return; }
      var idx;
      do { idx = Math.floor(Math.random() * cells.length); } while(idx === last && cells.length > 1);
      last = idx;
      if(cells[idx]) cells[idx].classList.add("glow");
      step++;
      setTimeout(tick, Math.max(0, t0 + step * FM_FLASH_MS - performance.now()));
    }
    tick();
  }

}
function sdNextPuzzle(s){
  if(state.session.sacredSudoku !== s || s.status !== "playing") return;
  s.done = false; s.celebrate = false;
  if(s.level >= s.levels.length - 1){ sdCollectAward(); return; }       // a win goes straight to the Mission Complete screen (2026-10-22, per Dan)
  else {
    s.level++; var nl = s.levels[s.level];
    s.cells = nl.puz.slice(); s.hinted = []; s.hints = SD_HINTS; s.sel = sdFirstEmpty(nl.puz); s.busy = false;
  }
  saveState(); render();
}
function sdCollectAward(){ state.session.sacredSudoku = null; grantMission("sacredSudoku"); }
function sdQuit(){ state.session.sacredSudoku = null; go("mainMenu"); }

function sdPicUrl(lv, v){ return 'tiles/faith_tile8_' + ("0" + lv.syms[v - 1]).slice(-2) + '.png'; }

function screenSacredSudoku(){
  var s = state.session.sacredSudoku;
  if(!s){ initSacredSudoku(); s = state.session.sacredSudoku; }

  if(s.status === "passed"){
    return pixResultHtml("sudokuName", {cls:"pixLower", title:t("sd_passTitle"), body:t("sd_passBody"), badge:"sacredSudoku",
      buttons:pixBtnHtml(t("collectAward"), "sdCollectAward()") + pixBtnHtml(t("mainMenu"), "sdQuit()", true)});
  }

  var lv = s.levels[s.level], n = lv.n;
  var bad = sdClashes(s.cells, lv);
  // The board is a grid of boxes and each box is a grid of squares: 2px lines between squares, 4px lines between boxes and around the edge
  // (a level with no boxes is one big box).
  var boxed = lv.box !== false, lr = boxed ? lv.br : n, lc = boxed ? lv.bc : n, boxesHtml = "";
  for(var r0 = 0; r0 < n; r0 += lr) for(var c0 = 0; c0 < n; c0 += lc){
    var inner = "";
    for(var rr = 0; rr < lr; rr++) for(var cc = 0; cc < lc; cc++){

      if(lv.puz[i] === 0 && s.hinted.indexOf(i) !== -1) cls += " hint"; else if(lv.puz[i] === 0 && v) cls += " mine";
      if(bad[i]) cls += " clash";
