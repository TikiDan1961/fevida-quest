}

/* ---------- Word Unscramble ---------- */
// Curated per-language word lists (not literal translations of each other —
// picked separately so both feel like natural, similarly-simple faith words
// rather than forcing an EN word's exact meaning into an awkward ES fit).
// TODO(Dan): swap in different/NCYC-specific words any time — nothing else
// needs to change.
var WORD_UNSCRAMBLE_WORDS = {
  en: ["HOPE","GRACE","MERCY","FAITH","TRUST"],
  es: ["FE","PAZ","AMOR","GRACIA","ESPERANZA"]
};

function wuScrambleWord(word){
  var letters = word.split("");
  var scrambled;
  do { scrambled = shuffle(letters); } while(scrambled.join("") === word && letters.length > 1);
  return scrambled;
}

function wuSetupWord(s){
  var lang = state.lang || "en";
  var word = WORD_UNSCRAMBLE_WORDS[lang][s.order[s.index]];
  s.word = word;
  s.letters = wuScrambleWord(word);
  s.picked = [];
  s.feedback = null; // "correct" | "wrong" | null, transient
}

function initWordUnscramble(){
  var lang = state.lang || "en";
  var order = shuffle(WORD_UNSCRAMBLE_WORDS[lang].map(function(_,i){return i;}));
  var s = {order:order, index:0, status:"playing"};
  wuSetupWord(s);
  state.session.wordUnscramble = s;
  saveState();
}

// No fail state, per spec — this is a puzzle, not a knowledge/reflex test.
// A wrong full attempt just shakes and clears for another try.
function wuPick(letterPos){
  var s = state.session.wordUnscramble;
  if(!s || s.feedback) return;
  if(s.picked.indexOf(letterPos) !== -1) return;
  if(s.picked.length >= s.word.length) return;
  s.picked.push(letterPos);
  if(s.picked.length === s.word.length){
    var guess = s.picked.map(function(p){ return s.letters[p]; }).join("");
    if(guess === s.word){
      s.feedback = "correct";
      saveState(); render();
      setTimeout(function(){
        var s2 = state.session.wordUnscramble;
        if(!s2) return;
        if(s2.index >= s2.order.length - 1){
          s2.status = "results";
          saveState(); render();
        } else {
          s2.index++;
          wuSetupWord(s2);
          saveState(); render();
        }
      }, 900);
    } else {
      s.feedback = "wrong";
      saveState(); render();
      setTimeout(function(){
        var s2 = state.session.wordUnscramble;
        if(!s2) return;
        s2.picked = [];
        s2.feedback = null;
        saveState(); render();
      }, 900);
    }
  } else {
    saveState(); render();
  }
}

function wuClear(){
  var s = state.session.wordUnscramble;
  if(!s || s.feedback) return;
  s.picked = [];
  saveState(); render();
}

function wuCollectAward(){ state.session.wordUnscramble = null; grantMission("wordUnscramble"); }
function wuQuit(){ state.session.wordUnscramble = null; go("mainMenu"); }

function screenWordUnscramble(){
  var s = state.session.wordUnscramble;
  if(!s){ initWordUnscramble(); s = state.session.wordUnscramble; }

  if(s.status === "results"){
    return '<div class="screen center">' +
      '<h1>' + t("wu_passTitle") + '</h1>' +
      '<p>' + t("wu_passBody") + '</p>' +
      '<div class="spacer"></div>' +
      '<button class="btn gold" onclick="wuCollectAward()">' + t("collectAward") + '</button>' +
    '</div>';
  }

  var rowCls = "wuAnswerRow" + (s.feedback ? " " + s.feedback : "");
  var slotsHtml = "";
  for(var i=0;i<s.word.length;i++){
    var filled = i < s.picked.length;
    slotsHtml += '<div class="wuSlot' + (filled?' filled':'') + '">' + (filled ? s.letters[s.picked[i]] : "") + '</div>';
  }
  var trayHtml = s.letters.map(function(ch, pos){
    var used = s.picked.indexOf(pos) !== -1;
    return '<div class="wuTile' + (used?' used':'') + '" onclick="wuPick(' + pos + ')">' + ch + '</div>';
  }).join("");

  return '<div class="screen">' +
    '<h2>' + t("wordUnscrambleName") + '</h2>' +
    '<p class="smallNote">' + t("wu_word")(s.index+1, s.order.length) + '</p>' +
    '<p class="center">' + t("wu_intro") + '</p>' +
    '<div class="' + rowCls + '">' + slotsHtml + '</div>' +
    '<div class="wuTray">' + trayHtml + '</div>' +
    '<div class="spacer"></div>' +
    '<button class="btn outline" onclick="wuClear()">' + t("clearWord") + '</button>' +
    '<button class="btn outline" onclick="wuQuit()">' + t("mainMenu") + '</button>' +
  '</div>';
}

/* ---------- Catch the Light ---------- */
// Redesigned 2026-09-29, per Dan, modeled on the Atari 2600 game Kaboom! —
// a pair of open hands (🤲, palms up) sits at the bottom of the stage and
// the player drags them left/right (a pointerdown anywhere on the stage
// jumps the hands there; dragging keeps following the pointer, like an
// analog paddle controller) to catch falling lights (✨) before they pass
// the hands. A light that gets past uncaught costs one of 3 chances SHARED
// across all 4 levels (not reset per level) — run out at any point and the
// whole thing restarts from Level 1. Clearing Level 4 with a chance still
// in hand completes the mission. Levels only raise the count and fall
// speed, per Dan's spec:
var CL_LEVELS = [
  {count:20, fallMs:3200},
  {count:30, fallMs:2700},
  {count:40, fallMs:2300},
  {count:50, fallMs:2000}
];
var CL_MAX_MISSES = 3;
var CL_SPAWN_MS = 700, CL_TICK_MS = 50, CL_ICON = "✨", CL_HAND_EMOJI = "🤲";
// A "GET READY FOR LEVEL X" beat with a visible 5->0 countdown, shown before
// the very first level and before each subsequent one (2026-09-29, per Dan).
var CL_READY_SECONDS = 5;
// Brief hold on the cleared stage after the last light of a level is caught,
// before the "GET READY" beat for the next level begins (2026-09-29, per Dan).
var CL_LEVEL_PAUSE_MS = 900;
var clReadyRunning = false; // guards clRunReadyCountdown against double-starting (see its own comment)

// Unlike every other mission, this one runs a CONTINUOUS animation loop
// (falling icons + the hands following the player's finger), which doesn't
// mix well with this app's normal "re-render the whole screen from state"
// pattern — a mid-round render() would wipe out every in-flight falling
// icon (and its own timers) along with everything else. So while a round is
// "playing", the falling icons, the hands' position, and the HUD are all
// updated via DIRECT DOM writes, completely bypassing render() — the normal
// render() pipeline only runs again once the round actually ends
// (clEndRound) or completes a level (still mid-round, but only touches the
// HUD text, not a full re-render).
var clRunning = false; // true only while the spawn/tick intervals are live
var clTimers = {spawn:null, tick:null, falls:[]};
var clActiveIcons = []; // {el, resolved} for every light currently in flight
var clHandX = 0; // current hand center, in px relative to the stage
var clDragging = false;

function initCatchLight(){
  state.session.catchLight = {level:0, spawnedInLevel:0, resolvedInLevel:0, caughtInLevel:0, misses:0, status:"playing", phase:"ready", countdown:CL_READY_SECONDS};
  saveState();
}

// Renders the "GET READY" beat once per number (5,4,3,2,1,0 -- each shown
// for a full second, including 0, before the level actually begins) via the
// normal render() pipeline, not a direct-DOM trick like the live gameplay
// below -- there's no falling-icon animation to protect from a re-render
// during this beat. Self-terminating (no interval to leak/clear), but
// clReadyRunning still guards against two overlapping chains if this were
// ever accidentally triggered twice (e.g. by both an explicit call site and
// the render() resume-hook in the same tick).
function clRunReadyCountdown(){
  var s = state.session.catchLight;
  if(!s || s.status !== "playing" || s.phase !== "ready"){ clReadyRunning = false; return; }
  clReadyRunning = true;
  render();
  setTimeout(function(){
    var s2 = state.session.catchLight;
    if(!s2 || s2.status !== "playing" || s2.phase !== "ready"){ clReadyRunning = false; return; }
    if(s2.countdown <= 0){ clReadyRunning = false; clBeginLevel(); return; }
    s2.countdown--;
    saveState();
    clRunReadyCountdown();
  }, 1000);
}

// Flips from the "GET READY" beat to the real stage+hands screen and starts
// the level's own spawn/collision loop.
function clBeginLevel(){
  var s = state.session.catchLight;
  if(!s || s.status !== "playing") return;
  s.phase = "playing";
  saveState();
  render();
}

function clClearTimers(){
  if(clTimers.spawn) clearInterval(clTimers.spawn);
  if(clTimers.tick) clearInterval(clTimers.tick);
  clTimers.falls.forEach(function(id){ clearTimeout(id); });
  clTimers.spawn = null; clTimers.tick = null; clTimers.falls = [];
  clRunning = false;
  clActiveIcons = [];
  clDragging = false;
}

function clUpdateHud(){
  var s = state.session.catchLight;
  if(!s) return;
  var levelEl = document.getElementById("clLevel");
  var scoreEl = document.getElementById("clScore");
  var heartsEl = document.getElementById("clHearts");
  var levelCfg = CL_LEVELS[s.level];
  if(levelEl) levelEl.textContent = t("cl_level")(s.level+1, CL_LEVELS.length);
  if(scoreEl) scoreEl.textContent = t("cl_caught")(s.caughtInLevel, levelCfg.count);
  if(heartsEl) heartsEl.textContent = "❤️".repeat(Math.max(0, CL_MAX_MISSES - s.misses));
}

function clUpdateHandPosition(){
  var hands = document.getElementById("clHands");
  if(hands) hands.style.left = clHandX + "px";
}

function clMoveHandTo(clientX){
  var stage = document.getElementById("clStage");
  if(!stage) return;
  var rect = stage.getBoundingClientRect();
  clHandX = Math.max(0, Math.min(rect.width, clientX - rect.left));
  clUpdateHandPosition();
}

function clPointerDown(ev){
  var s = state.session.catchLight;
  if(!s || s.status !== "playing") return;
  clDragging = true;
  clMoveHandTo(ev.clientX);
}
function clPointerMove(ev){
  if(!clDragging) return;
  clMoveHandTo(ev.clientX);
}
function clPointerUp(){ clDragging = false; }

function clSpawnIcon(){
  var stage = document.getElementById("clStage");
  var s = state.session.catchLight;
  if(!stage || !s || s.status !== "playing") return;
  var levelCfg = CL_LEVELS[s.level];
  if(s.spawnedInLevel >= levelCfg.count) return; // this level's full quota is already in flight or resolved — just waiting on the rest
  s.spawnedInLevel++;
  saveState();
  var el = document.createElement("div");
  el.className = "clIcon";
  el.textContent = CL_ICON;
  var stageW = stage.clientWidth;
  el.style.left = Math.max(4, Math.floor(Math.random() * Math.max(1, stageW - 40))) + "px";
  el.style.top = "-50px";
  el.style.transition = "none";
  stage.appendChild(el);
  void el.offsetHeight; // force reflow so the transition below actually starts from -50px, not skips straight to the end
  var stageH = stage.clientHeight;
  // setTimeout(fn,0), not requestAnimationFrame -- rAF is suspended whenever
  // the document isn't in the "visible" state (per the Page Visibility spec),
  // which real phones only enter while genuinely backgrounded, but this is
  // still the more robust choice for a page a player may glance away from
  // and back to mid-round; either way it needs a deferred tick after the
  // reflow above, and a plain macrotask delivers that regardless of paint
  // scheduling.
  setTimeout(function(){
    el.style.transition = "top " + levelCfg.fallMs + "ms linear";
    el.style.top = (stageH + 20) + "px";
  }, 0);
  var record = {el:el, resolved:false};
  clActiveIcons.push(record);
  // If it's never caught by clCollisionTick, its own fall timer resolves it
  // as a miss once it's had time to reach the bottom.
  var fallId = setTimeout(function(){ clResolveIcon(record, false); }, levelCfg.fallMs + 30);
  clTimers.falls.push(fallId);
}

function clResolveIcon(record, caught){
  if(record.resolved) return;
  record.resolved = true;
  if(record.el.parentNode) record.el.parentNode.removeChild(record.el);
  var idx = clActiveIcons.indexOf(record);
  if(idx !== -1) clActiveIcons.splice(idx, 1);
  var s = state.session.catchLight;
  if(!s || s.status !== "playing") return;
  s.resolvedInLevel++;
  if(caught) s.caughtInLevel++; else s.misses++;
  saveState();
  clUpdateHud();
  if(s.misses >= CL_MAX_MISSES){ clEndRound("fail"); return; }
  clCheckLevelComplete();
}

// Runs every CL_TICK_MS while a round is live — the only way to detect a
// "catch" now that lights fall via a CSS transition the hands must
// intercept, not something the player taps directly (topic.index has no
// equivalent since this is the one continuously-animated mission).
function clCollisionTick(){
  var s = state.session.catchLight;
  if(!s || s.status !== "playing") return;
  var hands = document.getElementById("clHands");
  if(!hands) return;
  var handsRect = hands.getBoundingClientRect();
  clActiveIcons.slice().forEach(function(record){
    if(record.resolved) return;
    var r = record.el.getBoundingClientRect();
    var cx = r.left + r.width/2, cy = r.top + r.height/2;
    if(cy >= handsRect.top && cy <= handsRect.bottom && cx >= handsRect.left && cx <= handsRect.right){
      clResolveIcon(record, true);
    }
  });
}

function clCheckLevelComplete(){
  var s = state.session.catchLight;
  if(!s || s.status !== "playing") return;
  if(s.resolvedInLevel < CL_LEVELS[s.level].count) return;
  if(s.level >= CL_LEVELS.length - 1){ clEndRound("win"); return; }
  // Stop the live spawn/tick loop for the "GET READY" beat between levels —
  // clBeginLevel() (at the end of clRunReadyCountdown) restarts it once the
  // countdown finishes, via the same render()-hook every other entry point
  // into a level uses. Hold on the now-cleared stage for a moment first so
  // catching the last light doesn't cut straight into the next screen.
  clClearTimers();
  setTimeout(function(){
    var s2 = state.session.catchLight;
    if(!s2 || s2.status !== "playing") return;
    s2.level++;
    s2.spawnedInLevel = 0; s2.resolvedInLevel = 0; s2.caughtInLevel = 0;
    s2.phase = "ready"; s2.countdown = CL_READY_SECONDS;
    saveState();
    clRunReadyCountdown();
  }, CL_LEVEL_PAUSE_MS);
}

function clStart(){
  if(clRunning) return;
  clRunning = true;
  var s = state.session.catchLight;
  // Reconciles any lights that were spawned-but-unresolved at the moment of
  // a page reload (their DOM elements are gone, so they can never be caught
  // or missed) back into the still-to-spawn count, so a reload mid-level can
  // never soft-lock a level a few lights short of its own quota. A no-op on
  // every normal start, since both are already 0 then.
  if(s) s.spawnedInLevel = s.resolvedInLevel;
  var stage = document.getElementById("clStage");
  if(stage){
    clHandX = stage.clientWidth/2;
    stage.onpointerdown = clPointerDown;
    stage.onpointermove = clPointerMove;
    stage.onpointerup = clPointerUp;
    stage.onpointercancel = clPointerUp;
    stage.onpointerleave = clPointerUp;
  }
  clUpdateHandPosition();
  clUpdateHud();
  clTimers.spawn = setInterval(clSpawnIcon, CL_SPAWN_MS);
  clTimers.tick = setInterval(clCollisionTick, CL_TICK_MS);
}

function clEndRound(reason){
  var s = state.session.catchLight;
  clClearTimers();
  var stage = document.getElementById("clStage");
  if(stage) stage.innerHTML = "";
  if(!s) return;
  s.status = (reason === "win") ? "passed" : "failed";
  saveState();
  render();
}

function clCollectAward(){ state.session.catchLight = null; grantMission("catchLight"); }
function clTryAgain(){ initCatchLight(); go("catchLight"); }
function clQuit(){ clClearTimers(); clReadyRunning = false; state.session.catchLight = null; go("mainMenu"); }

  if(s.status === "failed"){

var KINDNESS_SCENARIOS = [
  {en:"You share your snack with someone who forgot theirs.", es:"Compartes tu merienda con alguien que olvidó la suya.", correct:"kind"},
  {en:"You laugh at someone who trips and falls.", es:"Te ríes de alguien que se tropieza y se cae.", correct:"unkind"},
  {en:"You hold the door open for the person behind you.", es:"Le sostienes la puerta a la persona detrás de ti.", correct:"kind"},
  {en:"You ignore a new student sitting alone at lunch.", es:"Ignoras a un estudiante nuevo que está sentado solo en el almuerzo.", correct:"unkind"},
  {en:"You help a friend carry their heavy backpack.", es:"Ayudas a un amigo a cargar su mochila pesada.", correct:"kind"},
  {en:"You spread a rumor about a classmate.", es:"Difundes un rumor sobre un compañero de clase.", correct:"unkind"},
  {en:"You compliment someone on a job well done.", es:"Felicitas a alguien por un trabajo bien hecho.", correct:"kind"},
  {en:"You cut in line ahead of others.", es:"Te metes en la fila delante de otros.", correct:"unkind"},
  {en:"You forgive a friend who made a mistake.", es:"Perdonas a un amigo que cometió un error.", correct:"kind"},
  {en:"You leave someone out of a group activity on purpose.", es:"Dejas a alguien fuera de una actividad grupal a propósito.", correct:"unkind"}
];
var KINDNESS_CHANCES = 3;

function initKindnessSort(){
  var order = shuffle(KINDNESS_SCENARIOS.map(function(_,i){return i;}));
  state.session.kindnessSort = {order:order, index:0, chances:KINDNESS_CHANCES, answered:null, status:"playing"};
  saveState();
}

function ksAnswer(bucket){
  var s = state.session.kindnessSort;
  if(!s || s.answered) return;
  var scenario = KINDNESS_SCENARIOS[s.order[s.index]];
  var isCorrect = bucket === scenario.correct;
  s.answered = bucket;
  if(!isCorrect) s.chances--;
  saveState(); render();
  setTimeout(function(){
    var s2 = state.session.kindnessSort;
    if(!s2) return;
    if(!isCorrect && s2.chances <= 0){
      s2.status = "failed";
      saveState(); render();
      return;
    }
    if(s2.index >= s2.order.length - 1){
      s2.status = "passed";
      saveState(); render();
    } else {
      s2.index++;
      s2.answered = null;
      saveState(); render();
    }
  }, 1100);
}

/* ---------- Stained-Glass Puzzle ---------- */

// Replaced Service Sprint (2026-10-19, per Dan), then turned from a sliding
// puzzle into a jigsaw (per Dan -- slide puzzles were too hard), then given 4
// levels of 12 / 16 / 20 / 24 pieces (per Dan). Each level is cut from a random
// Faith Match picture (the same 16 tile images, already preloaded). The player
// drags loose, jigsaw-shaped pieces from a tray into an empty frame; a piece
// within reach of its own spot snaps in and locks, anything else springs back
// to the tray. No chances, no timer -- it cannot be failed. When a level is
// finished the whole picture is shown for 3 seconds with no piece lines.
// The whole board is ONE <svg> in a fixed 340-unit-wide coordinate space that
// scales to the screen. The board is always square, so a level's grid decides
// the piece shape (4x3 gives slightly tall pieces, 6x4 narrower ones). Dragging
// moves pieces by direct DOM writes (not render(), which would replace the
// piece being held); render() only runs when a level is solved. Piece edges
// (the knobs) come from a seeded random generator, so a page reload rebuilds
// exactly the same pieces.
var PZ_LEVELS = [
  {cols:4, rows:3},   // level 1: 12 pieces
  {cols:4, rows:4},   // level 2: 16 pieces
  {cols:5, rows:4},   // level 3: 20 pieces
  {cols:6, rows:4}    // level 4: 24 pieces
];
var PZ_W = 340;                 // board is PZ_W x PZ_W units
var PZ_TRAY_BUDGET = 230;       // most height the tray may use, in units
var PZ_TRAY_PAD = 10;           // room around a tray piece for its knobs
var PZ_SNAP_MIN = 24;           // snap distance is half the short side, but at least this
var PZ_LIFT = 36;               // a held piece rides this far above the finger
var PZ_SOLVED_MS = 3000;        // how long the finished picture is shown
var pzAdvancing = false;        // true while the "solved" hold is pending
var pzCtx = null;               // geometry of the board currently on screen
var pzDrag = null;              // the piece being dragged, if any

function pzRng(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// One side of a piece, from (x0,y0) to (x1,y1). tab: +1 knob out, -1 knob in,
// 0 flat. The knob is sized from m (the piece's shorter side) and centered on
// the edge, so it looks the same on a long edge and a short one.
function pzEdge(x0, y0, x1, y1, tab, m){
  if(!tab) return ' L' + x1 + ' ' + y1;
  var dx = x1 - x0, dy = y1 - y0, len = Math.sqrt(dx*dx + dy*dy), ux = dx/len, uy = dy/len;
  var mx = (x0 + x1)/2, my = (y0 + y1)/2, half = 0.12 * m, r = 0.14 * m;
  return ' L' + (mx - ux*half) + ' ' + (my - uy*half) +
         ' A' + r + ' ' + r + ' 0 1 ' + (tab > 0 ? 1 : 0) + ' ' + (mx + ux*half) + ' ' + (my + uy*half) +
         ' L' + x1 + ' ' + y1;
}

// Geometry for level s.round: piece outlines, slots, and tray positions
// (pieces already placed get none).
function pzBuild(s){
  var lvl = PZ_LEVELS[s.round], cols = lvl.cols, rows = lvl.rows, n = cols * rows;
  var pw = PZ_W / cols, ph = PZ_W / rows, m = Math.min(pw, ph), rng = pzRng(s.seeds[s.round]);
  var r, c, i, hT = [], vT = [];
  for(r=0;r<rows;r++){ hT[r] = []; vT[r] = []; for(c=0;c<cols;c++){ hT[r][c] = rng() < 0.5 ? 1 : -1; vT[r][c] = rng() < 0.5 ? 1 : -1; } }
  var order = [];
  for(i=0;i<n;i++) order.push(i);
  for(i=n-1;i>0;i--){ var j = Math.floor(rng()*(i+1)), tmp = order[i]; order[i] = order[j]; order[j] = tmp; }
  var pieces = [];
  for(i=0;i<n;i++){
    r = Math.floor(i/cols); c = i % cols;
    var top = r > 0 ? -vT[r-1][c] : 0, right = c < cols-1 ? hT[r][c] : 0;
    var bottom = r < rows-1 ? vT[r][c] : 0, left = c > 0 ? -hT[r][c-1] : 0;
    var d = 'M0 0' + pzEdge(0,0,pw,0,top,m) + pzEdge(pw,0,pw,ph,right,m) +
            pzEdge(pw,ph,0,ph,bottom,m) + pzEdge(0,ph,0,0,left,m) + ' Z';
    pieces.push({id:i, row:r, col:c, d:d, sx:c*pw, sy:r*ph});
  }
  // Largest tray scale that still fits every piece within the tray budget.
  var k = 0.7, cw, ch, tc = 1, tr = n;
  for(; k >= 0.2; k -= 0.02){
    cw = pw*k + PZ_TRAY_PAD; ch = ph*k + PZ_TRAY_PAD;
    tc = Math.max(1, Math.floor(PZ_W / cw)); tr = Math.ceil(n / tc);
    if(tr * ch <= PZ_TRAY_BUDGET) break;
  }
  var trayTop = PZ_W + 22, slot = 0;
  order.forEach(function(id){
    if(s.placed.indexOf(id) !== -1) return;
    var p = pieces[id];
    p.tx = (PZ_W - tc*cw)/2 + (slot % tc)*cw + PZ_TRAY_PAD/2;
    p.ty = trayTop + Math.floor(slot / tc)*ch + PZ_TRAY_PAD/2;
    p.k = k; slot++;
  });
  return {cols:cols, rows:rows, n:n, pw:pw, ph:ph, m:m, pieces:pieces, k:k, H: trayTop + tr*ch + 12};
}

function initStainedGlass(){
  pzAdvancing = false; pzDrag = null;
  var seeds = [];
  for(var i=0;i<PZ_LEVELS.length;i++) seeds.push(1 + Math.floor(Math.random()*2000000000));
  state.session.stainedGlass = {
    round: 0, imgs: shuffle(MATCH_SYMBOLS).slice(0, PZ_LEVELS.length),
    seeds: seeds, placed: [], status: "playing"
  };
  saveState();
}

function pzToSvg(ev){
  var svg = document.getElementById("pzSvg");
  var pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  var m = svg.getScreenCTM();
  return m ? pt.matrixTransform(m.inverse()) : {x:0, y:0};
}

function pzSetPos(el, x, y, k){
  el.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + k + ')';
}

function pzDown(ev, id){
  var s = state.session.stainedGlass;
  if(!s || s.status !== "playing" || !pzCtx || pzDrag || s.placed.indexOf(id) !== -1) return;
  ev.preventDefault();
  var el = document.getElementById("pzP" + id);
  if(!el) return;
  pzDrag = {id:id, pointerId:ev.pointerId, el:el, x:0, y:0};
  el.style.transition = "none";
  el.classList.add("dragging");
  document.getElementById("pzSvg").appendChild(el); // bring to the front
  pzMove(ev);
  window.addEventListener("pointermove", pzMove);
  window.addEventListener("pointerup", pzUp);
  window.addEventListener("pointercancel", pzUp);
}

function pzMove(ev){
  if(!pzDrag || (ev.pointerId !== undefined && ev.pointerId !== pzDrag.pointerId)) return;
  var pw = pzCtx.pw, ph = pzCtx.ph, p = pzToSvg(ev);
  var x = Math.min(PZ_W - pw*0.8, Math.max(-pw*0.2, p.x - pw/2));
  var y = Math.min(pzCtx.H - ph*0.8, Math.max(-ph*0.2, p.y - ph/2 - PZ_LIFT));
  pzDrag.x = x; pzDrag.y = y;
  pzSetPos(pzDrag.el, x, y, 1);
}

function pzUp(ev){
  if(!pzDrag || (ev && ev.pointerId !== undefined && ev.pointerId !== pzDrag.pointerId)) return;
  window.removeEventListener("pointermove", pzMove);
  window.removeEventListener("pointerup", pzUp);
  window.removeEventListener("pointercancel", pzUp);
  var d = pzDrag; pzDrag = null;
  var s = state.session.stainedGlass, piece = pzCtx.pieces[d.id];
  d.el.classList.remove("dragging");
  if(!s || s.status !== "playing") return;
  var dist = Math.sqrt(Math.pow(d.x - piece.sx, 2) + Math.pow(d.y - piece.sy, 2));
  if(dist < Math.max(PZ_SNAP_MIN, pzCtx.m * 0.5)){
    d.el.style.transition = "transform .12s ease";
    pzSetPos(d.el, piece.sx, piece.sy, 1);
    d.el.classList.add("locked");
    // keep locked pieces underneath the loose ones
    var svg = document.getElementById("pzSvg"), firstLoose = svg.querySelector(".pzPiece:not(.locked)");
    if(firstLoose && firstLoose !== d.el) svg.insertBefore(d.el, firstLoose);
    s.placed.push(d.id);
    var prog = document.getElementById("pzProgress");
    if(prog) prog.textContent = t("pz_pieces")(s.placed.length, pzCtx.n);
    if(s.placed.length >= pzCtx.n){
      s.status = "solved"; saveState();
      setTimeout(function(){ if(state.screen === "stainedGlass") render(); }, 250);
    } else {
      saveState();
    }
  } else {
    d.el.style.transition = "transform .2s ease";
    pzSetPos(d.el, piece.tx, piece.ty, piece.k);
  }
}

function pzAdvance(){
  pzAdvancing = false;
  var s = state.session.stainedGlass;
  if(!s || s.status !== "solved") return;
  if(s.round >= PZ_LEVELS.length - 1){
    s.status = "passed";
  } else {
    s.round++; s.placed = []; s.status = "playing";
  }
  saveState();
  if(state.screen === "stainedGlass") render();
}

function pzCollectAward(){ state.session.stainedGlass = null; grantMission("stainedGlass"); }
function pzQuit(){ state.session.stainedGlass = null; pzCtx = null; pzDrag = null; go("mainMenu"); }

function screenStainedGlass(){
  if(!matchTilesReady){
    // same guard as Faith Match: the pictures are the Faith Match tiles, and
    // they are preloaded at app boot, so this is a brief beat at most
    return '<div class="screen center"><p class="smallNote">' + t("fm_loading") + '</p></div>';
  }
  var s = state.session.stainedGlass;
  if(!s){ initStainedGlass(); s = state.session.stainedGlass; }

  if(s.status === "passed"){
    return '<div class="screen center">' +
      '<h1>' + t("pz_passTitle") + '</h1>' +
      '<p>' + t("pz_passBody") + '</p>' +
      '<div class="spacer"></div>' +
      '<button class="btn gold" onclick="pzCollectAward()">' + t("collectAward") + '</button>' +
    '</div>';
  }

  var solved = s.status === "solved", lastLevel = s.round >= PZ_LEVELS.length - 1;
  // Also covers a page reload during the "solved" hold: the pending timer is
  // gone, so schedule the advance again whenever this view is drawn.
  if(solved && !pzAdvancing){ pzAdvancing = true; setTimeout(pzAdvance, PZ_SOLVED_MS); }

  var g = pzBuild(s), img = s.imgs[s.round];
  pzCtx = {n:g.n, pw:g.pw, ph:g.ph, m:g.m, pieces:g.pieces, H:g.H};
  var defs = "", placedHtml = "", looseHtml = "";
  g.pieces.forEach(function(p){
    if(solved) return; // a finished level shows only the whole picture (below), so no piece seams can show
    var isPlaced = s.placed.indexOf(p.id) !== -1;
    defs += '<clipPath id="pzC' + p.id + '"><path d="' + p.d + '"/></clipPath>';
    var x = isPlaced ? p.sx : p.tx, y = isPlaced ? p.sy : p.ty, k = isPlaced ? 1 : p.k;
    var html = '<g class="pzPiece' + (isPlaced ? ' locked' : '') + '" id="pzP' + p.id + '" ' +
      'style="transform:translate(' + x + 'px,' + y + 'px) scale(' + k + ');" ' +
      'onpointerdown="pzDown(event,' + p.id + ')">' +
      // invisible box so a narrow piece is easy to grab anywhere on it
      '<rect x="0" y="0" width="' + g.pw + '" height="' + g.ph + '" fill="transparent"/>' +
      '<image href="' + img + '" x="' + (-p.col*g.pw) + '" y="' + (-p.row*g.ph) + '" width="' + PZ_W + '" height="' + PZ_W + '" preserveAspectRatio="none" clip-path="url(#pzC' + p.id + ')"/>' +
      '<path d="' + p.d + '" class="pzOutline"/>' +
    '</g>';
    if(isPlaced) placedHtml += html; else looseHtml += html;
  });
  // Finished level: the whole picture drawn over the pieces, so no seams or
  // piece lines show for the 3-second hold.
  var full = solved ? '<image class="pzFull" href="' + img + '" x="0" y="0" width="' + PZ_W + '" height="' + PZ_W + '" preserveAspectRatio="none"/>' : '';
  var svg = '<svg id="pzSvg" class="pzSvg' + (solved ? ' solved' : '') + '" viewBox="0 0 ' + PZ_W + ' ' + g.H + '" role="img" aria-label="' + t("stainedGlassName") + '">' +
    '<defs>' + defs + '</defs>' +
    '<rect x="0" y="0" width="' + PZ_W + '" height="' + PZ_W + '" class="pzBoardRect"/>' +
    '<rect x="0" y="' + (PZ_W + 12) + '" width="' + PZ_W + '" height="' + (g.H - PZ_W - 12) + '" rx="10" class="pzTrayRect"/>' +
    placedHtml + looseHtml + full +
  '</svg>';

  return '<div class="screen">' +
    '<h2>' + t("stainedGlassName") + '</h2>' +
    '<p class="smallNote">' + t("pz_round")(s.round+1, PZ_LEVELS.length) + ' &nbsp;|&nbsp; <span id="pzProgress">' + t("pz_pieces")(solved ? g.n : s.placed.length, g.n) + '</span></p>' +
    (solved ? '<p class="pzMsg good">' + t("pz_solved") + '</p>' : '<p class="center pzIntro">' + t("pz_intro") + '</p>') +
    svg +
    (solved && !lastLevel ? '<p class="smallNote center">' + t("pz_next") + '</p>' : '') +
    '<div class="spacer"></div>' +
    '<button class="btn outline" onclick="pzQuit()">' + t("mainMenu") + '</button>' +
  '</div>';
}

/* ---------- Passport ---------- */

// Holds the track's current position in RAW SLOT units (0..PASSPORT_TRACK_SLOTS-1),
// not a page index — slot 0 and the last slot are the phantom clones (see
// PASSPORT_TRACK_SLOTS above), so a real page's own slot is always page+1.
var lastTrackSlot = 1;

function passportNav(delta){
  var raw = state.passportPage + delta;
  var wrapped = raw < 0 || raw > PASSPORT_PAGES-1;
  state.passportPage = (raw + PASSPORT_PAGES) % PASSPORT_PAGES;
  // Which phantom slide (if any) render()'s animation hook should slide
  // THROUGH on its way to the real page — +1 wrapping forward (last page ->
  // first), -1 wrapping backward (first page -> last), 0 for an ordinary step.
  state.passportWrapDelta = wrapped ? delta : 0;
  saveState(); render();
}

var passportTouchStartX = null;
function passportTouchStart(ev){ passportTouchStartX = ev.changedTouches[0].clientX; }
function passportTouchEnd(ev){
  if(passportTouchStartX === null) return;
  var dx = ev.changedTouches[0].clientX - passportTouchStartX;
  passportTouchStartX = null;
  if(dx > 40) passportNav(-1);
  else if(dx < -40) passportNav(1);
}

// TEMPORARY test aid (2026-10-19, per Dan): while true, every Passport badge page shows its badge as
// earned, so all ten 8-bit badges can be checked. Set to false for the real thing (then only badges
// a player has won appear, the rest show a padlock).
var PASSPORT_SHOW_ALL = true;

// The 8-bit version of a mission's badge: tiles/badges8/b8_<name>.png (48x48 pixels, made from the
// artwork in the Badges folder), shown at 4x.
function badge8Src(m){ return m.badgeImg.replace("tiles/badge_", "tiles/badges8/b8_"); }

function passportPageInner(page){
  if(page < MISSIONS.length){
    var m = MISSIONS[page];
    var earned = PASSPORT_SHOW_ALL || state.missions[m.id].badge;
    return '<div class="pxNote">' + t("missionBadge")(page+1) + '</div>' +
      (earned ? '<img class="badge8" src="' + badge8Src(m) + '" alt="">'
              : '<div class="badge8Locked"><img src="tiles/icons/ic_lock.png" alt=""></div>') +
      '<div class="pxBadgeName">' + (earned ? t(m.themeKey) : t("badgeLocked")) + '</div>' +
      '<div class="pxBadgeMission">' + t(m.nameKey) + '</div>';
  }
  return '<div class="pxNote">' + t("joyousPhotoPage") + '</div>' +
    (state.photo ? '<img class="photoPreview pxPhoto" src="' + state.photo + '" alt="">'
                 : '<div class="badge8Locked"><img src="tiles/icons/ic_lock.png" alt=""></div><div class="pxBadgeName">' + t("badgeLocked") + '</div>');
}

// The X: the Passport shrinks back into its icon on the Home Screen.
function closePassport(){
  go("mainMenu");
  var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var tile = document.querySelector(".homeGrid .appIcon:nth-child(2) .appTile");
  if(calm || !tile) return;
  var r = tile.getBoundingClientRect(), c = tile.cloneNode(true);
  c.className = "expandClone";
  c.style.cssText = "left:0px;top:0px;width:" + window.innerWidth + "px;height:" + window.innerHeight + "px;border-radius:0px;background:" + tile.style.background + ";";
  var spr = c.querySelector("img"); if(spr) spr.style.transform = "scale(8)";
  document.body.appendChild(c);
  void c.offsetWidth;
  c.style.left = r.left + "px"; c.style.top = r.top + "px"; c.style.width = r.width + "px"; c.style.height = r.height + "px"; c.style.borderRadius = "16px";
  if(spr) spr.style.transform = "scale(1)";
  setTimeout(function(){ c.style.opacity = "0"; }, 260);
  setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); }, 560);
}

function screenPassport(){
  var page = state.passportPage;
  var dotsHtml = "";
  for(var i=0;i<PASSPORT_PAGES;i++) dotsHtml += '<div class="dot' + (i===page?' active':'') + '"></div>';

  var pageStyle = 'style="width:' + (100/PASSPORT_TRACK_SLOTS) + '%"';
  // Phantom clone of the LAST real page first, then the PASSPORT_PAGES real
  // pages, then a phantom clone of the FIRST real page — see
  // PASSPORT_TRACK_SLOTS above for why. A real page's own slot is always
  // its index + 1.
  var pagesHtml = '<div class="passportPage" ' + pageStyle + '>' + passportPageInner(PASSPORT_PAGES-1) + '</div>';
  for(var i=0;i<PASSPORT_PAGES;i++) pagesHtml += '<div class="passportPage" ' + pageStyle + '>' + passportPageInner(i) + '</div>';
  pagesHtml += '<div class="passportPage" ' + pageStyle + '>' + passportPageInner(0) + '</div>';

  // 8-bit look (2026-10-19, per Dan): the pixel sky, a cream passport page, an X in the corner.
  return '<div class="screen pixHome pixSky pixPassport">' +
    cloudsHtml() +
    '<div class="passHeader">' +
      '<span class="passHeadSpace"></span>' +
      '<h2 class="passTitle">' + t("passportTitle") + '</h2>' +
      '<button class="passClose" onpointerdown="pixPressSfx()" onclick="pixClickSfx();closePassport()" aria-label="' + t("mainMenu") + '">X</button>' +
    '</div>' +
    '<div class="passportBook" ontouchstart="passportTouchStart(event)" ontouchend="passportTouchEnd(event)">' +
      '<div class="passportTrack" id="passportTrack" style="width:' + (PASSPORT_TRACK_SLOTS*100) + '%;transform:translateX(-' + ((page+1)*100/PASSPORT_TRACK_SLOTS) + '%)">' + pagesHtml + '</div>' +
    '</div>' +
    '<div class="dots">' + dotsHtml + '</div>' +
    '<div class="passportNav">' +
      '<button class="navArrow" onpointerdown="pixPressSfx()" onclick="passportNav(-1)" aria-label="Previous">&lt;</button>' +
      '<button class="navArrow" onpointerdown="pixPressSfx()" onclick="passportNav(1)" aria-label="Next">&gt;</button>' +
    '</div>' +
  '</div>';
}

/* ---------- Golden Ticket ---------- */

function clearTicket(){
  state.points = 0;
  MISSIONS.forEach(function(m){ state.missions[m.id].done = false; });
  state.missions.faithMatch.level = 0;
  go("mainMenu");
}

function screenGoldenTicket(){
  return '<div class="screen center">' +
    '<div class="spacer"></div>' +
    '<h1>' + t("ticketTitle") + '</h1>' +
    '<div class="ticketBox"><div class="tk">🎟️</div><strong>FE Y VIDA QUEST</strong></div>' +
    '<p>' + t("ticketBody") + '</p>' +
    '<div class="spacer"></div>' +
    '<button class="btn gold" onclick="clearTicket()">' + t("clearTicket") + '</button>' +
    // Added 2026-09-29, per Dan — previously CLEAR TICKET was the only way
    // off this screen, which meant actually using it (even just to look) was
    // destructive. This one is a plain, non-destructive go('mainMenu') —
    // nothing about points/missions/badges changes — so a player who reaches
    // the Golden Ticket early (5 of 10 missions) can back out and keep
    // playing the remaining ones.
    '<button class="btn outline" onclick="go(\'mainMenu\')">' + t("mainMenu") + '</button>' +
  '</div>';
}

/* ---------- Render ---------- */

var lastRenderedScreen = null;

// Always-visible exit (2026-10-19, per Dan): every mission already had a MAIN
// MENU button, but it sits at the very bottom of the screen and is off-screen
// whenever a game is taller than the phone. This small button stays pinned to
// the top-left while a mission is being played. It is hidden on the finished
// screens (won / lost / solved), which have their own buttons -- and where
// quitting would throw away a win that hasn't been collected yet.
var EXIT_SCREENS = ["faithFlash","faithMatch","beTheLight","chooseJoy","followLight",
  "wordUnscramble","catchLight","kindnessSort","hiddenBlessings","stainedGlass"];
var EXIT_HIDDEN_STATUS = ["results","passed","complete","failed","solved"];

function exitBarHtml(){
  if(EXIT_SCREENS.indexOf(state.screen) === -1) return "";
  var sess = state.session[state.screen];
  if(sess && EXIT_HIDDEN_STATUS.indexOf(sess.status) !== -1) return "";
  return '<div class="exitBar"><button class="exitBtn" onpointerdown="pixPressSfx()" onclick="pixClickSfx();exitMission()" aria-label="' + t("mainMenu") + '">X</button></div>';
}

// Leaves the current mission the same way its own MAIN MENU button does
// (clears its saved game and stops any timers), then shows the Main Menu.
function exitMission(){
  switch(state.screen){
    case "faithFlash": ffQuit(); break;
    case "faithMatch": fmQuit(); break;
    case "chooseJoy": cjQuit(); break;
    case "followLight": flQuit(); break;
    case "wordUnscramble": wuQuit(); break;
    case "catchLight": clQuit(); break;
    case "kindnessSort": ksQuit(); break;
    case "hiddenBlessings": hbQuit(); break;
    case "stainedGlass": pzQuit(); break;
    default: go("mainMenu");
  }
}

function render(){
  var app = document.getElementById("app");
  var html;
  switch(state.screen){
    case "language": html = screenLanguage(); break;
    case "welcome": html = screenWelcome(); break;
    case "mainMenu": html = screenMainMenu(); break;
    case "award": html = screenAward(); break;
    case "faithFlash": html = screenFaithFlash(); break;
    case "faithMatch": html = screenFaithMatch(); break;
    case "beTheLight": html = screenBeTheLight(); break;
    case "stainedGlass": html = screenStainedGlass(); break;
    case "chooseJoy": html = screenChooseJoy(); break;
    case "joyousPhoto": html = screenJoyousPhoto(); break;
    case "followLight": html = screenFollowLight(); break;
    case "wordUnscramble": html = screenWordUnscramble(); break;
    case "catchLight": html = screenCatchLight(); break;
    case "kindnessSort": html = screenKindnessSort(); break;
    case "hiddenBlessings": html = screenHiddenBlessings(); break;
    case "passport": html = screenPassport(); break;
    case "goldenTicket": html = screenGoldenTicket(); break;
    default: html = screenLanguage();
  }
  var isNewScreen = state.screen !== lastRenderedScreen;
  var enteringPassportFresh = state.screen === "passport" && isNewScreen;
  lastRenderedScreen = state.screen;
  app.innerHTML = exitBarHtml() + html;
  if(isNewScreen){
    var el = app.querySelector(".screen");
    if(el) el.classList.add("screen-enter");
  }
  if(state.screen === "mainMenu") pilgrimInit(isNewScreen);
  if(state.screen === "passport"){
    var track = document.getElementById("passportTrack");
    if(track){
      var realSlot = state.passportPage + 1; // slot 0 is the phantom clone of the last page
      if(enteringPassportFresh){
        // First time opening the Passport this visit — snap straight to the
        // target page, no slide-in from whatever page was open last time.
        lastTrackSlot = realSlot;
        track.style.transition = "none";
        track.style.transform = "translateX(-" + (lastTrackSlot*100/PASSPORT_TRACK_SLOTS) + "%)";
      } else if(state.passportWrapDelta){
        // Wrapping (last page -> first, or first -> last): slide through the
        // phantom clone sitting just past the real end in the swiped
        // direction — visually identical to the real target page — then,
        // once the transition finishes, silently (no transition) snap the
        // track to the REAL page's own slot. Undetectable to the eye since
        // the phantom and the real page render identical content; avoids
        // both an instant snap (what Dan reported — no visible scroll at
        // all) and a long backward scroll across every page in between.
        var phantomSlot = state.passportWrapDelta > 0 ? PASSPORT_TRACK_SLOTS-1 : 0;
        track.style.transition = "none";
        track.style.transform = "translateX(-" + (lastTrackSlot*100/PASSPORT_TRACK_SLOTS) + "%)";
        void track.offsetWidth; // force reflow so the transition below actually starts from here
        requestAnimationFrame(function(){
          track.style.transition = "transform .32s ease";
          track.style.transform = "translateX(-" + (phantomSlot*100/PASSPORT_TRACK_SLOTS) + "%)";
        });
        lastTrackSlot = realSlot;
        setTimeout(function(){
          if(!track.isConnected) return; // the user already navigated away/re-rendered — nothing to fix up
          track.style.transition = "none";
          track.style.transform = "translateX(-" + (realSlot*100/PASSPORT_TRACK_SLOTS) + "%)";
        }, 340);
      } else {
        // Start the freshly-inserted track at the PREVIOUS page (no
        // transition yet, so this is invisible), then animate to the new
        // page on the next frame — full DOM replacement on every render
        // means a transform set once at insertion never animates on its own.
        track.style.transition = "none";
        track.style.transform = "translateX(-" + (lastTrackSlot*100/PASSPORT_TRACK_SLOTS) + "%)";
        void track.offsetWidth; // force reflow so the transition below actually starts from here
        requestAnimationFrame(function(){
          track.style.transition = "transform .32s ease";
          track.style.transform = "translateX(-" + (realSlot*100/PASSPORT_TRACK_SLOTS) + "%)";
        });
        lastTrackSlot = realSlot;
      }
    }
  }
  // Catch the Light runs its falling-icon animation via direct DOM writes
  // (see clStart()), not through this render() pipeline, so a mid-round
  // re-render never wipes out in-flight icons. The one case that DOES need
  // to (re)start the loop from here is a genuine page reload landing back on
  // this screen mid-round (e.g. the tab was discarded under memory pressure)
  // — clRunning is a fresh `false` in that case since it's a brand-new script
  // instance, so this picks the round back up (with whatever score/misses/
  // time was last saved) instead of leaving the stage empty and frozen. The
  // "GET READY" countdown (clReadyRunning) gets the same treatment for a
  // reload landing mid-countdown.
  var clSession = state.session.catchLight;
  if(state.screen === "catchLight" && clSession && clSession.status === "playing"){
    if(clSession.phase === "playing" && !clRunning) clStart();
    else if(clSession.phase === "ready" && !clReadyRunning) clRunReadyCountdown();
  }
}

document.getElementById("cameraInput").addEventListener("change", handlePhotoCapture);
window.addEventListener("pagehide", saveState);
window.addEventListener("visibilitychange", saveState);

render();
// Kicked off at boot, not when Faith Match is opened (2026-09-29, per Dan —
// the first tile tapped showed blank white until its image finished
// loading). Starting the fetch this early gives it the whole language
// select -> welcome -> main menu detour most players take before ever
// reaching Faith Match to finish in the background; openMission('faithMatch')
// still calls this too, but preloadMatchTiles() is idempotent
// (matchTilesPreloaded guards it) so that call is now just a harmless no-op
// safety net for the rare case someone reaches it before this finishes.
preloadMatchTiles();
</script>
</body>
</html>
